# ===========================================================================
#  wrangler.toml — Redion als Cloudflare Worker mit statischen Dateien
# ---------------------------------------------------------------------------
#  Cloudflare hat aus dem Repository ein Worker-Projekt gemacht und ruft
#  beim Veroeffentlichen  npx wrangler deploy  auf. Diese Datei sagt ihm,
#  was er dabei tun soll:
#
#    main     der Einstiegspunkt. Er beantwortet /api/* selbst und reicht
#             alles andere an die Dateiablage weiter.
#    assets   die Projektwurzel. Sie nimmt ALLES, was hier liegt - was
#             draussen bleiben soll, steht in `.assetsignore`.
#
#  HIER STAND EINE FALSCHE BEHAUPTUNG (E270). Es hiess: "Alles andere -
#  der Worker selbst, die Anleitungen, die .git-Ablage - bleibt draussen."
#  Es blieb nichts draussen. Gemessen mit `npx wrangler deploy --dry-run`:
#  8318 Dateien gelesen, danach Abbruch, weil `.git/objects/pack/...`
#  78,6 MB gross ist und Cloudflare bei 25 MB je Datei aufhoert.
#  Veroeffentlichen war damit gar nicht moeglich - und waere es moeglich
#  gewesen, haette es `src/`, `pruefungen/`, `node_modules/` und eine
#  etwaige `.env` mit ins Netz genommen (§42).
#
#  `.gitignore` hilft dabei NICHT: Wrangler liest `.assetsignore`. Seit
#  E270 gibt es sie, und der Lauf geht durch.
#
#  Von Hand veroeffentlichen geht auch:
#      npm install -g wrangler
#      wrangler login
#      wrangler deploy --dry-run     # sagt, wie viele Dateien mitgehen
#      wrangler deploy
# ===========================================================================

name = "redion"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./"
binding = "ASSETS"

# ===========================================================================
#  D1 — die Datenbank fuer Konten, Abgleich und Rechte
# ---------------------------------------------------------------------------
#  Diese vier Zeilen sind auskommentiert, weil die database_id bei jedem
#  anders ist. Sie entsteht mit
#
#      npx wrangler d1 create redion
#
#  und wird dann hier eingetragen. Ohne sie laeuft der Worker trotzdem —
#  er sagt dann bei /api/stand, dass die Datenbank fehlt, und Redion
#  arbeitet weiter rein auf dem Geraet.
#
#  ACHTUNG: Die Rauten erst wegnehmen, wenn eine ECHTE Kennung dasteht.
#  Cloudflare prueft die Bindung beim Veroeffentlichen gegen das Konto —
#  mit dem Platzhalter bricht `wrangler deploy` ab, und der Worker bleibt
#  auf dem alten Stand. Auskommentiert-bleiben ist also kein Versaeumnis,
#  sondern die einzige Form, in der die Datei VOR `d1 create` deploybar
#  ist. Ohne Bindung antwortet der Server ehrlich (server/cloudflare.ts).
#
#  DARF DIE KENNUNG INS REPOSITORY? Ja. Sie ist kein Geheimnis nach §42 —
#  kein Token, kein Schluessel, kein Passwort, und ohne Zugang zum Konto
#  nutzlos. Wenn Cloudflare aus GitHub baut, MUSS sie sogar mit: sonst
#  veroeffentlicht der naechste Push einen Worker ohne Datenbank.
#  Die echten Geheimnisse stehen nie hier, sondern hinter
#  `wrangler secret put` (ADRESSE, GITHUB_GEHEIM, GOOGLE_GEHEIM,
#  VAPID_PRIVAT).
#
#  Die ganze Anleitung steht in SERVER-EINRICHTEN.md.
# ===========================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "redion"
# database_id = "hier-die-eigene-einsetzen"

# ===========================================================================
#  R2 — die Ablage fuer Anhaenge (Bilder, PDFs, Videos)
# ---------------------------------------------------------------------------
#  Grosse Dateien gehoeren nicht in D1 (E2). Der Bucket entsteht mit
#
#      npx wrangler r2 bucket create redion-dateien
#
#  und wird dann hier eingebunden. Ohne ihn laeuft alles Uebrige weiter —
#  die /datei-Wege sagen dann 503 mit genau diesem Hinweis, und Redion
#  gleicht Saetze ab, aber keine Anhaenge.
#
#  ACHTUNG: dieselbe Regel wie oben — die Rauten erst weg, wenn der Bucket
#  wirklich angelegt ist. Sonst bricht `wrangler deploy` ab.
#
#  Nachsehen laesst es sich jederzeit: `/api/stand` nennt seit E270 auch
#  den Dateispeicher ("dateien": "r2" oder "keine"), und in Redion sagt es
#  der Knopf Wolke → Server pruefen in Worten.
# ===========================================================================
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "redion-dateien"

# ===========================================================================
#  WECKRUFE — Web Push (L33, E54)
# ---------------------------------------------------------------------------
#  Damit eine Erinnerung auch klingelt, wenn Redion geschlossen ist, muss
#  jemand zur richtigen Zeit anstossen. Das tut der geplante Lauf.
#
#  Eine Minute ist die kleinste Aufloesung, die Cron erlaubt, und fuer einen
#  Wecker genau genug: "08:00" darf 08:00:40 heissen, aber nicht 08:05.
#
#  Auskommentiert, weil es ohne VAPID-Schluessel nichts zu tun gaebe. Wer
#  Weckrufe will, setzt zuerst die Schluessel und nimmt dann das Kommentar-
#  zeichen weg:
#
#      npx web-push generate-vapid-keys
#      npx wrangler secret put VAPID_OEFFENTLICH
#      npx wrangler secret put VAPID_PRIVAT
#      npx wrangler secret put VAPID_ABSENDER      # mailto:du@example.com
#
#  WAS DABEI AN DEN SERVER GEHT, ist ein Zeitpunkt - nicht der Text der
#  Erinnerung, nicht die Seite, nicht der Grund. Der Stoss sagt nur
#  "wach auf"; was faellig ist, liest das Dienst-Skript auf dem Geraet.
# ===========================================================================
# [triggers]
# crons = ["* * * * *"]
