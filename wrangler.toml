# ===========================================================================
#  wrangler.toml — Redion als Cloudflare Worker mit statischen Dateien
# ---------------------------------------------------------------------------
#  Cloudflare hat aus dem Repository ein Worker-Projekt gemacht und ruft
#  beim Veroeffentlichen  npx wrangler deploy  auf. Diese Datei sagt ihm,
#  was er dabei tun soll:
#
#    main     der Einstiegspunkt. Er beantwortet /api/* selbst und reicht
#             alles andere an die Dateiablage weiter.
#    assets   die Projektwurzel. Sie nimmt ALLES, was hier liegt - was
#             draussen bleiben soll, steht in `.assetsignore`.
#
#  HIER STAND EINE FALSCHE BEHAUPTUNG (E270). Es hiess: "Alles andere -
#  der Worker selbst, die Anleitungen, die .git-Ablage - bleibt draussen."
#  Es blieb nichts draussen. Gemessen mit `npx wrangler deploy --dry-run`:
#  8318 Dateien gelesen, danach Abbruch, weil `.git/objects/pack/...`
#  78,6 MB gross ist und Cloudflare bei 25 MB je Datei aufhoert.
#  Veroeffentlichen war damit gar nicht moeglich - und waere es moeglich
#  gewesen, haette es `src/`, `pruefungen/`, `node_modules/` und eine
#  etwaige `.env` mit ins Netz genommen (§42).
#
#  `.gitignore` hilft dabei NICHT: Wrangler liest `.assetsignore`. Seit
#  E270 gibt es sie, und der Lauf geht durch.
#
#  Von Hand veroeffentlichen geht auch:
#      npm install -g wrangler
#      wrangler login
#      wrangler deploy --dry-run
#      wrangler deploy
# ===========================================================================

# DER WORKER HEISST  red-ion , NICHT  redion  (E520).
# Cloudflare hat das Projekt beim Anlegen  red-ion  genannt; hier stand
# `redion`. Wrangler hat den Namen jedes Mal überschrieben und gewarnt:
#     "Failed to match Worker name … Overriding using the CI provided
#      Worker name."
# Es lief trotzdem — aber eine Warnung, die bei jedem Bau kommt, liest nach
# der dritten Woche niemand mehr, und dann übersieht man die daneben. Der
# Name steht jetzt so da, wie er bei Cloudflare heisst.
#
# ACHTUNG, ZWEI VERSCHIEDENE NAMEN: der hier ist der WORKER.
# `database_name` weiter unten ist die D1-Datenbank und heisst weiterhin
# `redion` — sie umzubenennen wäre eine andere Datenbank.
name = "red-ion"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./"
binding = "ASSETS"
# Auch vorhandene HTML/JS/CSS-Dateien müssen vor der Auslieferung durch das Access-Tor.
run_worker_first = true

# ===========================================================================
#  D1 — die Datenbank fuer Konten, Abgleich und Rechte
# ---------------------------------------------------------------------------
#  Diese Datenbank ist fuer Redion aktiviert.
#
#  Datenbankname:
#      redion
#
#  Die database_id ist keine geheime Zugangsinformation.
#  Geheimnisse gehoeren weiterhin in Cloudflare Secrets.
# ===========================================================================

# ══ STILLGELEGT AM 9. SEPTEMBER 2026 (E522, L143) ═══════════════════════════
#
#  DIESE DATENBANK GIBT ES NICHT. Zweimal gemessen, an zwei Deploys:
#
#      ✘ [ERROR] D1 binding 'DB' references database
#        '2a4f6708-b7e7-43c5-9e18-17b33713dbb9' which was not found.
#
#  Die Kennung steht seit E323 hier und gehoert zu keiner Datenbank in
#  Redurs Konto. Solange sie so dasteht, scheitert JEDER Deploy - und dann
#  ist gar nichts im Netz, auch nicht der Teil, der ohne Datenbank liefe.
#
#  Redion ist local-first; der Server ist freiwillig (Paragraph 22).
#  Nachgesehen in server/cloudflare.ts: `if (!env || !env.DB)` ist ein
#  eigener Zweig, und /api/stand antwortet auch dort. Ohne diese Bindung
#  laeuft also alles ausser Konto, Abgleich und Rechte - und die laufen mit
#  einer Kennung, die ins Leere zeigt, ohnehin nicht.
#
#  WIEDER ANSCHALTEN, wenn die Datenbank da ist:
#      npx wrangler d1 list            gibt es sie schon?
#      npx wrangler d1 create redion   sonst anlegen, gibt die Kennung aus
#  Dann die vier Zeilen unten wieder freimachen und die neue Kennung
#  eintragen. Sonst nichts.
#
#  AM 12. SEPTEMBER 2026 NACHGESEHEN — UND L143 STAND KOPF (E530).
#  `npx wrangler d1 list` fand die Datenbank, und zwar mit GENAU der
#  Kennung, die seit E323 hier stand:
#
#      uuid  2a4f6708-b7e7-43c5-9e18-17b33713dbb9
#      name  redion       angelegt 2026-09-02      0 Tabellen
#
#  L143 behauptete, diese Kennung gehöre zu keiner Datenbank. Falsch. Sie
#  gehört zu einer — nur in KONTO 90a488aa2d0abf7c254f797d5b1aa575
#  (redbbt7@gmail.com), und der gescheiterte Deploy lief gegen 56cd8e4d….
#  Nicht die Kennung war falsch, das Konto war ein anderes.
#
#  UND SIE BLEIBT TROTZDEM DRAUSSEN. Redur am 12. September: „es sollte
#  nicht im konto redbbt7 sein". Eine Kennung aus dem falschen Konto hier
#  einzutragen, hiesse denselben Deploy-Fehler noch einmal zu bauen — der
#  Worker findet eine Datenbank nur in SEINEM Konto. Die Zeilen bleiben
#  also aus, bis eine Kennung aus dem richtigen Konto da ist.
#
#  SO KOMMT SIE ZUSTANDE — im richtigen Konto angemeldet:
#      npx wrangler logout
#      npx wrangler login            (mit dem Konto, in dem red-ion lebt)
#      npx wrangler whoami           Konto-Kennung notieren
#      npx wrangler d1 list          gibt es sie dort schon?
#      npx wrangler d1 create redion sonst anlegen
#  Danach die vier Zeilen unten freimachen und die Kennung eintragen; das
#  Schema kommt mit
#      npx wrangler d1 execute redion --remote --file=server/schema.sql
#
# 19. NOVEMBER 2026: Im Cloudflare-Konto des produktiven red-ion Workers
# unter Settings > Bindings die bereits bestehende D1-Datenbank redion
# manuell als DB gebunden. Die ID stammt aus der Cloudflare-Oberflaeche
# desselben Worker-Projekts. Kein neues Konto und keine neue DB erstellt.
# Diesen Eintrag bei jedem kuenftigen git-basierten Deployment beibehalten.
[[d1_databases]]
binding = "DB"
database_name = "redion"
database_id = "18b0f926-e522-4b77-8063-ca3399c478ae"

# ===========================================================================
#  R2 — die Ablage fuer Anhaenge (Bilder, PDFs, Videos)
# ---------------------------------------------------------------------------
#  Grosse Dateien gehoeren nicht in D1.
#
#  Der Bucket entsteht mit:
#
#      npx wrangler r2 bucket create redion-dateien
#
#  Danach diesen Block aktivieren:
#
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "redion-dateien"
#
#  Ohne R2 funktioniert Redion weiterhin, aber Anhaenge bleiben lokal
#  beziehungsweise die Datei-API meldet, dass R2 fehlt.
# ===========================================================================

#  AM 12. SEPTEMBER: `npx wrangler r2 bucket create redion-dateien`
#  antwortete „The bucket you tried to create already exists, and you own
#  it". Der Eimer steht also — aber im SELBEN Konto wie die Datenbank oben,
#  und das ist nicht das, in dem Redion leben soll. Ein Eimername ist im
#  Gegensatz zur Datenbank-Kennung kontounabhängig geschrieben; ob er im
#  richtigen Konto existiert, sagt erst
#      npx wrangler r2 bucket list
#  dort. Deshalb bleibt auch diese Bindung aus, bis das feststeht.
#
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "redion-dateien"

# ===========================================================================
#  WECKRUFE — Web Push
# ---------------------------------------------------------------------------
#  Fuer Push-Erinnerungen koennen spaeter VAPID-Schluessel und ein Cron
#  aktiviert werden.
#
#      npx web-push generate-vapid-keys
#      npx wrangler secret put VAPID_OEFFENTLICH
#      npx wrangler secret put VAPID_PRIVAT
#      npx wrangler secret put VAPID_ABSENDER
#
#  Danach:
#
# [triggers]
# crons = ["* * * * *"]
# ===========================================================================

# [triggers]
# crons = ["* * * * *"]