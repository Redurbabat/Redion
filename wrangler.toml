# ===========================================================================
#  wrangler.toml — Redion als Cloudflare Worker mit statischen Dateien
# ---------------------------------------------------------------------------
#  Cloudflare hat aus dem Repository ein Worker-Projekt gemacht und ruft
#  beim Veroeffentlichen  npx wrangler deploy  auf. Diese Datei sagt ihm,
#  was er dabei tun soll:
#
#    main     der Einstiegspunkt. Er beantwortet /api/* selbst und reicht
#             alles andere an die Dateiablage weiter.
#    assets   die Projektwurzel mit den Dateien der App. Alles andere -
#             der Worker selbst, die Anleitungen, die .git-Ablage - bleibt
#             draussen. Das ist wichtig: die .git-Ablage enthaelt eine Datei
#             ueber 25 MB, und daran ist der erste Versuch gescheitert.
#
#  Von Hand veroeffentlichen geht auch:
#      npm install -g wrangler
#      wrangler login
#      wrangler deploy
# ===========================================================================

name = "redion"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./"
binding = "ASSETS"

# ===========================================================================
#  D1 — die Datenbank fuer Konten, Abgleich und Rechte
# ---------------------------------------------------------------------------
#  Diese vier Zeilen sind auskommentiert, weil die database_id bei jedem
#  anders ist. Sie entsteht mit
#
#      npx wrangler d1 create redion
#
#  und wird dann hier eingetragen. Ohne sie laeuft der Worker trotzdem —
#  er sagt dann bei /api/stand, dass die Datenbank fehlt, und Redion
#  arbeitet weiter rein auf dem Geraet.
#
#  Die ganze Anleitung steht in SERVER-EINRICHTEN.md.
# ===========================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "redion"
# database_id = "hier-die-eigene-einsetzen"

# ===========================================================================
#  R2 — die Ablage fuer Anhaenge (Bilder, PDFs, Videos)
# ---------------------------------------------------------------------------
#  Grosse Dateien gehoeren nicht in D1 (E2). Der Bucket entsteht mit
#
#      npx wrangler r2 bucket create redion-dateien
#
#  und wird dann hier eingebunden. Ohne ihn laeuft alles Uebrige weiter —
#  die /datei-Wege sagen dann 503 mit genau diesem Hinweis.
# ===========================================================================
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "redion-dateien"
