# Codemagic: kostenloser manueller iPhone-Build auf macOS M2.
# Die IPA ist UNSIGNIERT und muss vor der Installation signiert werden.
workflows:
  redion-ios-unsigned:
    name: Redion iPhone IPA (unsigniert)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: v22.20.0
      xcode: latest
    triggering:
      events: [] # Nur manuell starten; verbraucht keine Minuten bei jedem Push.
    scripts:
      - name: Redion aus TypeScript bauen
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Echter WebKit-SDK-Vertrag; -frontend -parse erkennt falsche API-Labels nicht.
          node --test ios/webkit-call-contract.test.mts
          # Vite-8-Peer-Abgleich vor dem Build pruefen (npm ERESOLVE abfangen).
          node --test ios/codemagic-dependency-versions.test.mjs
          npm run bauen:ts
          # Bestehende PDF- und Office-Exporte unter Web und iOS pruefen.
          node --test ios/generated-download-routing.test.mjs
          # Auch Windows-Dateimuster des UI-Kit-Typechecks gegenpruefen.
          node --test pruefungen/ts-glob-pfad.test.mjs
          node --test ios/backup-chunks.test.mjs
          # Windows- und Unix-Stellvertretungen fuer Redions lokalen OCR-Test.
          node --test pruefungen/ocr-test-stub.test.mjs
          node --test ios/native-file-export.test.mjs
          node --test ios/native-feel.test.mjs
          node --test ios/native-layout.test.mts
          node --test ios/install-native-glass-dock.test.mjs
          # Foreground-Rueckkehr, Unicode-Dateinamen und sichere Temp-Dateien.
          node --test ios/native-lifecycle-export.test.mjs
          # Simulierte verzögerte UIKit-Antworten und App-Wechsel.
          node --test ios/native-statusbar-queue.test.mjs
          node --test ios/native-viewport-resume.test.mjs
          # Erfolgshaptik nach nativen Exporten und iPhone-PDF-Tastaturhoehe.
          node --test ios/native-export-feedback.test.mjs
          node --test ios/native-mobile-document.test.mjs
          # Native Touch-Regressionsschutz: Geste nicht nach einem Zweitfinger haengen lassen.
          node --test pruefungen/wischen-multitouch.test.mjs
          node --test ios/native-safari-links.test.mjs
          # Native iOS-Appsymbol-Schnellaktionen: Kaltstart, Warmstart, Web-Paritaet.
          node --test ios/home-shortcuts.test.mjs
          # Share-Sheet-Eingang + WidgetKit: sichere iOS-only Tests.
          node --test ios/incoming-share.test.mjs
          node --test ios/incoming-share-store-contract.test.mjs
          node --test ios/share-widget-integration.test.mjs
          node --test ios/share-widget-xcode-build.test.mjs
          node --test ios/widget-orbit.test.mjs
          node --test ios/install-privacy-shield.test.mjs
          # Die iOS-Quellen im Repo und das neue Xcode-Ziel muessen getrennt bleiben.
          node --test ios/native-project-layout.test.mjs
          # Native Startansicht nur im iPhone-Xcode-Projekt, mit echten Farben.
          node --test ios/install-launch-screen.test.mjs
          # Pruefe reale Capacitor-8-SPM-Templates auf Swift/Storyboard-Kompatibilitaet.
          node --test ios/capacitor8-spm-native-integration.test.mjs

      - name: Lokale Web-Dateien fuer Capacitor bereitstellen
        script: |
          set -euo pipefail
          mkdir -p www
          cp index.html sw.js www/
          for ordner in quell oeffentlich fremd lernpakete lernen; do
            if [ -d "$ordner" ]; then
              cp -R "$ordner" www/
            fi
          done
          test -f www/index.html

      - name: iOS-Projekt mit Capacitor 8 erzeugen
        script: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 \
            @capacitor/filesystem@8 @capacitor/share@8 @capacitor/haptics@8 @capacitor/browser@8 esbuild@0.28.2
          # Capacitor erkennt --no-save-Plugins nur ueber includePlugins.
          # Vor dem nativen Build muessen alle vier wirklich installiert sein.
          node -e "const fs=require('fs');const c=require('./capacitor.config.json');for(const p of c.includePlugins || []){if(!fs.existsSync('node_modules/'+p+'/package.json')){throw Error('Native Capacitor-Abhaengigkeit fehlt: '+p)}}"
          npx esbuild ios/native-sicherung.ts \
            --bundle --platform=browser --format=iife --target=es2022 \
            --outfile=www/redion-native-sicherung.js
          node ios/vorbereiten.mjs
          # Gemeinsame Redion-Weboberflaeche MUSS bytegleich bleiben.
          # Nur der iOS-native Export darf im IPA zusaetzlich sein.
          node --test ios/vergleiche-webstand.test.mjs
          node ios/vergleiche-webstand.mjs
          # Der bestehende ios/-Ordner enthaelt unsere TS/Swift-Skripte.
          # Capacitor 8 darf dort KEIN Xcode-Projekt erzeugen oder etwas loeschen.
          # capacitor.config.json: ios.path = build/ios-capacitor
          test -f ios/native-sicherung.ts
          test -f ios/privacy-shield.swift
          mkdir -p build
          test ! -e build/ios-capacitor || {
            echo "Fehler: generiertes iOS-Projekt existiert bereits. Frischen Codemagic-Checkout verwenden." >&2
            exit 1
          }
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          test -f build/ios-capacitor/App/App/AppDelegate.swift
          test -f build/ios-capacitor/App/App.xcodeproj/project.pbxproj
          # Vor JEDEM nativen Patch die tatsaechlich generierten UIKit-/Swift-
          # Vorlagen pruefen. Dieser Schritt liest nur; kein Projekt wird veraendert.
          node ios/preflight-native-templates.mjs
          test -f ios/native-sicherung.ts

      - name: iPhone-Datenschutzschirm nur in Swift einbauen
        script: |
          set -euo pipefail
          # UIKit wird nur in die bereits kompilierte AppDelegate eingefuegt,
          # NICHT in die Website, PWA oder gemeinsame Redion-Weboberflaeche.
          node ios/install-privacy-shield.mjs
          grep -q 'RedionPrivacyShield.start()' build/ios-capacitor/App/App/AppDelegate.swift
          grep -q 'redion-snapshot-privacy-cover' build/ios-capacitor/App/App/AppDelegate.swift

      - name: Originale Apple UITabBar einbauen (ohne native Seiten)
        script: |
          set -euo pipefail
          node ios/install-native-glass-dock.mjs
          SWIFT="build/ios-capacitor/App/App/AppDelegate.swift"
          grep -q 'RedionNativeDock.start()' "$SWIFT"
          grep -q 'UITabBar(frame: .zero)' "$SWIFT"
          # No SwiftUI overlay views: the five existing web screens remain visible.
          if grep -Eq 'RedionNativeMoreView|RedionNativeLibraryCoordinator|RedionNativeEditorModel' "$SWIFT"; then
            echo "Unexpected native page overlay in dock-only build" >&2
            exit 1
          fi
          xcrun swiftc -frontend -parse "$SWIFT"

      - name: iPhone-Startbildschirm mit echtem Redion-Symbol
        script: |
          set -euo pipefail
          # Nur das von Capacitor erzeugte UIKit-Storyboard bearbeiten.
          # Keine Aenderung an index.html, PWA oder Redions ios/-Quellen.
          node ios/install-launch-screen.mjs
          test -f build/ios-capacitor/App/App/Base.lproj/LaunchScreen.storyboard
          test -f build/ios-capacitor/App/App/Assets.xcassets/RedionLaunchIcon.imageset/Contents.json
          test -f build/ios-capacitor/App/App/Assets.xcassets/RedionLaunchBackground.colorset/Contents.json
          test -f build/ios-capacitor/App/App/Assets.xcassets/RedionLaunchText.colorset/Contents.json
          # IB-Lint: validates the real storyboard on the same macOS/Xcode
          # machine used for packaging. Fail before xcodebuild if invalid.
          mkdir -p "$CM_BUILD_DIR/build"
          xcrun ibtool --errors --warnings --notices \
            --compile "$CM_BUILD_DIR/build/redion-launch-check.storyboardc" \
            build/ios-capacitor/App/App/Base.lproj/LaunchScreen.storyboard \
            2>&1 | tee "$CM_BUILD_DIR/build/ios-ibtool.log"

      - name: Sicherungen in der iOS-Dateien-App sichtbar machen
        script: |
          set -euo pipefail
          PLIST="build/ios-capacitor/App/App/Info.plist"
          test -f "$PLIST"
          for schluessel in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace UIViewControllerBasedStatusBarAppearance; do
            /usr/libexec/PlistBuddy -c "Add :$schluessel bool true" "$PLIST" || \
              /usr/libexec/PlistBuddy -c "Set :$schluessel true" "$PLIST"
          done
          # The built-in Capacitor SystemBars API changes status-bar text
          # with html[data-theme]; preserve the iPhone clock and battery.
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden false" "$PLIST"


      - name: iPhone-Appsymbol-Schnellaktionen (Neue Seite, Dokumente, Heute, Lernen)
        script: |
          set -euo pipefail
          # Nur die generierte UIScene-Vorlage und Info.plist anpassen,
          # niemals den versionskontrollierten Redion-ios/-Quellordner.
          node ios/install-home-shortcuts.mjs
          SCENE="build/ios-capacitor/App/App/SceneDelegate.swift"
          PLIST="build/ios-capacitor/App/App/Info.plist"
          grep -q 'REDION_NATIVE_HOME_SHORTCUTS' "$SCENE"
          grep -q 'completionHandler(handled)' "$SCENE"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationShortcutItems:0:UIApplicationShortcutItemType' "$PLIST" |
            grep -qx 'ch.redurbabat.redion.neu'
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationShortcutItems:3:UIApplicationShortcutItemType' "$PLIST" |
            grep -qx 'ch.redurbabat.redion.lernen'

      - name: Redion aus anderen Apps teilen und iPhone-Widgets (Vorschau)
        script: |
          set -euo pipefail
          # Separates Xcode-Ziel braucht beim spaeteren Signieren ein Apple
          # Developer App-Group-Profil fuer App + Share Extension.
          # Bis zur Geräte-/Signing-Abnahme opt-in, damit der bestehende
          # unsignierte iPhone-Build auf keinen Fall unbemerkt ausfällt.
          if [ "${REDION_IOS_EXTENSIONS:-0}" != "1" ]; then
            echo "Share Extension/WidgetKit noch nicht aktiviert: REDION_IOS_EXTENSIONS=1"
            exit 0
          fi
          # Swift-Syntax frueh auf dem echten macOS-Xcode-Host pruefen.
          # Dies ersetzt NICHT die WidgetKit-/Signing-Kompilierung.
          xcrun swiftc -frontend -parse ios/widgets/RedionWidgets.swift
          xcrun swiftc -frontend -parse ios/share-extension/RedionShareViewController.swift
          ruby -e 'require "xcodeproj"; abort if Gem::Version.new(Xcodeproj::VERSION) < Gem::Version.new("1.27.0")' ||
            gem install xcodeproj -v 1.27.0 --no-document --user-install
          node ios/install-incoming-share-widget.mjs
          # Real generated UIScene includes BOTH Quick Actions and Share bridge.
          xcrun swiftc -frontend -parse build/ios-capacitor/App/App/SceneDelegate.swift
          ruby -c ios/install-share-widget-targets.rb
          ruby ios/install-share-widget-targets.rb
          test -f build/ios-capacitor/App/RedionShare/RedionShareViewController.swift
          test -f build/ios-capacitor/App/RedionWidgets/RedionWidgets.swift
          grep -q 'RedionShare' build/ios-capacitor/App/App.xcodeproj/project.pbxproj
          grep -q 'RedionWidgets' build/ios-capacitor/App/App.xcodeproj/project.pbxproj

      - name: PDF und Redion-Dateien aus der Dateien-App übernehmen
        script: |
          set -euo pipefail
          node --test ios/native-documents.test.mts
          node ios/install-open-documents.mts
          xcrun swiftc -frontend -parse build/ios-capacitor/App/App/SceneDelegate.swift

      - name: Redion-Appsymbol verwenden
        script: |
          set -euo pipefail
          ICONSET="build/ios-capacitor/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -s format png -z 1024 1024 \
            oeffentlich/icons/icon-512.png \
            --out "$ICONSET/AppIcon-512@2x.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-512@2x.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF

      - name: iPhone-App ohne Code-Signierung kompilieren
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project build/ios-capacitor/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-derived-data" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/build/ios-xcodebuild.log"
          APP="$CM_BUILD_DIR/build/ios-derived-data/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          # Never report a working share/widget build merely because the
          # main App.app exists. Check BOTH embedded, compiled appex products.
          if [ "${REDION_IOS_EXTENSIONS:-0}" = "1" ]; then
            for extension in RedionShare RedionWidgets; do
              EXT="$APP/PlugIns/$extension.appex"
              test -d "$EXT"
              test -f "$EXT/Info.plist"
              EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")"
              test -n "$EXECUTABLE"
              test -f "$EXT/$EXECUTABLE"
              if [ "$extension" = RedionShare ]; then
                POINT="com.apple.share-services"
                BUNDLE="ch.redurbabat.redion.share"
              else
                POINT="com.apple.widgetkit-extension"
                BUNDLE="ch.redurbabat.redion.widgets"
              fi
              test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "$POINT"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")" = "$BUNDLE"
            done
            echo "Redion iOS: Beide Erweiterungen kompiliert und in App.app/PlugIns eingebettet."
          fi
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          ditto "$APP" "$CM_BUILD_DIR/build/ipa/Payload/App.app"
          cd "$CM_BUILD_DIR/build/ipa"
          /usr/bin/zip -qry Redion-unsigned.ipa Payload

    artifacts:
      - build/ipa/Redion-unsigned.ipa
      - build/ios-xcodebuild.log
      - build/ios-ibtool.log
      - build/ios-web-paritaet.json
