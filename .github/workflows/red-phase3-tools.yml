name: RED Phase 3 tools
on:
  pull_request:
    paths:
      - 'doku/RED-ION-MASTER.md'
      - 'tools/red-video*'
      - 'pruefungen/red-video-browser.test.mts'
      - 'tools/red-developer-check.mts'
      - 'tools/red-file-disk-sink.mts'
      - 'tools/red-sync-sqlite.mts'
      - 'tools/red-windows-sync-keys.cts'
      - 'pruefungen/red-windows-sync-keys.test.cts'
      - 'pruefungen/red-sync-sqlite.test.mts'
      - 'pruefungen/red-phase3-tools.test.mts'
      - 'red-sdk/**'
      - '.github/workflows/red-phase3-tools.yml'
  push:
    branches: [main]
    paths:
      - 'tools/red-video*'
      - 'pruefungen/red-video-browser.test.mts'
      - 'tools/red-developer-check.mts'
      - 'tools/red-file-disk-sink.mts'
      - 'tools/red-sync-sqlite.mts'
      - 'tools/red-windows-sync-keys.cts'
      - 'pruefungen/red-windows-sync-keys.test.cts'
      - 'pruefungen/red-sync-sqlite.test.mts'
      - 'pruefungen/red-phase3-tools.test.mts'
      - 'red-sdk/**'
      - '.github/workflows/red-phase3-tools.yml'
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test pruefungen/red-phase3-tools.test.mts pruefungen/red-sync-sqlite.test.mts pruefungen/red-windows-sync-keys.test.cts
      - run: node tools/red-developer-check.mts
      - run: node tools/red-video-preview.mts tools/red-video-example.json red-video-preview.html
      - name: Install browser test dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        if: matrix.os == 'ubuntu-24.04'
        run: npx playwright install --with-deps chromium
      - name: Real browser playback and injection regression
        if: matrix.os == 'ubuntu-24.04'
        run: node --test pruefungen/red-video-browser.test.mts
