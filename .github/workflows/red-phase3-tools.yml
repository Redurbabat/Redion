name: RED Phase 3 tools
on:
  pull_request:
    paths:
      - 'tools/red-video*'
      - 'tools/red-developer-check.mts'
      - 'tools/red-file-disk-sink.mts'
      - 'pruefungen/red-phase3-tools.test.mts'
      - 'red-sdk/**'
      - '.github/workflows/red-phase3-tools.yml'
  push:
    branches: [main]
    paths:
      - 'tools/red-video*'
      - 'tools/red-developer-check.mts'
      - 'tools/red-file-disk-sink.mts'
      - 'pruefungen/red-phase3-tools.test.mts'
      - 'red-sdk/**'
      - '.github/workflows/red-phase3-tools.yml'
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test pruefungen/red-phase3-tools.test.mts
      - run: node tools/red-developer-check.mts
      - run: node tools/red-video-preview.mts tools/red-video-example.json red-video-preview.html
