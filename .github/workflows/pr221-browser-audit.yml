name: PR221 OAuth browser security validation
on:
  push:
    branches:
      - 'agent/cloud-mcp-safe-page-tools-20261123'
jobs:
  browser:
    if: github.repository == 'Redurbabat/Redion' && github.ref == 'refs/heads/agent/cloud-mcp-safe-page-tools-20261123'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify HTTPS consent, write scope, redirect and revocation
        run: npm run test:mcp-cloud-browser
