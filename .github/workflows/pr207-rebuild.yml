name: PR207 einmaliger Abgleich der Bauausgaben
on:
  push:
    branches: [ux/windows-schaltplan-dock-20261108]
    paths: [.github/workflows/pr207-rebuild.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/ux/windows-schaltplan-dock-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npm run bauen:ts
          node bauen.mts
          npm run typecheck
          npm run stand
      - name: Aktualisierte Artefakte auf denselben Branch uebernehmen
        shell: bash
        run: |
          set -euo pipefail
          git add --update
          if git diff --cached --quiet; then
            echo 'Keine Aenderungen notwendig.'
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(build): refresh Redion2 styles and generated offline assets'
          git push origin HEAD:refs/heads/ux/windows-schaltplan-dock-20261108
