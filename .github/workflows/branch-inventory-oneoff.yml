# Einmalige, rein lesende Inventur alter Branches. Danach löschen.
name: Alte Branches inventarisieren
on:
  push:
    branches:
      - fix/redion-sicherheit-und-datenschutz-20261021
    paths:
      - .github/workflows/branch-inventory-oneoff.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alle Branches laden
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Wirklich fehlende Aenderungen auflisten
        run: |
          python3 - <<'PY'
          import subprocess
          def git(*args):
              return subprocess.run(['git',*args],check=True,capture_output=True,text=True).stdout.strip()
          refs=git('for-each-ref','--format=%(refname:short)','refs/remotes/origin/').splitlines()
          rows=[]
          for ref in refs:
              if ref in ('origin/main','origin/HEAD','origin/fix/redion-sicherheit-und-datenschutz-20261021'): continue
              try:
                  behind,ahead=map(int,git('rev-list','--left-right','--count','origin/main...'+ref).split())
                  if not ahead: continue
                  oursbehind,oursahead=map(int,git('rev-list','--left-right','--count','origin/fix/redion-sicherheit-und-datenschutz-20261021...'+ref).split())
                  if not oursahead: continue
                  cherries=git('cherry','-v','origin/main',ref).splitlines()
                  unique=sum(x.startswith('+ ') for x in cherries)
                  files=git('diff','--name-only','origin/main...'+ref).splitlines()
                  rows.append((ref,ahead,behind,oursahead,oursbehind,unique,files))
              except subprocess.CalledProcessError:
                  continue
          rows.sort(key=lambda x:(x[3],x[2],x[0]))
          print('GESAMT_BRANCHES',len(refs),'NICHT_IN_UNSEREM_BRANCH',len(rows))
          for ref,a,b,oa,ob,u,files in rows:
              print('KANDIDAT',ref,'ahead_main',a,'behind_main',b,'ahead_ours',oa,'behind_ours',ob,'unique_patch',u,'files',len(files))
              print('DATEIEN',ref,', '.join(files[:45]))
          PY
