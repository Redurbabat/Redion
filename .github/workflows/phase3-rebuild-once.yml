name: Phase 3 offline rebuild (temporary)
on:
  push:
    branches: [feat/redion-phase3]
    paths:
      - '.github/workflows/phase3-rebuild-once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'Redurbabat/Redion' && github.ref == 'refs/heads/feat/redion-phase3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bauen:ts
      - run: npm run stand
      - run: node bauen.mts
      - name: Commit generated offline artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/redion-phase3
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add src/dienst/sw.ts src/kern/einstellung/stand.ts quell/kern/einstellung/stand.js sw.js redion-einzeldatei.html
          git diff --quiet || { echo "Unexpected generated changes"; git diff --stat; exit 1; }
          if git diff --cached --quiet; then echo "Already current"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate offline artifacts for page toolbar'
          git push origin HEAD:refs/heads/feat/redion-phase3
