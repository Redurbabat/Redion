# Temporärer Integrationslauf für die aus PR #120 übernommene Handy-Zielleiste.
# Nach Abnahme entfernen; nie auf main deployen oder mergen.
name: Zielleiste Integrationstest
on:
  push:
    branches:
      - fix/redion-sicherheit-und-datenschutz-20261021
    paths:
      - .github/workflows/zielleiste-integration-temp.yml
permissions:
  contents: read
jobs:
  handy-zielleiste:
    name: Zielleiste im Browser pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testabhaengigkeiten
        run: npm install --no-audit --no-fund
      - name: Chromium bereitstellen
        run: npx playwright install --with-deps chromium
      - name: Register- und Ziel-Vertrag
        run: node pruefungen/lauf/test613.mts
      - name: Reale Handy-Gesten und Liquid Glass
        run: node pruefungen/lauf/test614.mts
