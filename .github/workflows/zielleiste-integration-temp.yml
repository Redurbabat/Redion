# Temporärer Integrationslauf PR120 + Zielleiste-Quelle (E748/E749).
# Nach Abnahme löschen; main bleibt unverändert.
name: Zielleiste Integrationstest
on:
  push:
    branches:
      - fix/redion-sicherheit-und-datenschutz-20261021
    paths:
      - .github/workflows/zielleiste-integration-temp.yml
permissions:
  contents: write
jobs:
  handy-zielleiste:
    name: Zielleiste im Browser pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testabhaengigkeiten
        run: npm install --no-audit --no-fund
      - name: TypeScript prüfen
        run: npm run typecheck
      - name: Erzeugte JS- und Offline-Dateien nachziehen
        run: |
          npm run bauen:ts
          node bauen.mts
          npm run stand
      - name: Chromium bereitstellen
        run: npx playwright install --with-deps chromium
      - name: Zielleisten-Ziele und Browser-Verlauf prüfen
        run: node pruefungen/lauf/test613.mts
      - name: Hochzieh-Gesten, Fokus und Liquid Glass prüfen
        run: node pruefungen/lauf/test614.mts
      - name: Design-Prüfung
        run: node pruefungen/lauf/test621.mts
      - name: Gebaute Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- quell/bereiche/wissen/lernwelt.js quell/bereiche/wissen/produktwelten.js quell/schale/aufbau/schale.js src/dienst/sw.ts src/kern/einstellung/stand.ts sw.js quell/kern/einstellung/stand.js redion-einzeldatei.html
          if ! git diff --cached --quiet; then
            git commit -m "build: Zielleisten-Verlauf und Offline-Version synchronisieren"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Alle erzeugten Dateien sind unverändert."
          fi
