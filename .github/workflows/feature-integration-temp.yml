# Temporary integration build; remove after generated artifacts are committed.
name: Alte Features zusammenbauen
on:
  push:
    branches: [fix/redion-sicherheit-und-datenschutz-20261021]
    paths: [.github/workflows/feature-integration-temp.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript und Namensraeume
        run: |
          npm run typecheck
          node pruefungen/lauf/test290.mts
          node pruefungen/lauf/test550.mts
      - name: Generated JS, offline stand and singlefile
        run: |
          npm run bauen:ts
          node bauen.mts
          npm run stand
      - name: Push generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- quell/ sw.js redion-einzeldatei.html src/dienst/sw.ts src/kern/einstellung/stand.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: integrierte Mobile-Zielleiste und Offline-Artefakte nachziehen"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
