name: RED ION Home Server
on:
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/home/**'
      - 'pruefungen/redion-home-server.test.mts'
      - 'pruefungen/redion-home-dashboard.test.mts'
      - 'pruefungen/red-id-v2.test.mts'
      - 'pruefungen/red-login.test.mts'
      - 'pruefungen/red-web-browser.test.mts'
      - 'pruefungen/red-vault.test.mts'
      - 'pruefungen/red-vault-migrate.test.mts'
      - 'pruefungen/red-backup.test.mts'
      - 'red-sdk/**'
      - 'pruefungen/red-connect.test.mts'
      - 'pruefungen/red-share.test.mts'
      - 'pruefungen/red-sdk-share.test.mts'
      - 'pruefungen/red-key-exchange.test.mts'
      - '.github/workflows/home-server.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test pruefungen/redion-home-server.test.mts pruefungen/redion-home-dashboard.test.mts pruefungen/red-id-v2.test.mts pruefungen/red-login.test.mts pruefungen/red-web-browser.test.mts pruefungen/red-vault.test.mts pruefungen/red-vault-migrate.test.mts pruefungen/red-backup.test.mts
      - run: node --test pruefungen/red-connect.test.mts pruefungen/red-share.test.mts pruefungen/red-sdk-share.test.mts pruefungen/red-key-exchange.test.mts
      - run: bash -n deploy/home/backup.sh && bash -n deploy/home/update.sh && bash -n deploy/home/rehearse-update.sh
      - run: npm ci --ignore-scripts
      - run: npm --prefix red-sdk run build && npm --prefix red-sdk pack --dry-run
      - run: docker build -f deploy/home/Dockerfile -t redion-home:test .
