name: PR221 anonymous production access probe
on:
  push:
    branches: ['agent/cloud-mcp-safe-page-tools-20261123']
jobs:
  access-probe:
    if: github.repository == 'Redurbabat/Redion' && github.ref == 'refs/heads/agent/cloud-mcp-safe-page-tools-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read-only anonymous probes for main Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin='https://red-ion.redurbabat7.workers.dev';
          const paths=[
            {path:'/.well-known/oauth-authorization-server',want:'discovery'},
            {path:'/.well-known/oauth-protected-resource',want:'discovery'},
            {path:'/.well-known/oauth-protected-resource/mcp/cloud',want:'discovery'},
            {path:'/register',want:'public-transport'},
            {path:'/token',want:'public-transport'},
            {path:'/revoke',want:'public-transport'},
            {path:'/mcp/cloud',want:'bearer'},
            {path:'/',want:'access'},
            {path:'/mcp/settings',want:'access'},
            {path:'/mcp/authorize',want:'access'},
            {path:'/api/stand',want:'access'}
          ];
          let faults=0;
          for(const {path,want} of paths){
            try{
              const r=await fetch(origin+path,{method:'GET',redirect:'manual',
                signal:AbortSignal.timeout(12000),headers:{'accept':'application/json, text/html;q=0.8'}});
              const ct=r.headers.get('content-type')||'';
              const location=r.headers.get('location')||'';
              const edgeRedirect=[301,302,303,307,308].includes(r.status)&&/\/cdn-cgi\/access\/login|cloudflareaccess\.com/i.test(location);
              const browserRedirect=[301,302,303,307,308].includes(r.status);
              let okay=false;
              if(want==='discovery')okay=r.status===200&&ct.includes('json');
              if(want==='public-transport')okay=!browserRedirect&&r.status!==503&&r.status!==404&&r.status!==200&&r.status<500;
              if(want==='bearer')okay=r.status===401;
              if(want==='access')okay=edgeRedirect||r.status===401||r.status===403;
              console.log([okay?'PASS':'FAIL',path,'HTTP',r.status,'type',ct.split(';')[0],'access_redirect',edgeRedirect,'category',want].join(' '));
              if(!okay)faults++;
            }catch(e){
              faults++;
              console.log('FAIL',path,String(e?.name||'network_error').slice(0,45));
            }
          }
          console.log('Read-only probe result:',paths.length-faults,'/',paths.length,'expected responses.');
          if(faults)process.exitCode=1;
          NODE
