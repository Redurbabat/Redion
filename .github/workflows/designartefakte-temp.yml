# Temporary one-time artifact regeneration for the Liquid Glass design branch.
# Remove after generated files have been committed.
name: Designartefakte aktualisieren
on:
  push:
    branches:
      - fix/redion-sicherheit-und-datenschutz-20261021
    paths:
      - quell/schale/stil/studio.css
      - .github/workflows/designartefakte-temp.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate canonical JS, service worker, standalone
        run: |
          npm run bauen:ts
          node bauen.mts
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dienst/sw.ts src/kern/einstellung/stand.ts sw.js quell/kern/einstellung/stand.js redion-einzeldatei.html
          if ! git diff --cached --quiet; then
            git commit -m "build: Liquid-Glass-Designartefakte synchronisieren"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Keine erzeugten Änderungen."
          fi
