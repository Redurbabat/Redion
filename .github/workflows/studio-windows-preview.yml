name: RED Studio Windows Preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feat/red-studio-desktop' || github.event.pull_request.head.ref == 'integration/redion-258-261')
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: studio-windows-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix plugins/red-ion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and stage exact renderer
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run bauen:ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix windows run prepare:app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify desktop window and packaging contracts
        run: node --test windows/windows-desktop.test.cjs windows/studio-preview-fingerprint.test.mts
      - name: Verify visible native UI
        run: npm --prefix windows run preview:check
      - name: Build isolated portable EXE (no release)
        run: npm --prefix windows run preview:exe
      - name: Upload screenshots and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RED-Studio-Windows-Screenshots-${{ github.event.pull_request.head.sha }}
          path: build/studio-preview/screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload portable preview only on success
        uses: actions/upload-artifact@v4
        with:
          name: RED-Studio-Windows-EXE-${{ github.event.pull_request.head.sha }}
          path: |
            build/studio-preview/RED-Studio-Preview.exe
            build/studio-preview/SHA256.txt
          if-no-files-found: error
          retention-days: 7
