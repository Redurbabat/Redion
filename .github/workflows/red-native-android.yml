name: RED Native Android SDK
on:
  pull_request:
    paths:
      - 'red-sdk/android/**'
      - '.github/workflows/red-native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35"
      - run: gradle -p red-sdk/android testDebugUnitTest assembleDebug --no-daemon
