name: iOS native regression tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'quell/schale/stil/pdf-studio.css'
      - 'src/kern/einstellung/app.ts'
      - 'src/schale/aufbau/wischen.ts'
      - 'quell/schale/aufbau/wischen.js'
      - 'pruefungen/wischen-multitouch.test.mjs'
      - 'capacitor.config.json'
      - 'codemagic.yaml'
      - '.github/workflows/ios-native-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-native-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Redion
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Check iOS adapters and non-destructive project configuration
        run: |
          set -euo pipefail
          node --test \
            ios/backup-chunks.test.mjs \
            ios/codemagic-dependency-versions.test.mjs \
            ios/native-file-export.test.mjs \
            ios/native-feel.test.mjs \
            ios/native-layout.test.mts \
            ios/native-lifecycle-export.test.mjs \
            ios/native-statusbar-queue.test.mjs \
            ios/native-viewport-resume.test.mjs \
            ios/native-export-feedback.test.mjs \
            ios/native-mobile-document.test.mjs \
            ios/native-safari-links.test.mjs \
            ios/home-shortcuts.test.mjs \
            ios/incoming-share.test.mjs \
            ios/incoming-share-store-contract.test.mjs \
            ios/share-widget-integration.test.mjs \
            ios/share-widget-xcode-build.test.mjs \
            ios/widget-orbit.test.mjs \
            ios/install-privacy-shield.test.mjs \
            ios/native-project-layout.test.mjs \
            ios/install-launch-screen.test.mjs \
            ios/capacitor8-spm-native-integration.test.mjs \
            ios/vergleiche-webstand.test.mjs \
            ios/native-documents.test.mts \
            ios/webkit-call-contract.test.mts \
            pruefungen/wischen-multitouch.test.mjs

# Deliberately no IPA packaging, Apple signing, deployment, or merge.
# Real Xcode/iPhone checks remain manual in Codemagic.

  ios-mobile-layout-browser:
    name: Native CSS an iPhone-Viewports im Chromium pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Redion
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile HTML and computed CSS at 390, 428 and 820pt
        run: node --test ios/native-layout.browser.test.mts

