name: iOS Glass Dock Contract

on:
  pull_request:
    paths:
      - 'quell/schale/stil/studio.css'
      - 'quell/schale/stil/glasswheel.css'
      - 'quell/schale/stil/bausteine.css'
      - 'index.html'
      - 'ios/native-glass-dock.swift'
      - 'ios/native-more.swift'
      - 'ios/native-library.swift'
      - 'ios/native-editor.swift'
      - 'ios/native-editor-bridge.test.mjs'
      - 'ios/install-native-glass-dock.mjs'
      - 'ios/install-native-glass-dock.test.mjs'
      - 'codemagic.yaml'
      - 'pruefungen/ios-glass-dock-contract.test.mjs'
      - '.github/workflows/ios-glass-dock-contract.yml'
  workflow_dispatch:

jobs:
  ios-dock-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify iPhone dock gesture, lens and safe-area contracts
        run: node --test pruefungen/ios-glass-dock-contract.test.mjs
      - name: Verify native SwiftUI dock integration
        run: node --test ios/install-native-glass-dock.test.mjs ios/native-editor-bridge.test.mjs

  generated-stand-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate the service-worker and version state
        run: npm run bauen:ts
      - name: Verify regenerated state
        run: npm run stand
      - name: Export generated-file changes for review
        if: always()
        run: |
          git diff --binary > ios-generated-stand.patch
          git status --short > ios-generated-stand-status.txt
      - name: Upload generated-state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-generated-stand-diagnostics
          path: |
            ios-generated-stand.patch
            ios-generated-stand-status.txt
          retention-days: 3
