name: Redion Windows Offline-App
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/windows-app.yml'
      - '.github/workflows/affine-integration.yml'
      - 'plugins/red-ion/tests/electron.mts'
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 232 || github.event.pull_request.number == 236)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Abhängigkeiten installieren
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix windows --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix plugins/red-ion --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Web-Code, Windows-Brücke und MCP-Paket vorbereiten
        shell: pwsh
        run: |
          npm run bauen:ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix windows run prepare:app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/typescript/bin/tsc -p plugins/red-ion/tsconfig.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix plugins/red-ion run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows-Komponenten mit vorbereiteten Artefakten prüfen
        shell: pwsh
        run: |
          npm --prefix windows test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test pruefungen/native-windows-files.mts pruefungen/windows-ink-model.mts pruefungen/native-build-parity.mts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:windows-ink:prepared
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:mcp:prepared
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:windows-mcp:prepared
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:mcp-scripts:prepared
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Die x64-Ziele NSIS und Portable stehen in windows/package.json.
      - name: Vorbereitete App als Windows-Installer und Portable paketieren
        working-directory: windows
        shell: pwsh
        run: .\node_modules\.bin\electron-builder.cmd --win --publish never
      - name: Gebaute Windows-EXE und Webparität prüfen
        shell: pwsh
        run: |
          node plugins/red-ion/tests/electron.mts --packaged=build/windows-dist/win-unpacked/Redion.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node windows/compare-web.mts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Redion-Windows-Offline
          path: |
            build/windows-dist/*.exe
            build/windows-dist/windows-web-paritaet.json
            bilder/windows-ink/nachher/*.png
            bilder/windows-ink/nachher/messung.json
            bilder/redion-mcp/*.png
            bilder/redion-mcp/nachweis.json
            bilder/redion-mcp/paket/*.png
            bilder/redion-mcp/paket/nachweis.json
          if-no-files-found: error
          retention-days: 7
# Nur manuell, keine Installation, kein GitHub-Release und kein Deployment.
