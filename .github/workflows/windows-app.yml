name: Redion Windows Offline-App
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/windows-app.yml'
      - 'plugins/red-ion/tests/electron.mts'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Gemeinsamen Web-Code und Windows-Brücke bauen
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix windows --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix plugins/red-ion --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run bauen:ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck:mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/typescript/bin/tsc -p windows/tsconfig.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test windows/windows-desktop.test.cjs pruefungen/native-windows-files.mts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix windows test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test pruefungen/windows-ink-model.mts pruefungen/native-build-parity.mts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:windows-ink
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:windows-mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:mcp-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix windows run dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node plugins/red-ion/tests/electron.mts --packaged=build/windows-dist/win-unpacked/Redion.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node windows/compare-web.mts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Redion-Windows-Offline
          path: |
            build/windows-dist/*.exe
            build/windows-dist/windows-web-paritaet.json
            bilder/windows-ink/nachher/*.png
            bilder/windows-ink/nachher/messung.json
            bilder/redion-mcp/*.png
            bilder/redion-mcp/nachweis.json
            bilder/redion-mcp/paket/*.png
            bilder/redion-mcp/paket/nachweis.json
          if-no-files-found: error
          retention-days: 7
# Nur manuell, keine Installation, kein GitHub-Release und kein Deployment.
