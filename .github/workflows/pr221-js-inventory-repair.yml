name: PR221 legacy JavaScript inventory baseline repair
on:
  push:
    branches: ['agent/cloud-mcp-safe-page-tools-20261123']
jobs:
  inventory:
    if: github.repository == 'Redurbabat/Redion' && github.ref == 'refs/heads/agent/cloud-mcp-safe-page-tools-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-mcp-safe-page-tools-20261123
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory only pre-existing JavaScript sources from main
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const ROOT=process.cwd();
          const excluded=new Set(['.git','node_modules','.wrangler']);
          const excludedOutputs=new Set(['build/windows-app','build/windows-dist','build/windows-ink-dist',
            'build/windows-mcp-dist','build/red-ion-plugin','build/mcp-install-test',
            'plugins/red-ion/server/dist','build/ios-capacitor','windows/generated','www']);
          const files=[];
          function visit(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              if(excluded.has(entry.name))continue;
              const full=path.join(dir,entry.name);
              const rel=path.relative(ROOT,full).split(path.sep).join('/');
              if(excludedOutputs.has(rel))continue;
              if(entry.isDirectory())visit(full);
              else if(entry.isFile())files.push(rel);
            }
          }
          visit(ROOT);
          const all=new Set(files);
          const generated=new Set(files
            .filter(f=>f.startsWith('src/')&&f.endsWith('.ts')&&!f.endsWith('.d.ts'))
            .map(f=>'quell/'+f.slice(4,-3)+'.js'));
          if(all.has('src/dienst/sw.ts'))generated.add('sw.js');
          const thirdParty=JSON.parse(fs.readFileSync('pruefungen/fremd-bestand.json','utf8'));
          const foreign=new Set((thirdParty.eintraege||[]).map(x=>x.pfad));
          const bundles=JSON.parse(fs.readFileSync('pruefungen/buendel-bestand.json','utf8'));
          const watchdogFile='pruefungen/lauf/'+String(bundles.waechter||'')+'.mts';
          const watchdog=all.has(watchdogFile)?fs.readFileSync(watchdogFile,'utf8'):'';
          for(const b of bundles.buendel||[]){
            if(/\.js$/.test(b.pfad)&&all.has(b.quelle)&&all.has(bundles.bau)&&watchdog.includes(b.pfad))
              generated.add(b.pfad);
          }
          const hand=files.filter(f=>/\.(js|mjs|cjs)$/.test(f)&&!generated.has(f)&&!foreign.has(f)).sort();
          const main=new Set(execFileSync('git',['ls-tree','-r','--name-only','origin/main'],{encoding:'utf8'}).split('\n'));
          const notOld=hand.filter(f=>!main.has(f));
          if(notOld.length)throw Error('Refusing to grandfather newly created JavaScript: '+notOld.join(', '));
          if(hand.length<30||hand.length>100)throw Error('Unexpected legacy inventory size '+hand.length);
          console.log('Existing JavaScript in main:',hand.length,'examples:',hand.slice(0,10));
          fs.writeFileSync('pruefungen/js-bestand.json',JSON.stringify(hand,null,2)+'\n');
          NODE
      - name: Validate legacy inventory guard
        run: node pruefungen/lauf/test109.mts
      - name: Commit legacy baseline for future shrink-only enforcement
        run: |
          set -euo pipefail
          git add pruefungen/js-bestand.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'test: baseline existing legacy JS inventory for migration guard'
          git push origin HEAD:refs/heads/agent/cloud-mcp-safe-page-tools-20261123
