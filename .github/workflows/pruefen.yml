# ============================================================================
# Prüfläufe bei jedem Push und jedem Pull Request
# ----------------------------------------------------------------------------
# CLAUDE.md sagt: ein grüner Lauf ist die einzige Aussage darüber, dass etwas
# fertig ist. Bisher musste jeder daran denken, sie selbst zu starten — und
# wer es vergisst, merkt es nie, weil ein vergessener Lauf genauso aussieht
# wie ein bestandener: nämlich nach nichts.
#
# Hier laufen sie von selbst, auf einem Rechner, der nichts von diesem Projekt
# weiss. Das ist der eigentliche Wert: die Läufe lagen jahrelang unter /tmp und
# gingen davon aus, dass drumherum schon alles da ist. Ein frischer Container
# beweist das Gegenteil oder eben nicht.
#
# Was hier läuft, ist der SCHNELLE Teil (E745, L254). Der volle Lauf — am
# 11. Oktober 2026 550 Läufe in 158 Minuten — passt in keine Zeitgrenze, die
# für jeden Push taugt, und bleibt deshalb auf dem Rechner:
# `node pruefungen/volllauf.mts`, in Stücken und wiederaufnehmbar
# (CLAUDE.md §30). Ein grüner Haken hier heisst also „der schnelle Lauf ist
# grün", nicht „alles ist grün".
#
# Kein Bauschritt für die App selbst — die bleibt reines HTML, CSS und
# JavaScript und läuft per Doppelklick. Node und Playwright werden hier nur
# zum Prüfen geholt.
# ============================================================================

name: Prüfläufe

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Von Hand startbar, wenn man einen Lauf wiederholen will
  workflow_dispatch:

# Ein neuer Push auf denselben Zweig bricht den vorigen Lauf ab. Ohne das
# stauen sich bei mehreren Commits hintereinander Läufe, deren Ergebnis
# niemanden mehr interessiert.
concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Zuerst das, was in Sekunden fertig ist. Wenn die Rechte in Oberfläche und
  # Server auseinanderlaufen oder ein Steuerzeichen roh im Quelltext steht,
  # will man das nach zwanzig Sekunden wissen und nicht erst nach dem
  # schnellen Lauf. Der startet trotzdem parallel — dies ist eine frühe
  # Antwort, kein Tor.
  # ---------------------------------------------------------------------------
  schnell:
    name: Quelltext und Logik (ohne Browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts holt die Pakete, aber keine Browser. Chromium wiegt
      # ein Vielfaches von allem anderen und wird in diesem Job nicht
      # gebraucht — der schnelle Lauf holt ihn für test96 und test100.
      - name: Pakete holen (ohne Browser)
        run: npm install --no-audit --no-fund --ignore-scripts

      # Prüft Typen, baut nichts (`noEmit`). Die App startet weiterhin per
      # Doppelklick — siehe doku/TYPESCRIPT-MIGRATION.md. Der Schritt steht
      # hier vorne, weil er in Sekunden fertig ist.
      # Die Windows-Pruefung protokolliert TypeScript- und Browser-Fehler.
      # Auch ohne Windows-Rechner kann ihr Node-Helfer mit ECHTEN
      # Unterprozessen und isoliertem Benutzerordner getestet werden.
      # Der Test steht nicht unter pruefungen/lauf/ und wird vom
      # allgemeinen Orchestrator deshalb nicht automatisch entdeckt.
      - name: Windows-Pruefprotokoll und sicheren PR-Live-Starter testen
        run: node --test windows/schaltplan-protokoll.test.mjs windows/pr207-launcher.test.mjs

      - name: Typen prüfen
        run: npm run typecheck

      - name: Versionsnummer und Änderungsverlauf prüfen
        run: npm run version:pruefen

      # Hat jemand eine Datei des Grundstocks geändert und den Bau vergessen?
      # Dann sagen sw.ts und stand.ts eine alte Fassung, der Dienst-Arbeiter
      # mischt bei Redur alte und neue Dateien, und niemand merkt es (L83).
      # dienststand.mts rechnet den Stempel nach — in einer Sekunde (E361).
      - name: Stimmt der Dienststand?
        run: npm run stand

      - name: Quelltext prüfen
        run: node pruefungen/lauf/test87.mts
      - name: Datenbank-Logik prüfen
        run: node pruefungen/lauf/test88.mts
      - name: Werkzeug-Logik prüfen
        run: node pruefungen/lauf/test89.mts
      - name: "Kapitel 12 Batterielabor: Lehrmittel und echtes Netz"
        run: node --test pruefungen/batterie-labor.test.cjs pruefungen/batterie-schaltplan.test.cjs
      # Braucht keinen Browser: Node 20 bringt Blob und TextEncoder mit.
      - name: Die Grenzen des ZIP-Packers prüfen
        run: node pruefungen/lauf/test103.mts
      # Passt das erzeugte JavaScript unter quell/ noch zu seinem .ts unter
      # src/? Dieselbe Frage wie bei redion-einzeldatei.html, und dieselbe
      # Sorte Fehler, wenn niemand sie stellt.
      - name: Erzeugtes JavaScript gegen die Quellen prüfen
        run: node pruefungen/lauf/test105.mts
      # Die React-Inseln (E699): React und das Inselbündel werden neu gebaut
      # und Byte für Byte mit dem verglichen, was im Verzeichnis liegt —
      # dieselbe Frage wie darüber, nur für das, was Vite baut. Dazu die
      # Prüfsummen des Fremdcodes und die Regeln gegen eine zweite
      # Oberfläche. Kein Browser; rund zehn Sekunden.
      - name: React-Inseln gegen ihre Quellen prüfen
        run: node pruefungen/lauf/test578.mts
      # Rechnet SUMME dasselbe wie sum? Braucht keinen Browser.
      - name: Die deutschen Excel-Namen prüfen
        run: node pruefungen/lauf/test106.mts
      - name: Suchen und Verweisen prüfen
        run: node pruefungen/lauf/test107.mts
      # 92 und 93 starten zwar einen HTTP-Server, aber keinen Browser — sie
      # sind in einer halben Sekunde durch. Sicherheitsbefunde sollen nicht
      # auf den schnellen Lauf warten, um gemeldet zu werden.
      - name: Anmeldeschlüssel und CORS prüfen
        run: node pruefungen/lauf/test92.mts
      - name: Die Bremse und die Kopfzeilen prüfen
        run: node pruefungen/lauf/test93.mts
      # Die Cloud-MCP-Rechte sind sicherheitskritisch: Lesen darf weder beim
      # ersten OAuth-Consent noch durch Refresh still zu Schreiben werden.
      # Ohne diesen Schritt koennte eine geaenderte Scope-Regel unbemerkt
      # auf main gelangen. Ein D1-Konto ist nicht erforderlich; die Tests
      # nutzen eine isolierte SQLite-Ablage.
      - name: Cloud-MCP OAuth, Schreibfreigabe und Rechte pruefen
        run: npm run test:mcp-cloud

  # ---------------------------------------------------------------------------
  # Der schnelle Lauf (E745). Bis zum 11. Oktober 2026 stand hier „Alle
  # Prüfläufe": `npm run pruefen`, 40 Minuten Zeit, begründet mit „67 Läufe …
  # rund 12 Minuten". Es waren 550 Läufe, und der volle Lauf braucht auf dem
  # Rechner 158 Minuten (E743). Die CI hat ihn deshalb jedes Mal nach 40
  # Minuten abgebrochen — auf `main` am 5. und am 11. Oktober (L254). Ein
  # abgebrochener Lauf sagt über keinen einzigen Prüflauf etwas.
  #
  # Redur hat am 11. Oktober Weg (c) gewählt („2 . Scnell lauf"): hier nur
  # der schnelle Lauf, der volle bleibt auf dem Rechner
  # (`node pruefungen/volllauf.mts`, CLAUDE.md §30).
  #
  # Was `--schnell` heisst, druckt `npm run pruefen -- --schnell --liste`:
  # jeder Lauf, der keinen Browser startet, und dazu test96 und test100 aus
  # CLAUDE.md §31 — die Sicherung mit echten Bytes. test610 hält, dass hier
  # genau diese Auswahl läuft und dass dieser Job heisst, was er tut.
  #
  # Gemessen am 11. Oktober 2026 auf dem Rechner der Sitzung (4 Kerne,
  # Xeon 2,8 GHz, Node 22.22): `npm run pruefen -- --schnell` fuhr 45 Läufe
  # — 43 ohne Browser, test96 und test100 mit — in 4 min 14 s; davon sind
  # 2 min 12 s die festen Pausen von drei Sekunden zwischen den Läufen. Der
  # längste ist test105 (58 s, er baut mit tsc nach /tmp).
  #
  # Die Schritte davor sind auf GitHub gemessen, nicht geschätzt: im Lauf
  # 38169660632 (11. Oktober 2026, auf 97d156b, Job „Alle Prüfläufe" mit
  # denselben Schritten wie hier) brauchten Quelltext, Node, Pakete,
  # Chromium mit Systembibliotheken (23 s) und die Einzeldatei zusammen
  # 32 s — Zeitstempel der Schritte aus der Schnittstelle von GitHub. Im
  # selben Lauf, im Job darüber, war der Runner bei drei Läufen mal
  # schneller, mal langsamer als der Rechner der Sitzung: test105 53 s
  # gegen 58,1 s, test103 4 s gegen 8,9 s, test578 aber 11 s gegen 8,4 s —
  # je ein Lauf, und GitHub zählt ganze Sekunden. Schneller oder langsamer
  # ist er damit nicht belegt; wie lange der ganze schnelle Lauf auf dem
  # Runner braucht, zeigt erst der erste Push.
  #
  # Die Zeitgrenze von 20 Minuten ist gut das Vierfache von Lauf und
  # Einrichtung zusammen (4 min 14 s + 32 s): das Holen von Chromium hängt
  # am Netz, und ein Runner kann an einem anderen Tag langsamer sein. Wächst
  # der Lauf über die Grenze, ist das ein Befund, kein Anlass, still zu
  # erhöhen — neu messen, die Zahl hier und in messungen.md nachziehen.
  # ---------------------------------------------------------------------------
  pruefen:
    name: Schneller Lauf (ohne Browser, dazu die Sicherung)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Kein `npm ci` — `npm install` zeigt sofort, wenn die Sperrdatei und
      # die package.json auseinanderlaufen.
      - name: Pakete holen
        run: npm install --no-audit --no-fund

      # Nur für test96 und test100: sie sichern und spielen zurück, mit
      # echten Bytes, in einem echten Browser — die zwei Läufe aus §31, die
      # einen brauchen. --with-deps holt die Systembibliotheken mit, die
      # Chromium auf einem nackten Ubuntu braucht. Steht in der Auswahl kein
      # Browserlauf mehr, gehört dieser Schritt weg (test610 §3).
      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      # Die Einzeldatei wird aus den Quellen gebaut, und der nächste Schritt
      # vergleicht sie mit der im Repository. In der weitergegebenen
      # Einzeldatei fehlte einmal die komplette HTML-Säuberung, und niemandem
      # fiel es auf. (test74, der sie im Browser öffnet, läuft im vollen
      # Lauf auf dem Rechner.)
      - name: Einzeldatei bauen
        run: node bauen.mts

      # Wenn `bauen.mts` etwas anderes herausbekommt als das, was im
      # Repository liegt, hat jemand die Quellen geändert und die Einzeldatei
      # nicht nachgezogen. Das ist kein Fehler im Code, aber einer in dem,
      # was man weitergibt — und genau der fällt sonst nie auf.
      - name: Ist die Einzeldatei nachgezogen?
        run: |
          if ! git diff --quiet -- redion-einzeldatei.html; then
            echo "::error::redion-einzeldatei.html ist nicht auf dem Stand der Quellen."
            echo "Bitte 'node bauen.mts' laufen lassen und das Ergebnis mit committen."
            git diff --stat -- redion-einzeldatei.html
            exit 1
          fi
          echo "Die Einzeldatei ist auf dem Stand der Quellen."

      # Die Auswahl zuerst drucken: wer das Protokoll liest, sieht, WAS
      # geprüft wurde — und was nicht.
      - name: Was der schnelle Lauf fährt
        run: npm run pruefen -- --schnell --liste

      - name: Der schnelle Lauf
        run: npm run pruefen -- --schnell

      # Ein echter Chromium-Lauf auf den vorhandenen Stilblättern: Verhalten
      # bei Desktop/iPhone, Bewegung reduziert und hohem Kontrast.
      # Keine Screenshots, keine Nutzerdaten, kein Netz/Deployment nötig.
      - name: Liquid Glass und Motion im Browser prüfen
        run: node pruefungen/ui-motion-check.mts

      # Wenn etwas schiefging, ist der Bildschirm des Browsers das Erste,
      # was man sehen will. Playwright legt nichts von selbst ab; die Läufe
      # tun es auch nicht — deshalb bleibt hier nur das Protokoll, und das
      # steht ohnehin schon oben. Der Schritt ist trotzdem da, damit der
      # Ort bekannt ist, an dem Bilder später landen würden.
      - name: Was liegengeblieben ist
        if: failure()
        run: |
          echo "Gescheiterte Läufe stehen im Protokoll des vorigen Schrittes —"
          echo "alle.mts nennt sie am Ende noch einmal einzeln."
          echo ""
          echo "Nachstellen:"
          echo "  node pruefungen/lauf/test<nr>.mts      ein einzelner Lauf"
          echo "  npm run pruefen -- --schnell           dieser Lauf"
          echo "  npm run pruefen -- 33 85 86            nur diese drei"
          echo ""
          echo "Der volle Lauf läuft NICHT hier, sondern auf dem Rechner:"
          echo "  node pruefungen/volllauf.mts           in Stücken, wiederaufnehmbar"
          echo ""
          echo "Ein Lauf, der einzeln grün ist und in der Reihe rot, ist fast"
          echo "immer die fehlende Pause und kein Fehler im Code."
