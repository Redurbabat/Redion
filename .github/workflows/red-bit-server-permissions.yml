name: RED Bit server permission pilot
on:
  push:
    branches: [feat/red-bit-server-permissions-20261128, feat/red-bit-transport-grants-20261128]
  pull_request:
    branches: [main, feat/red-bit-server-permissions-20261128]
    paths:
      - 'server/home/red-bit-*.ts'
      - 'server/home-server.ts'
      - 'src/bereiche/einstellungen/ansicht/seite.ts'
      - 'pruefungen/red-bit-permissions.test.mts'
      - '.github/workflows/red-bit-server-permissions.yml'
permissions:
  contents: read
jobs:
  permission-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test pruefungen/red-bit-permissions.test.mts pruefungen/red-id-v2.test.mts pruefungen/redion-home-server.test.mts pruefungen/red-recovery.test.mts
  dashboard-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bauen:ts
