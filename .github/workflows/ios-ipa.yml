name: Redion iPhone IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'doku/RED-ION-MASTER.md'
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/affine-integration.yml'
      - '.github/workflows/windows-app.yml'

permissions:
  contents: read

jobs:
  ios:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 232 || github.event.pull_request.number == 236 || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/redion-phase3'))
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Identische Codemagic-Bauschritte mit nativen Adaptern und Paritätsprüfung
        run: node ios/run-codemagic.mts

      - name: IPA zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Redion-iPhone-IPA
          path: |
            build/ipa/Redion-unsigned.ipa
            build/ios-web-paritaet.json
            build/ios-xcodebuild.log
          if-no-files-found: error
          retention-days: 7
