        .replace(/DD/g,   zwei(d.getDate()))
        .replace(/dddd/g, tage[d.getDay()])
        .replace(/ddd/g,  kurz[d.getDay()])
        .replace(/HH/g,   zwei(d.getHours()))
        .replace(/mm/g,   zwei(d.getMinutes()))
        .replace(/WW/g,   zwei(F.week([d])))
        .replace(/\u0001(\d+)\u0001/g, (_, n) => woertlich[+n]);
    },

    /* --- Darstellung ----------------------------------------------------- */
    style: a => text(a[0]),          /* Auszeichnung wird beim Rendern gesetzt */
    unstyle: a => text(a[0]),
    link: a => text(a[0]),
    id: () => '',
    name: a => text(a[0]),
    email: a => text(a[0])
  };

  /* Der eigentliche Auswerter */
  const evaluate = (knoten, ctx) => {
    switch (knoten.k) {
      case 'num':  return knoten.v;
      case 'str':  return knoten.v;
      case 'bool': return knoten.v;
      case 'null': return null;
      case 'list': return knoten.items.map(x => evaluate(x, ctx));
      case 'var':  return knoten.name in ctx.vars ? ctx.vars[knoten.name] : null;
      case 'neg':  return -zahl(evaluate(knoten.a, ctx));
      case 'not':  return !wahr(evaluate(knoten.a, ctx));

      case 'bin': {
        const { op } = knoten;
        /* Kurzschluss bei and/or — spart Arbeit und vermeidet Fehler */
        if (op === 'and') return wahr(evaluate(knoten.l, ctx)) && wahr(evaluate(knoten.r, ctx));
        if (op === 'or')  return wahr(evaluate(knoten.l, ctx)) || wahr(evaluate(knoten.r, ctx));

        const l = evaluate(knoten.l, ctx);
        const r = evaluate(knoten.r, ctx);

        /* DER Kernpunkt: + verkettet Text, wenn eine Seite Text ist */
        if (op === '+') {
          if (typeof l === 'string' || typeof r === 'string') return text(l) + text(r);
          return zahl(l) + zahl(r);
        }
        if (op === '-') return zahl(l) - zahl(r);
        if (op === '*') return zahl(l) * zahl(r);
        if (op === '/') return zahl(r) === 0 ? 0 : zahl(l) / zahl(r);
        if (op === '%') return zahl(r) === 0 ? 0 : zahl(l) % zahl(r);
        if (op === '^') return Math.pow(zahl(l), zahl(r));

        if (op === '==') return typeof l === typeof r ? l === r : text(l) === text(r);
        if (op === '!=') return typeof l === typeof r ? l !== r : text(l) !== text(r);

        const beideZahlen = !isNaN(parseFloat(l)) && !isNaN(parseFloat(r));
        const a = beideZahlen ? zahl(l) : text(l);
        const b = beideZahlen ? zahl(r) : text(r);
        if (op === '>')  return a >  b;
        if (op === '>=') return a >= b;
        if (op === '<')  return a <  b;
        if (op === '<=') return a <= b;
        return null;
      }

      case 'call': {
        const n = knoten.name;

        /* prop() greift auf die Zeile zu */
        if (n === 'prop') {
          const feld = evaluate(knoten.args[0], ctx);
          return ctx.props(text(feld));
        }

        /* if und ifs werten faul aus, damit der falsche Zweig nicht rechnet */
        if (n === 'if') {
          return wahr(evaluate(knoten.args[0], ctx))
            ? evaluate(knoten.args[1], ctx)
            : (knoten.args[2] !== undefined ? evaluate(knoten.args[2], ctx) : '');
        }
        if (n === 'ifs') {
          const as = knoten.args;
          for (let i = 0; i + 1 < as.length; i += 2)
            if (wahr(evaluate(as[i], ctx))) return evaluate(as[i+1], ctx);
          return as.length % 2 ? evaluate(as[as.length-1], ctx) : '';
        }

        /* let(name, wert, ausdruck) */
        if (n === 'let') {
          const name = knoten.args[0].k === 'var' ? knoten.args[0].name : text(evaluate(knoten.args[0], ctx));
          const wert = evaluate(knoten.args[1], ctx);
          const neu = { ...ctx, vars: { ...ctx.vars, [name]: wert } };
          return evaluate(knoten.args[2], neu);
        }

        /* lets(n1, w1, n2, w2, …, ausdruck) — spätere sehen frühere */
        if (n === 'lets') {
          const as = knoten.args;
          let neu = { ...ctx, vars: { ...ctx.vars } };
          let i = 0;
          for (; i + 2 < as.length; i += 2) {
            const name = as[i].k === 'var' ? as[i].name : text(evaluate(as[i], neu));
            neu.vars[name] = evaluate(as[i+1], neu);
          }
          return evaluate(as[as.length-1], neu);
        }

        /* map / filter / find über Listen — 'current' ist das Element */
        if (['map','filter','find','some','every','findindex'].includes(n)) {
          const liste = evaluate(knoten.args[0], ctx);
          const arr = Array.isArray(liste) ? liste : (liste == null ? [] : [liste]);
          const ausdruck = knoten.args[1];
          const mit = (el, idx) => evaluate(ausdruck, {
            ...ctx, vars: { ...ctx.vars, current: el, index: idx }
          });
          if (n === 'map')    return arr.map(mit);
          if (n === 'filter') return arr.filter((e,i) => wahr(mit(e,i)));
          if (n === 'find')   return arr.find((e,i) => wahr(mit(e,i)));
          if (n === 'findindex') return arr.findIndex((e,i) => wahr(mit(e,i)));
          if (n === 'some')   return arr.some((e,i) => wahr(mit(e,i)));
          if (n === 'every')  return arr.every((e,i) => wahr(mit(e,i)));
        }

        const args = knoten.args.map(x => evaluate(x, ctx));

        if (F[n]) return F[n](args);
        throw new Error(`Unbekannte Funktion: ${n}()`);
      }
    }
    return null;
  };

  /* --- Zwischenspeicher für geparste Formeln ----------------------------- */
  const cache = new Map();

  /**
   * Wertet eine Formel aus.
   * @param {string} src        die Formel als Text
   * @param {Function} propFn   liefert den Wert einer Spalte: name => wert
   * @returns {{ok:boolean, wert:*, fehler:string}}
   */
  const run = (src, propFn) => {
    if (!src || !src.trim()) return { ok: true, wert: '' };
    try {
      let baum = cache.get(src);
      if (!baum) { baum = parse(tokenize(src)); cache.set(src, baum); }
      const wert = evaluate(baum, { props: propFn, vars: {} });
      return { ok: true, wert };
    } catch (e) {
      return { ok: false, wert: '', fehler: e.message };
    }
  };

  /** Prüft eine Formel, ohne sie auf echte Daten loszulassen. */
  const check = (src) => {
    try { parse(tokenize(src)); return { ok: true }; }
    catch (e) { return { ok: false, fehler: e.message }; }
  };

  /** Für die Anzeige in einer Tabellenzelle. */
  const anzeige = (wert) => {
    if (wert instanceof Date) return F.formatdate([wert, 'DD.MM.YYYY']);
    if (typeof wert === 'boolean') return wert ? '✅' : '☐';
    return text(wert);
  };

  return { run, check, anzeige, text, zahl, wahr, F };
})();

</script>
<script>
/* ===== js/links.js ===== */
/* ============================================================================
 * links.js — Verknüpfungen zwischen Seiten
 * ----------------------------------------------------------------------------
 * Das, was Notion „Link to page" nennt und was Logseq, Foam, SiYuan und
 * Obsidian gross gemacht haben:
 *
 *   [[Seitenname]]   verlinkt eine Seite. Gibt es sie nicht, wird sie angelegt.
 *   #stichwort       setzt ein Schlagwort.
 *   ((Blockverweis)) verweist auf einen einzelnen Block.
 *
 * Dazu die Gegenrichtung: Rückverweise unter jeder Seite, unverlinkte
 * Erwähnungen und ein Graph, der zeigt, was womit zusammenhängt.
 * ==========================================================================*/

const Links = (() => {

  const esc = (s) => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ========================================================================
   * INLINE-DARSTELLUNG
   * ------------------------------------------------------------------------
   * Bekommt bereits maskiertes HTML von Blocks.inline() und ergänzt
   * Seitenlinks, Schlagwörter und Blockverweise.
   * ======================================================================*/
  const inline = (html) => String(html)

    /* ((Blockverweis)) */
    .replace(/\(\(([0-9a-f-]{6,})\)\)/gi, (_, id) => {
      const b = Store.getBlock(id);
      if (!b) return '<span class="wl tot">((verwaister Verweis))</span>';
      return `<a class="bl" data-bref="${id}" title="Zum Block springen">${esc(b.text || 'Block')}</a>`;
    })

    /* [[Seitenname]] */
    .replace(/\[\[([^\[\]\n]{1,120})\]\]/g, (_, roh) => {
      const name = roh.trim();
      const ziel = seiteMitTitel(name);
      return `<a class="wl${ziel ? '' : ' neu'}" data-wl="${esc(name)}" ` +
             `title="${ziel ? 'Seite öffnen' : 'Seite anlegen'}">${esc(name)}</a>`;
    })

    /* #stichwort — nur am Wortanfang, damit URLs mit # unberührt bleiben */
    .replace(/(^|[\s(>])#([A-Za-z0-9ÄÖÜäöüß][\wÄÖÜäöüß\-\/]{1,40})/g,
      (_, vor, tag) => `${vor}<a class="tg" data-tag="${esc(tag)}">#${esc(tag)}</a>`);

  /* ========================================================================
   * NACHSCHLAGEN
   * ======================================================================*/

  /** Alle echten Seiten (keine Datenbankzeilen, nichts im Papierkorb). */
  const seiten = () => Object.values(Store.cache.blocks)
    .filter(b => b.type === 'page' && b.alive && b.parentTable !== 'collection');

  const seiteMitTitel = (name) => {
    const n = name.trim().toLowerCase();
    return seiten().find(p => (p.text || '').trim().toLowerCase() === n) || null;
  };

  /** Zu welcher Seite gehört ein Block? Läuft den Baum nach oben. */
  const seiteVon = (blockId) => {
    let cur = Store.getBlock(blockId);
    let schutz = 0;
    while (cur && schutz++ < 60) {
      if (cur.type === 'page' && cur.parentTable !== 'collection') return cur;
      if (cur.parentTable === 'collection') {
        /* Datenbankzeile: über die Sammlung zum Datenbankblock */
        const dbBlock = Object.values(Store.cache.blocks)
          .find(b => b.collectionId === cur.parentId);
        cur = dbBlock ? Store.getBlock(dbBlock.parentId) : null;
        continue;
      }
      cur = cur.parentId ? Store.getBlock(cur.parentId) : null;
    }
    return null;
  };

  /** Öffnet die Seite mit diesem Titel — und legt sie an, wenn es sie nicht gibt. */
  const oeffneOderAnlegen = (name) => {
    let z = seiteMitTitel(name);
    if (!z) {
      z = Store.addPage(null, { text: name.trim(), icon: '📄' });
      const start = Store.addBlock(z.id, 'text');
      UI.toast('Seite „' + name.trim() + '" angelegt');
      App.zeichneBaum();
    }
    App.oeffne(z.id);
  };

  /* ========================================================================
   * RÜCKVERWEISE
   * ------------------------------------------------------------------------
   * Wer zeigt auf diese Seite? Genau das fehlt in Notion und ist der Grund,
   * warum Logseq und Foam überhaupt entstanden sind.
   * ======================================================================*/
  const verweiseAuf = (seiteId) => {
    const p = Store.getBlock(seiteId);
    if (!p) return [];
    const titel = (p.text || '').trim().toLowerCase();
    const treffer = new Map();   /* seitenId -> { seite, stellen: [] } */

    Object.values(Store.cache.blocks).forEach(b => {
      if (!b.alive || !b.text) return;
      if (b.id === seiteId) return;

      const zeigtDarauf =
        (titel && new RegExp('\\[\\[\\s*' + entschaerfe(titel) + '\\s*\\]\\]', 'i').test(b.text)) ||
        new RegExp('\\(\\(' + entschaerfe(seiteId) + '\\)\\)').test(b.text);

      if (!zeigtDarauf) return;
      const quelle = seiteVon(b.id);
      if (!quelle || quelle.id === seiteId) return;

      if (!treffer.has(quelle.id)) treffer.set(quelle.id, { seite: quelle, stellen: [] });
      treffer.get(quelle.id).stellen.push(b);
    });

    /* Unterseiten zählen auch als Verweis — das ist die Baumkante. */
    return [...treffer.values()];
  };

  /** Seiten, die den Titel erwähnen, ohne ihn zu verlinken. */
  const unverlinkt = (seiteId) => {
    const p = Store.getBlock(seiteId);
    const titel = (p?.text || '').trim();
    if (titel.length < 3) return [];
    const n = titel.toLowerCase();
    const schonVerlinkt = new Set(verweiseAuf(seiteId).map(v => v.seite.id));
    const out = new Map();

    Object.values(Store.cache.blocks).forEach(b => {
      if (!b.alive || !b.text || b.id === seiteId) return;
      const t = b.text.toLowerCase();
      if (!t.includes(n)) return;
      if (t.includes('[[' + n)) return;
      const quelle = seiteVon(b.id);
      if (!quelle || quelle.id === seiteId || schonVerlinkt.has(quelle.id)) return;
      if (!out.has(quelle.id)) out.set(quelle.id, { seite: quelle, stellen: [] });
      out.get(quelle.id).stellen.push(b);
    });
    return [...out.values()];
  };

  const entschaerfe = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /* ========================================================================
   * SCHLAGWÖRTER
   * ======================================================================*/
  const alleTags = () => {
    const map = new Map();   /* tag -> Set von Seiten-IDs */
    Object.values(Store.cache.blocks).forEach(b => {
      if (!b.alive || !b.text) return;
      const gefunden = b.text.match(/(^|[\s(])#([A-Za-z0-9ÄÖÜäöüß][\wÄÖÜäöüß\-\/]{1,40})/g);
      if (!gefunden) return;
      const quelle = seiteVon(b.id);
      if (!quelle) return;
      gefunden.forEach(g => {
        const tag = g.trim().replace(/^#/, '');
        if (!map.has(tag)) map.set(tag, new Set());
        map.get(tag).add(quelle.id);
      });
    });
    return [...map.entries()]
      .map(([tag, set]) => ({ tag, seiten: [...set].map(id => Store.getBlock(id)).filter(Boolean) }))
      .sort((a, b) => b.seiten.length - a.seiten.length || a.tag.localeCompare(b.tag));
  };

  /* ========================================================================
   * DIE FUSSZEILE UNTER JEDER SEITE
   * ======================================================================*/
  const fusszeile = (seite, wrap) => {
    if (!seite) return;
    const rueck = verweiseAuf(seite.id);
    const lose  = unverlinkt(seite.id);
    if (!rueck.length && !lose.length) return;

    const d = document.createElement('div');
    d.className = 'backlinks';

    const abschnitt = (titel, liste, klasse) => {
      if (!liste.length) return '';
      return `<div class="bl-head ${klasse}">${titel} <em>${liste.length}</em></div>` +
        liste.map(v =>
          `<div class="bl-item" data-open="${v.seite.id}">` +
            `<div class="bl-t">${esc(v.seite.icon || '📄')} ${esc(v.seite.text || 'Ohne Titel')}</div>` +
            v.stellen.slice(0, 3).map(s =>
              `<div class="bl-s">${esc((s.text || '').slice(0, 160))}</div>`).join('') +
          `</div>`).join('');
    };

    d.innerHTML =
      abschnitt('Rückverweise', rueck, 'ein') +
      abschnitt('Unverlinkte Erwähnungen', lose, 'zwei');

    d.addEventListener('click', e => {
      const it = e.target.closest('[data-open]');
      if (it) App.oeffne(it.dataset.open);
    });
    wrap.appendChild(d);
  };

  /* ========================================================================
   * AUTOVERVOLLSTÄNDIGUNG BEIM TIPPEN VON [[
   * ======================================================================*/
  let picker = null;

  const pickerSchliessen = () => {
    if (picker) { picker.remove(); picker = null; }
  };

  const textVorCursor = (ct) => {
    const s = getSelection();
    if (!s.rangeCount) return '';
    const r = s.getRangeAt(0).cloneRange();
    r.selectNodeContents(ct);
    r.setEnd(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
    return r.toString();
  };

  /** Ersetzt das offene [[… am Ende durch [[Name]]. */
  const einsetzen = (ct, name) => {
    const b = Store.getBlock(ct.closest('.blk')?.dataset.bid);
    if (!b) return;
    const neu = ct.textContent.replace(/\[\[[^\[\]]*$/, '[[' + name + ']]');
    ct.textContent = neu;
    Store.updateBlock(b.id, { text: neu });
    pickerSchliessen();
    App.zeichneSeite(b.id, 'ende');
  };

  const zeigePicker = (ct, suchbegriff) => {
    pickerSchliessen();
    const q = suchbegriff.toLowerCase();
    const liste = seiten()
      .filter(p => !q || (p.text || '').toLowerCase().includes(q))
      .sort((a, b) => (b.edited || '').localeCompare(a.edited || ''))
      .slice(0, 8);

    const r = ct.getBoundingClientRect();
    let html = '<div class="grp">Auf Seite verlinken</div>';
    liste.forEach(p => {
      html += `<button data-p="${esc(p.text || '')}"><span class="mi">${esc(p.icon || '📄')}</span>` +
              `<span>${esc(p.text || 'Ohne Titel')}</span></button>`;
    });
    if (suchbegriff.trim()) {
      html += '<hr><button data-p="' + esc(suchbegriff.trim()) + '" data-neu="1">' +
              '<span class="mi">✚</span>Neue Seite „' + esc(suchbegriff.trim()) + '"</button>';
    }
    if (!liste.length && !suchbegriff.trim()) html += '<div class="grp">Noch keine Seiten</div>';

    picker = UI.menu(html, r.left, r.bottom + 4);
    picker.addEventListener('mousedown', e => e.preventDefault());
    picker.addEventListener('click', e => {
      const b = e.target.closest('button[data-p]');
      if (b) einsetzen(ct, b.dataset.p);
    });
    const erste = picker.querySelector('button[data-p]');
    if (erste) erste.classList.add('on');
  };

  /* ========================================================================
   * DER GRAPH
   * ------------------------------------------------------------------------
   * Kein fertiges Diagrammpaket, sondern eine kleine Kräftesimulation:
   * verbundene Punkte ziehen sich an, alle Punkte stossen sich ab.
   * ======================================================================*/
  const graph = () => {
    const alle = seiten();
    if (!alle.length) { UI.toast('Noch keine Seiten für den Graphen'); return; }

    /* Knoten und Kanten aufbauen */
    const idx = new Map(alle.map((p, i) => [p.id, i]));
    const knoten = alle.map((p, i) => ({
      id: p.id, name: p.text || 'Ohne Titel', icon: p.icon || '📄',
      x: Math.cos(i / alle.length * 6.283) * 200 + (i % 7) * 9,
      y: Math.sin(i / alle.length * 6.283) * 200 + (i % 5) * 9,
      vx: 0, vy: 0, grad: 0
    }));
    const kanten = [];
    const merke = (a, b, art) => {
      if (a === b || !idx.has(a) || !idx.has(b)) return;
      kanten.push({ a: idx.get(a), b: idx.get(b), art });
      knoten[idx.get(a)].grad++; knoten[idx.get(b)].grad++;
    };

    alle.forEach(p => { if (p.parentId && idx.has(p.parentId)) merke(p.parentId, p.id, 'baum'); });
    Object.values(Store.cache.blocks).forEach(b => {
      if (!b.alive || !b.text) return;
      const quelle = seiteVon(b.id);
      if (!quelle) return;
      (b.text.match(/\[\[([^\[\]\n]{1,120})\]\]/g) || []).forEach(m => {
        const ziel = seiteMitTitel(m.slice(2, -2));
        if (ziel) merke(quelle.id, ziel.id, 'link');
      });
    });

    /* Oberfläche */
    const o = document.createElement('div');
    o.className = 'overlay graph-overlay';
    o.innerHTML =
      '<div class="graph-box">' +
        '<div class="graph-head"><b>Graph</b>' +
          `<span class="graph-info">${knoten.length} Seiten · ${kanten.length} Verbindungen</span>` +
          '<button class="icon-btn" data-a="zu">✕</button>' +
        '</div>' +
        '<canvas></canvas>' +
        '<div class="hint">Ziehen verschiebt die Ansicht · Klick öffnet die Seite · ' +
          'Linien: durchgezogen = Unterseite, gestrichelt = [[Link]]</div>' +
      '</div>';
    document.body.appendChild(o);

    const cv = o.querySelector('canvas');
    const ctx = cv.getContext('2d');
    let kx = 0, ky = 0, zoom = 1;

    const groesse = () => {
      const r = cv.parentElement.getBoundingClientRect();
      cv.width = r.width * devicePixelRatio;
      cv.height = (r.height - 92) * devicePixelRatio;
      cv.style.width = r.width + 'px';
      cv.style.height = (r.height - 92) + 'px';
    };
    groesse();
    addEventListener('resize', groesse);

    const farbe = (name) => getComputedStyle(document.body).getPropertyValue(name).trim();

    let laeuft = true;
    const schritt = () => {
      /* Abstossung */
      for (let i = 0; i < knoten.length; i++) {
        for (let j = i + 1; j < knoten.length; j++) {
          const dx = knoten[j].x - knoten[i].x, dy = knoten[j].y - knoten[i].y;
          const d2 = dx * dx + dy * dy + 0.01;
          const f = 1400 / d2;
          const d = Math.sqrt(d2);
          knoten[i].vx -= f * dx / d; knoten[i].vy -= f * dy / d;
          knoten[j].vx += f * dx / d; knoten[j].vy += f * dy / d;
        }
      }
      /* Anziehung entlang der Kanten */
      kanten.forEach(k => {
        const a = knoten[k.a], b = knoten[k.b];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
        const f = (d - 110) * 0.012;
        a.vx += f * dx / d; a.vy += f * dy / d;
        b.vx -= f * dx / d; b.vy -= f * dy / d;
      });
      /* Zur Mitte ziehen und bremsen */
      knoten.forEach(n => {
        n.vx -= n.x * 0.0016; n.vy -= n.y * 0.0016;
        n.vx *= 0.86; n.vy *= 0.86;
        n.x += n.vx; n.y += n.vy;
      });
    };

    const zeichne = () => {
      const w = cv.width, h = cv.height, dpr = devicePixelRatio;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, w / 2 + kx * dpr, h / 2 + ky * dpr);

      ctx.lineWidth = 1;
      kanten.forEach(k => {
        const a = knoten[k.a], b = knoten[k.b];
        ctx.strokeStyle = k.art === 'link' ? farbe('--accent') : farbe('--line');
        ctx.setLineDash(k.art === 'link' ? [4, 4] : []);
        ctx.globalAlpha = k.art === 'link' ? 0.75 : 0.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      });
      ctx.setLineDash([]); ctx.globalAlpha = 1;

      ctx.textAlign = 'center';
      ctx.font = '12px ' + farbe('--font');
      knoten.forEach(n => {
        const r = 5 + Math.min(9, n.grad * 1.6);
        ctx.fillStyle = n.grad ? farbe('--accent') : farbe('--text-faint');
        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284); ctx.fill();
        ctx.fillStyle = farbe('--text');
        ctx.fillText(n.name.slice(0, 22), n.x, n.y + r + 13);
      });
    };

    const schleife = () => {
      if (!laeuft || !document.body.contains(o)) return;
      schritt(); zeichne();
      requestAnimationFrame(schleife);
    };
    schleife();

    /* Ziehen, Zoomen, Klicken */
    let zieht = false, zx = 0, zy = 0, bewegt = 0;
    cv.addEventListener('mousedown', e => { zieht = true; zx = e.clientX; zy = e.clientY; bewegt = 0; });
    addEventListener('mousemove', e => {
      if (!zieht) return;
      kx += e.clientX - zx; ky += e.clientY - zy;
      bewegt += Math.abs(e.clientX - zx) + Math.abs(e.clientY - zy);
      zx = e.clientX; zy = e.clientY;
    });
    addEventListener('mouseup', () => { zieht = false; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      zoom = Math.max(0.25, Math.min(3, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
    }, { passive: false });
    cv.addEventListener('click', e => {
      if (bewegt > 6) return;
      const r = cv.getBoundingClientRect();
      const mx = (e.clientX - r.left - r.width / 2 - kx) / zoom;
      const my = (e.clientY - r.top - r.height / 2 - ky) / zoom;
      let beste = null, bd = 26 * 26;
      knoten.forEach(n => {
        const d = (n.x - mx) ** 2 + (n.y - my) ** 2;
        if (d < bd) { bd = d; beste = n; }
      });
      if (beste) { laeuft = false; o.remove(); App.oeffne(beste.id); }
    });

    o.addEventListener('click', e => {
      if (e.target === o || e.target.closest('[data-a="zu"]')) { laeuft = false; o.remove(); }
    });
  };

  /* ========================================================================
   * SCHLAGWORT-REGISTER
   * ======================================================================*/
  const tagRegister = (vorgewaehlt = '') => {
    const tags = alleTags();
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML =
      '<div class="finder" style="width:min(680px,94vw)">' +
        '<div class="fh">Schlagwörter <em>' + tags.length + '</em></div>' +
        '<div class="res" id="tagres"></div>' +
        '<div class="hint">Ein Schlagwort setzt du, indem du irgendwo <code>#wort</code> schreibst.</div>' +
      '</div>';
    document.body.appendChild(o);

    const res = o.querySelector('#tagres');
    const zeichne = (aktiv) => {
      if (!tags.length) {
        res.innerHTML = '<div style="padding:16px; color:var(--text-faint); font-size:14px">' +
                        'Noch keine Schlagwörter vergeben.</div>';
        return;
      }
      res.innerHTML =
        '<div class="tagwolke">' + tags.map(t =>
          `<button class="tagpill${t.tag === aktiv ? ' on' : ''}" data-t="${esc(t.tag)}">` +
          `#${esc(t.tag)} <em>${t.seiten.length}</em></button>`).join('') + '</div>' +
        (aktiv ? (tags.find(t => t.tag === aktiv)?.seiten || []).map(p =>
          `<button data-open="${p.id}"><span>${esc(p.icon || '📄')}</span>` +
          `<span style="flex:1">${esc(p.text || 'Ohne Titel')}</span></button>`).join('') : '');
    };
    zeichne(vorgewaehlt || (tags[0] && tags[0].tag));

    o.addEventListener('click', e => {
      const t = e.target.closest('[data-t]');
      if (t) { zeichne(t.dataset.t); return; }
      const p = e.target.closest('[data-open]');
      if (p) { o.remove(); App.oeffne(p.dataset.open); return; }
      if (e.target === o) o.remove();
    });
  };

  /* ========================================================================
   * START — globale Klicks und das Tippen überwachen
   * ======================================================================*/
  const start = () => {
    /* Klick auf einen Seitenlink, ein Schlagwort oder einen Blockverweis */
    document.addEventListener('click', e => {
      const wl = e.target.closest('a.wl');
      if (wl) { e.preventDefault(); oeffneOderAnlegen(wl.dataset.wl); return; }

      const tg = e.target.closest('a.tg');
      if (tg) { e.preventDefault(); tagRegister(tg.dataset.tag); return; }

      const bl = e.target.closest('a.bl');
      if (bl) {
        e.preventDefault();
        const ziel = Store.getBlock(bl.dataset.bref);
        if (!ziel) return;
        const s = seiteVon(ziel.id);
        if (s && s.id !== App.aktuelleSeite()) App.oeffne(s.id);
        setTimeout(() => {
          const el = document.querySelector(`[data-bid="${ziel.id}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('blitz');
            setTimeout(() => el.classList.remove('blitz'), 1400);
          }
        }, 80);
      }
    });

    /* [[ tippen öffnet die Seitenauswahl */
    document.getElementById('page').addEventListener('input', e => {
      const ct = e.target.closest('.ct');
      if (!ct) { pickerSchliessen(); return; }
      const vor = textVorCursor(ct);
      const m = vor.match(/\[\[([^\[\]]*)$/);
      if (m) zeigePicker(ct, m[1]);
      else pickerSchliessen();
    });

    document.addEventListener('keydown', e => {
      if (!picker) return;
      const btns = [...picker.querySelectorAll('button[data-p]')];
      const aktiv = picker.querySelector('button.on');
      const i = btns.indexOf(aktiv);
      if (e.key === 'Escape') { pickerSchliessen(); e.stopPropagation(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (aktiv) aktiv.classList.remove('on');
        const j = e.key === 'ArrowDown' ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
        if (btns[j]) btns[j].classList.add('on');
        return;
      }
      if (e.key === 'Enter' && (aktiv || btns[0])) {
        e.preventDefault();
        const ct = document.activeElement.closest?.('.ct');
        if (ct) einsetzen(ct, (aktiv || btns[0]).dataset.p);
      }
    }, true);
  };

  return {
    start, inline, seiten, seiteMitTitel, seiteVon, oeffneOderAnlegen,
    verweiseAuf, unverlinkt, alleTags, fusszeile, graph, tagRegister
  };
})();

window.Links = Links;

</script>
<script>
/* ===== js/canvas.js ===== */
/* ============================================================================
 * canvas.js — Zeichenfläche, Diagramme, einfache Tabelle, Mathematik
 * ----------------------------------------------------------------------------
 * Vier Blöcke, die man sonst nur in anderen Programmen bekommt:
 *
 *   Whiteboard   frei zeichnen, Formen, Haftnotizen  (wie AFFiNE „edgeless")
 *   Diagramm     Balken, Linie, Ring                 (wie tui.editor / Notion Chart)
 *   Tabelle      einfache Tabelle ohne Datenbank     (Notions „Simple table")
 *   Mathematik   LaTeX-Formeln ohne fremde Pakete    (wie MarkText / Zettlr)
 *
 * Alles ohne Abhängigkeiten, alles offline.
 * ==========================================================================*/

const Zusatz = (() => {

  const esc = (s) => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const NS = 'http://www.w3.org/2000/svg';
  const sv = (name, attrs = {}) => {
    const e = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  };

  const PALETTE = ['#529cca', '#4dab9a', '#ffa344', '#ff7369', '#9a6dd7', '#e255a1', '#ffdc49', '#9b9a97'];

  /* ========================================================================
   * 1. WHITEBOARD
   * ======================================================================*/
  const whiteboard = (block) => {
    const daten = block.shapes ? JSON.parse(JSON.stringify(block.shapes)) : [];
    let werkzeug = 'stift';
    let farbe = PALETTE[0];
    const hoehe = block.hoehe || 380;

    const w = document.createElement('div');
    w.className = 'wb';
    w.innerHTML =
      '<div class="wb-tools">' +
        [['zeiger', '⭠', 'Auswählen und verschieben'],
         ['stift', '✎', 'Freihand zeichnen'],
         ['linie', '╱', 'Linie'],
         ['pfeil', '→', 'Pfeil'],
         ['rechteck', '▭', 'Rechteck'],
         ['ellipse', '◯', 'Ellipse'],
         ['notiz', '🗒', 'Haftnotiz'],
         ['text', 'T', 'Text'],
         ['radierer', '⌫', 'Radierer']]
          .map(([id, ico, titel]) =>
            `<button data-wz="${id}" title="${titel}"${id === 'stift' ? ' class="on"' : ''}>${ico}</button>`).join('') +
        '<span class="wb-sep"></span>' +
        PALETTE.map(c => `<button class="wb-farbe" data-c="${c}" style="background:${c}"></button>`).join('') +
        '<span class="wb-sep"></span>' +
        '<button data-a="zurueck" title="Letztes rückgängig">↶</button>' +
        '<button data-a="leeren" title="Alles löschen">🗑</button>' +
        '<button data-a="png" title="Als Bild speichern">⭳</button>' +
      '</div>';

    const flaeche = sv('svg', { class: 'wb-flaeche', width: '100%', height: hoehe });
    flaeche.style.height = hoehe + 'px';
    w.appendChild(flaeche);

    const griff = document.createElement('div');
    griff.className = 'wb-griff';
    griff.title = 'Höhe ziehen';
    w.appendChild(griff);

    /* --- Zeichnen ------------------------------------------------------- */
    const sichern = () => Store.updateBlock(block.id, { shapes: daten });

    const male = () => {
      flaeche.innerHTML = '';
      const raster = sv('pattern', { id: 'r' + block.id.slice(0, 6), width: 24, height: 24, patternUnits: 'userSpaceOnUse' });
      raster.appendChild(sv('circle', { cx: 1, cy: 1, r: 1, fill: 'currentColor', opacity: .18 }));
      const defs = sv('defs');
      defs.appendChild(raster);
      const spitze = sv('marker', { id: 'p' + block.id.slice(0, 6), markerWidth: 9, markerHeight: 9,
                                    refX: 8, refY: 3, orient: 'auto' });
      spitze.appendChild(sv('path', { d: 'M0,0 L9,3 L0,6 z', fill: 'context-stroke' }));
      defs.appendChild(spitze);
      flaeche.appendChild(defs);
      flaeche.appendChild(sv('rect', { width: '100%', height: '100%', fill: `url(#r${block.id.slice(0, 6)})` }));

      daten.forEach(s => flaeche.appendChild(formZeichnen(s)));
    };

    const formZeichnen = (s) => {
      if (s.art === 'stift' || s.art === 'linie' || s.art === 'pfeil') {
        const p = sv('path', {
          d: s.art === 'stift'
            ? 'M' + s.pts.map(q => q[0] + ' ' + q[1]).join(' L')
            : `M${s.x} ${s.y} L${s.x + s.w} ${s.y + s.h}`,
          stroke: s.farbe, 'stroke-width': 2.5, fill: 'none',
          'stroke-linecap': 'round', 'stroke-linejoin': 'round'
        });
        if (s.art === 'pfeil') p.setAttribute('marker-end', `url(#p${block.id.slice(0, 6)})`);
        p.dataset.sid = s.id;
        return p;
      }
      if (s.art === 'rechteck' || s.art === 'notiz') {
        const g = sv('g');
        const r = sv('rect', {
          x: Math.min(s.x, s.x + s.w), y: Math.min(s.y, s.y + s.h),
          width: Math.abs(s.w), height: Math.abs(s.h), rx: s.art === 'notiz' ? 3 : 5,
          fill: s.art === 'notiz' ? s.farbe : 'none', stroke: s.farbe, 'stroke-width': 2,
          'fill-opacity': s.art === 'notiz' ? .85 : 1
        });
        r.dataset.sid = s.id;
        g.appendChild(r);
        if (s.text) {
          const t = sv('text', {
            x: Math.min(s.x, s.x + s.w) + 10, y: Math.min(s.y, s.y + s.h) + 22,
            fill: s.art === 'notiz' ? '#1c1c1c' : s.farbe, 'font-size': 14
          });
          zeilenUmbruch(s.text, Math.abs(s.w) - 18).forEach((z, i) => {
            const ts = sv('tspan', { x: Math.min(s.x, s.x + s.w) + 10, dy: i ? 18 : 0 });
            ts.textContent = z;
            t.appendChild(ts);
          });
          g.appendChild(t);
        }
        return g;
      }
      if (s.art === 'ellipse') {
        const e = sv('ellipse', {
          cx: s.x + s.w / 2, cy: s.y + s.h / 2,
          rx: Math.abs(s.w / 2), ry: Math.abs(s.h / 2),
          fill: 'none', stroke: s.farbe, 'stroke-width': 2
        });
        e.dataset.sid = s.id;
        return e;
      }
      /* text */
      const t = sv('text', { x: s.x, y: s.y, fill: s.farbe, 'font-size': 17, 'font-weight': 500 });
      t.textContent = s.text || '';
      t.dataset.sid = s.id;
      return t;
    };

    const zeilenUmbruch = (text, breite) => {
      const proZeile = Math.max(6, Math.floor(breite / 7.4));
      const worte = String(text).split(/\s+/);
      const out = []; let zeile = '';
      worte.forEach(x => {
        if ((zeile + ' ' + x).trim().length > proZeile) { out.push(zeile.trim()); zeile = x; }
        else zeile += ' ' + x;
      });
      if (zeile.trim()) out.push(zeile.trim());
      return out.slice(0, 8);
    };

    const punkt = (e) => {
      const r = flaeche.getBoundingClientRect();
      return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
    };

    let aktiv = null, verschiebt = null;

    flaeche.addEventListener('pointerdown', e => {
      flaeche.setPointerCapture(e.pointerId);
      const [x, y] = punkt(e);

      if (werkzeug === 'radierer') {
        const sid = e.target.dataset?.sid;
        if (sid) { const i = daten.findIndex(s => s.id === sid); if (i >= 0) { daten.splice(i, 1); male(); sichern(); } }
        return;
      }
      if (werkzeug === 'zeiger') {
        const sid = e.target.dataset?.sid;
        const s = daten.find(q => q.id === sid);
        if (s) verschiebt = { s, x, y };
        return;
      }
      if (werkzeug === 'text' || werkzeug === 'notiz') {
        const text = prompt(werkzeug === 'notiz' ? 'Text der Haftnotiz' : 'Text');
        if (text === null) return;
        daten.push(werkzeug === 'notiz'
          ? { id: Store.uid().slice(0, 8), art: 'notiz', x, y, w: 170, h: 110, farbe, text }
          : { id: Store.uid().slice(0, 8), art: 'text', x, y, farbe, text });
        male(); sichern();
        return;
      }
      aktiv = werkzeug === 'stift'
        ? { id: Store.uid().slice(0, 8), art: 'stift', pts: [[x, y]], farbe }
        : { id: Store.uid().slice(0, 8), art: werkzeug, x, y, w: 0, h: 0, farbe };
      daten.push(aktiv);
    });

    flaeche.addEventListener('pointermove', e => {
      const [x, y] = punkt(e);
      if (verschiebt) {
        const dx = x - verschiebt.x, dy = y - verschiebt.y;
        const s = verschiebt.s;
        if (s.art === 'stift') s.pts = s.pts.map(p => [p[0] + dx, p[1] + dy]);
        else { s.x += dx; s.y += dy; }
        verschiebt.x = x; verschiebt.y = y;
        male();
        return;
      }
      if (!aktiv) return;
      if (aktiv.art === 'stift') aktiv.pts.push([x, y]);
      else { aktiv.w = x - aktiv.x; aktiv.h = y - aktiv.y; }
      male();
    });

    const fertig = () => {
      if (aktiv) {
        /* Winzige Kritzler wieder entfernen */
        const klein = aktiv.art === 'stift' ? aktiv.pts.length < 2 : Math.abs(aktiv.w) < 4 && Math.abs(aktiv.h) < 4;
        if (klein) daten.pop();
        aktiv = null; sichern(); male();
      }
      if (verschiebt) { verschiebt = null; sichern(); }
    };
    flaeche.addEventListener('pointerup', fertig);
    flaeche.addEventListener('pointerleave', fertig);

    /* --- Werkzeugleiste -------------------------------------------------- */
    w.querySelector('.wb-tools').addEventListener('click', e => {
      const wz = e.target.closest('[data-wz]');
      if (wz) {
        werkzeug = wz.dataset.wz;
        w.querySelectorAll('[data-wz]').forEach(b => b.classList.toggle('on', b === wz));
        return;
      }
      const c = e.target.closest('[data-c]');
      if (c) {
        farbe = c.dataset.c;
        w.querySelectorAll('.wb-farbe').forEach(b => b.classList.toggle('on', b === c));
        return;
      }
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'zurueck') { daten.pop(); male(); sichern(); }
      if (a.dataset.a === 'leeren') {
        if (!daten.length || confirm('Die ganze Zeichenfläche leeren?')) { daten.length = 0; male(); sichern(); }
      }
      if (a.dataset.a === 'png') alsBild(flaeche, hoehe);
    });

    /* --- Höhe ziehen ----------------------------------------------------- */
    griff.addEventListener('pointerdown', e => {
      e.preventDefault();
      const start = e.clientY, h0 = flaeche.getBoundingClientRect().height;
      const zug = (ev) => {
        const h = Math.max(180, Math.min(1200, h0 + ev.clientY - start));
        flaeche.style.height = h + 'px';
        flaeche.setAttribute('height', h);
      };
      const stop = () => {
        removeEventListener('pointermove', zug); removeEventListener('pointerup', stop);
        Store.updateBlock(block.id, { hoehe: Math.round(flaeche.getBoundingClientRect().height) });
      };
      addEventListener('pointermove', zug); addEventListener('pointerup', stop);
    });

    male();
    return w;
  };

  /** SVG als PNG herunterladen — ohne fremde Pakete. */
  const alsBild = (svgEl, hoehe) => {
    const kopie = svgEl.cloneNode(true);
    const breite = Math.round(svgEl.getBoundingClientRect().width);
    kopie.setAttribute('width', breite);
    kopie.setAttribute('height', hoehe);
    kopie.setAttribute('xmlns', NS);
    const quelle = new XMLSerializer().serializeToString(kopie);
    const bild = new Image();
    bild.onload = () => {
      const c = document.createElement('canvas');
      c.width = breite * 2; c.height = hoehe * 2;
      const g = c.getContext('2d');
      g.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg') || '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.scale(2, 2);
      g.drawImage(bild, 0, 0);
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png');
      a.download = 'whiteboard.png';
      a.click();
      UI.toast('Als PNG gespeichert');
    };
    bild.onerror = () => UI.toast('Das Bild liess sich nicht erzeugen');
    bild.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(quelle)));
  };

  /* ========================================================================
   * 2. DIAGRAMM
   * ------------------------------------------------------------------------
   * Datenquelle: entweder eingetippte Zeilen „Name: Wert" oder eine
   * Datenbank auf derselben Seite.
   * ======================================================================*/
  const CHART_TYPEN = [['bar', 'Balken'], ['column', 'Säulen'], ['line', 'Linie'], ['donut', 'Ring'], ['area', 'Fläche']];

  const diagramm = (block) => {
    const w = document.createElement('div');
    w.className = 'chart';

    const typ = block.chartTyp || 'bar';
    const werte = chartDaten(block);

    w.innerHTML =
      '<div class="chart-head">' +
        `<input class="chart-titel" value="${esc(block.text || '')}" placeholder="Titel des Diagramms">` +
        '<div class="chart-typen">' +
          CHART_TYPEN.map(([id, n]) =>
            `<button data-ct="${id}"${id === typ ? ' class="on"' : ''}>${n}</button>`).join('') +
        '</div>' +
        '<button class="chart-daten" title="Daten bearbeiten">✎ Daten</button>' +
      '</div>';

    const flaeche = document.createElement('div');
    flaeche.className = 'chart-flaeche';
    w.appendChild(flaeche);

    if (!werte.length) {
      flaeche.innerHTML = '<div class="chart-leer">Noch keine Daten. Klicke auf <b>✎ Daten</b> ' +
                          'und schreibe Zeilen wie <code>Montag: 12</code>.</div>';
    } else {
      flaeche.appendChild(chartSvg(typ, werte));
      const legende = document.createElement('div');
      legende.className = 'chart-legende';
      legende.innerHTML = werte.map((v, i) =>
        `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(v.name)} ` +
        `<b>${Formula.anzeige(v.wert)}</b></span>`).join('');
      w.appendChild(legende);
    }

    w.querySelector('.chart-titel').addEventListener('input', e =>
      Store.updateBlock(block.id, { text: e.target.value }));

    w.querySelector('.chart-head').addEventListener('click', e => {
      const t = e.target.closest('[data-ct]');
      if (t) { Store.updateBlock(block.id, { chartTyp: t.dataset.ct }); App.zeichneSeite(); return; }
      if (e.target.closest('.chart-daten')) datenEditor(block);
    });

    return w;
  };

  const chartDaten = (block) => {
    /* Aus einer Datenbank? */
    if (block.quelleDb) {
      const c = Store.getCollection(block.quelleDb);
      if (c) {
        const gruppe = block.gruppeNach, mess = block.messen;
        const zeilen = Store.rowsOf(c.id);
        if (gruppe) {
          const map = new Map();
          zeilen.forEach(r => {
            const k = Formula.anzeige(Datenbank.wert(r, gruppe, c)) || '(leer)';
            const v = mess ? Formula.zahl(Datenbank.wert(r, mess, c)) : 1;
            map.set(k, (map.get(k) || 0) + v);
          });
          return [...map.entries()].map(([name, wert]) => ({ name, wert }));
        }
      }
    }
    /* Aus dem Text */
    return String(block.daten || '').split('\n')
      .map(z => z.trim()).filter(Boolean)
      .map(z => {
        const m = z.match(/^(.*?)[:;,\t]\s*(-?[\d.,]+)\s*$/);
        return m ? { name: m[1].trim(), wert: parseFloat(m[2].replace(',', '.')) || 0 } : null;
      })
      .filter(Boolean);
  };

  const chartSvg = (typ, werte) => {
    const B = 640, H = 260, pad = 34;
    const max = Math.max(...werte.map(v => v.wert), 1);
    const s = sv('svg', { viewBox: `0 0 ${B} ${H}`, class: 'chart-svg', preserveAspectRatio: 'xMidYMid meet' });

    if (typ === 'donut') {
      const summe = werte.reduce((a, v) => a + v.wert, 0) || 1;
      let winkel = -Math.PI / 2;
      const cx = B / 2, cy = H / 2, ra = 100, ri = 58;
      werte.forEach((v, i) => {
        const teil = v.wert / summe * Math.PI * 2;
        const gross = teil > Math.PI ? 1 : 0;
        const x1 = cx + Math.cos(winkel) * ra, y1 = cy + Math.sin(winkel) * ra;
        const x2 = cx + Math.cos(winkel + teil) * ra, y2 = cy + Math.sin(winkel + teil) * ra;
        const x3 = cx + Math.cos(winkel + teil) * ri, y3 = cy + Math.sin(winkel + teil) * ri;
        const x4 = cx + Math.cos(winkel) * ri, y4 = cy + Math.sin(winkel) * ri;
        s.appendChild(sv('path', {
          d: `M${x1} ${y1} A${ra} ${ra} 0 ${gross} 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 ${gross} 0 ${x4} ${y4} Z`,
          fill: PALETTE[i % PALETTE.length]
        }));
        winkel += teil;
      });
      const t = sv('text', { x: cx, y: cy + 6, 'text-anchor': 'middle', 'font-size': 20, fill: 'currentColor' });
      t.textContent = Formula.anzeige(werte.reduce((a, v) => a + v.wert, 0));
      s.appendChild(t);
      return s;
    }

    /* Achsen */
    for (let i = 0; i <= 4; i++) {
      const y = pad + (H - pad * 2) * i / 4;
      s.appendChild(sv('line', { x1: pad, y1: y, x2: B - 8, y2: y, stroke: 'currentColor', opacity: .13 }));
      const t = sv('text', { x: pad - 6, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'currentColor', opacity: .55 });
      t.textContent = Math.round(max * (1 - i / 4));
      s.appendChild(t);
    }

    const n = werte.length;
    const feld = (B - pad - 12) / n;

    if (typ === 'line' || typ === 'area') {
      const punkte = werte.map((v, i) => [
        pad + feld * (i + 0.5),
        pad + (H - pad * 2) * (1 - v.wert / max)
      ]);
      if (typ === 'area') {
        s.appendChild(sv('path', {
          d: `M${punkte[0][0]} ${H - pad} L` + punkte.map(p => p.join(' ')).join(' L') +
             ` L${punkte[n - 1][0]} ${H - pad} Z`,
          fill: PALETTE[0], opacity: .22
        }));
      }
      s.appendChild(sv('path', {
        d: 'M' + punkte.map(p => p.join(' ')).join(' L'),
        stroke: PALETTE[0], 'stroke-width': 2.5, fill: 'none', 'stroke-linejoin': 'round'
      }));
      punkte.forEach((p, i) => {
        s.appendChild(sv('circle', { cx: p[0], cy: p[1], r: 4, fill: PALETTE[0] }));
      });
    } else {
      werte.forEach((v, i) => {
        const h = (H - pad * 2) * (v.wert / max);
        if (typ === 'bar' || typ === 'column') {
          s.appendChild(sv('rect', {
            x: pad + feld * i + feld * 0.16, y: H - pad - h,
            width: feld * 0.68, height: Math.max(1, h),
            fill: PALETTE[i % PALETTE.length], rx: 3
          }));
        }
      });
    }

    /* Beschriftung unten */
    werte.forEach((v, i) => {
      const t = sv('text', {
        x: pad + feld * (i + 0.5), y: H - pad + 15, 'text-anchor': 'middle',
        'font-size': 10.5, fill: 'currentColor', opacity: .7
      });
      t.textContent = String(v.name).slice(0, 12);
      s.appendChild(t);
    });
    return s;
  };

  const datenEditor = (block) => {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML =
      '<div class="finder" style="width:min(560px,94vw)">' +
        '<div class="fh">Daten des Diagramms</div>' +
        '<div style="padding:14px 18px">' +
          '<textarea id="cd" rows="10" style="width:100%; background:var(--bg-input); border:1px solid var(--line);' +
          'border-radius:8px; padding:10px 12px; outline:none; font:13.5px var(--mono); resize:vertical">' +
          esc(block.daten || 'Montag: 12\nDienstag: 18\nMittwoch: 9') + '</textarea>' +
          '<div style="margin-top:10px; font-size:12.5px; color:var(--text-dim)">' +
          'Eine Zeile je Wert: <code>Name: Zahl</code></div>' +
        '</div>' +
        '<div class="fbtns"><button data-a="ok" class="prim">Übernehmen</button>' +
        '<button data-a="zu">Abbrechen</button></div>' +
      '</div>';
    document.body.appendChild(o);
    const ta = o.querySelector('#cd');
    ta.focus();
    o.addEventListener('click', e => {
      if (e.target.closest('[data-a="ok"]')) {
        Store.updateBlock(block.id, { daten: ta.value });
        o.remove(); App.zeichneSeite();
      } else if (e.target.closest('[data-a="zu"]') || e.target === o) o.remove();
    });
  };

  /* ========================================================================
   * 3. EINFACHE TABELLE  (Notions „Simple table" — ohne Datenbank)
   * ======================================================================*/
  const tabelle = (block) => {
    const rows = block.rows && block.rows.length ? block.rows : [['', '', ''], ['', '', ''], ['', '', '']];
    const kopf = block.kopfZeile !== false;
    const kopfSpalte = !!block.kopfSpalte;

    const w = document.createElement('div');
    w.className = 'stab-wrap';

    const t = document.createElement('table');
    t.className = 'stab' + (kopf ? ' kopf' : '') + (kopfSpalte ? ' kopfspalte' : '');

    rows.forEach((zeile, y) => {
      const tr = document.createElement('tr');
      zeile.forEach((zelle, x) => {
        const td = document.createElement(kopf && y === 0 ? 'th' : 'td');
        td.contentEditable = 'true';
        td.spellcheck = false;
        td.innerHTML = Blocks.inline(zelle || '');
        td.dataset.x = x; td.dataset.y = y;
        td.addEventListener('input', () => {
          rows[y][x] = td.textContent;
          Store.updateBlock(block.id, { rows });
        });
        td.addEventListener('keydown', e => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const naechste = t.querySelectorAll('td,th');
            const i = [...naechste].indexOf(td);
            const z = naechste[i + (e.shiftKey ? -1 : 1)];
            if (z) { z.focus(); document.execCommand?.('selectAll', false, null); }
          }
        });
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    w.appendChild(t);

    const werkzeuge = document.createElement('div');
    werkzeuge.className = 'stab-tools';
    werkzeuge.innerHTML =
      '<button data-a="sp+">Spalte +</button><button data-a="sp-">Spalte −</button>' +
      '<button data-a="ze+">Zeile +</button><button data-a="ze-">Zeile −</button>' +
      `<button data-a="kopf" class="${kopf ? 'on' : ''}">Kopfzeile</button>` +
      `<button data-a="kopfsp" class="${kopfSpalte ? 'on' : ''}">Kopfspalte</button>` +
      '<button data-a="csv">Als CSV</button>';
    werkzeuge.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'sp+') rows.forEach(z => z.push(''));
      if (a === 'sp-' && rows[0].length > 1) rows.forEach(z => z.pop());
      if (a === 'ze+') rows.push(new Array(rows[0].length).fill(''));
      if (a === 'ze-' && rows.length > 1) rows.pop();
      if (a === 'kopf')   { Store.updateBlock(block.id, { kopfZeile: !kopf }); App.zeichneSeite(); return; }
      if (a === 'kopfsp') { Store.updateBlock(block.id, { kopfSpalte: !kopfSpalte }); App.zeichneSeite(); return; }
      if (a === 'csv') {
        const csv = rows.map(z => z.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
        const l = document.createElement('a');
        l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        l.download = 'tabelle.csv'; l.click();
        UI.toast('Tabelle als CSV gespeichert');
        return;
      }
      Store.updateBlock(block.id, { rows });
      App.zeichneSeite();
    });
    w.appendChild(werkzeuge);
    return w;
  };

  /* ========================================================================
   * 4. MATHEMATIK
   * ------------------------------------------------------------------------
   * Ein kleiner LaTeX-Übersetzer. Deckt ab, was in Notizen wirklich
   * vorkommt: Brüche, Wurzeln, Hoch/Tief, Summen, griechische Buchstaben.
   * ======================================================================*/
  const GRIECHISCH = {
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', zeta:'ζ', eta:'η', theta:'θ',
    iota:'ι', kappa:'κ', lambda:'λ', mu:'μ', nu:'ν', xi:'ξ', pi:'π', rho:'ρ', sigma:'σ',
    tau:'τ', phi:'φ', chi:'χ', psi:'ψ', omega:'ω',
    Gamma:'Γ', Delta:'Δ', Theta:'Θ', Lambda:'Λ', Xi:'Ξ', Pi:'Π', Sigma:'Σ', Phi:'Φ', Psi:'Ψ', Omega:'Ω'
  };
  const ZEICHEN = {
    times:'×', div:'÷', pm:'±', mp:'∓', cdot:'·', leq:'≤', geq:'≥', neq:'≠', approx:'≈',
    equiv:'≡', propto:'∝', infty:'∞', partial:'∂', nabla:'∇', forall:'∀', exists:'∃',
    in:'∈', notin:'∉', subset:'⊂', supset:'⊃', cup:'∪', cap:'∩', emptyset:'∅',
    rightarrow:'→', leftarrow:'←', Rightarrow:'⇒', Leftarrow:'⇐', leftrightarrow:'↔',
    sum:'∑', prod:'∏', int:'∫', iint:'∬', oint:'∮', sqrt:'√', angle:'∠', deg:'°',
    ldots:'…', cdots:'⋯', therefore:'∴', because:'∵', ne:'≠', le:'≤', ge:'≥'
  };

  const mathe = (roh) => {
    let s = esc(roh || '');

    /* \frac{a}{b} */
    for (let i = 0; i < 4; i++) {
      s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,
        '<span class="mfrac"><span class="mz">$1</span><span class="mn">$2</span></span>');
    }
    /* \sqrt{a} und \sqrt[n]{a} */
    s = s.replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g, '<sup class="mw">$1</sup>√<span class="munter">$2</span>');
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√<span class="munter">$1</span>');
    /* \text{…} */
    s = s.replace(/\\(?:text|mathrm)\{([^{}]*)\}/g, '<span class="mtext">$1</span>');
    /* Hoch und tief */
    s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^(\w)/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_(\w)/g, '<sub>$1</sub>');
    /* Befehle */
    s = s.replace(/\\([A-Za-z]+)/g, (_, name) =>
      GRIECHISCH[name] || ZEICHEN[name] || ('<span class="mop">' + name + '</span>'));
    /* Reste */
    s = s.replace(/[{}]/g, '');
    return '<span class="mathe">' + s + '</span>';
  };

  /** Der Formelblock: zeigt gerendert, beim Klick erscheint die Quelle. */
  const formelBlock = (block) => {
    const w = document.createElement('div');
    w.className = 'eq';

    const anzeige = document.createElement('div');
    anzeige.className = 'eq-out';
    anzeige.innerHTML = block.text ? mathe(block.text)
      : '<span style="color:var(--text-faint); font-size:14px">Formel eintippen — z. B. E = mc^2 oder \\frac{a}{b}</span>';

    const quelle = document.createElement('textarea');
    quelle.className = 'eq-src';
    quelle.value = block.text || '';
    quelle.rows = 2;
    quelle.spellcheck = false;
    quelle.style.display = 'none';
    quelle.placeholder = '\\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}';

    anzeige.addEventListener('click', () => {
      anzeige.style.display = 'none';
      quelle.style.display = '';
      quelle.focus();
    });
    const zurueck = () => {
      Store.updateBlock(block.id, { text: quelle.value });
      anzeige.innerHTML = quelle.value ? mathe(quelle.value)
        : '<span style="color:var(--text-faint); font-size:14px">Formel eintippen …</span>';
      quelle.style.display = 'none';
      anzeige.style.display = '';
    };
    quelle.addEventListener('blur', zurueck);
    quelle.addEventListener('input', () => Store.updateBlock(block.id, { text: quelle.value }));
    quelle.addEventListener('keydown', e => { if (e.key === 'Escape') zurueck(); });

    w.appendChild(anzeige);
    w.appendChild(quelle);
    return w;
  };

  return { whiteboard, diagramm, tabelle, mathe, formelBlock, chartSvg, chartDaten, PALETTE };
})();

window.Zusatz = Zusatz;

</script>
<script>
/* ===== js/blocks.js ===== */
/* ============================================================================
 * blocks.js — Der Block-Editor
 * ----------------------------------------------------------------------------
 * Alles ist ein Block. Ein Absatz ist ein Block, eine Überschrift ist ein
 * Block, eine Unterseite ist ein Block, eine Datenbank ist ein Block.
 * Genau wie bei Notion.
 *
 * Dieser Datei gehört:
 *   - der Katalog aller Blocktypen (mit Slash-Befehl und Tastenkürzel)
 *   - das Rendern eines Blocks ins DOM
 *   - die Tastatursteuerung im Editor
 *   - das Slash-Menü
 *   - die Markdown-Kürzel beim Tippen
 *   - das Block-Handle-Menü
 * ==========================================================================*/

const Blocks = (() => {

  /* ========================================================================
   * DER KATALOG
   * ------------------------------------------------------------------------
   * gruppe   – Überschrift im Slash-Menü
   * cmd      – die Wörter, auf die der Slash-Befehl reagiert
   * kurz     – Tastenkürzel, das den Blocktyp setzt
   * md       – Markdown-Kürzel, das beim Tippen sofort umwandelt
   * ======================================================================*/
  const TYPEN = [
    /* --- Grundlegende Blöcke ------------------------------------------- */
    { id:'text',    name:'Text',              icon:'¶',  gruppe:'Grundlegend', cmd:['text','absatz','p'],            kurz:'Ctrl+Alt+0', ph:'Tippe etwas, oder drücke / für Befehle' },
    { id:'h1',      name:'Überschrift 1',     icon:'H₁', gruppe:'Grundlegend', cmd:['h1','ueberschrift1','titel'],   kurz:'Ctrl+Alt+1', md:'#',    ph:'Überschrift 1' },
    { id:'h2',      name:'Überschrift 2',     icon:'H₂', gruppe:'Grundlegend', cmd:['h2','ueberschrift2'],           kurz:'Ctrl+Alt+2', md:'##',   ph:'Überschrift 2' },
    { id:'h3',      name:'Überschrift 3',     icon:'H₃', gruppe:'Grundlegend', cmd:['h3','ueberschrift3'],           kurz:'Ctrl+Alt+3', md:'###',  ph:'Überschrift 3' },
    { id:'todo',    name:'Aufgabenliste',     icon:'☑',  gruppe:'Grundlegend', cmd:['todo','aufgabe','checkbox'],    kurz:'Ctrl+Alt+4', md:['[]','[ ]'], ph:'Aufgabe' },
    { id:'bullet',  name:'Aufzählungsliste',  icon:'•',  gruppe:'Grundlegend', cmd:['bullet','liste','aufzaehlung'], kurz:'Ctrl+Alt+5', md:['-','*','+'], ph:'Listenpunkt' },
    { id:'number',  name:'Nummerierte Liste', icon:'1.', gruppe:'Grundlegend', cmd:['number','nummeriert'],          kurz:'Ctrl+Alt+6', md:'1.',   ph:'Listenpunkt' },
    { id:'toggle',  name:'Toggle-Liste',      icon:'▸',  gruppe:'Grundlegend', cmd:['toggle','einklappbar'],         kurz:'Ctrl+Alt+7', md:'>',    ph:'Toggle' },
    { id:'toggle-h1', name:'Toggle-Überschrift 1', icon:'▸H₁', gruppe:'Grundlegend', cmd:['toggle h1','einklappbare ueberschrift 1'] },
    { id:'toggle-h2', name:'Toggle-Überschrift 2', icon:'▸H₂', gruppe:'Grundlegend', cmd:['toggle h2','einklappbare ueberschrift 2'] },
    { id:'toggle-h3', name:'Toggle-Überschrift 3', icon:'▸H₃', gruppe:'Grundlegend', cmd:['toggle h3','einklappbare ueberschrift 3'] },
    { id:'quote',   name:'Zitat',             icon:'❝',  gruppe:'Grundlegend', cmd:['quote','zitat'],                md:'"',    ph:'Zitat' },
    { id:'callout', name:'Callout',           icon:'💡', gruppe:'Grundlegend', cmd:['callout','hinweis'],            ph:'Hinweis' },
    { id:'divider', name:'Trennlinie',        icon:'—',  gruppe:'Grundlegend', cmd:['divider','trennlinie','hr'],    md:['---','***','___'] },

    /* --- Datenbanken ---------------------------------------------------- */
    { id:'db-table',    name:'Tabelle',    icon:'▦', gruppe:'Datenbank', cmd:['tabelle','table','datenbank'] },
    { id:'db-board',    name:'Board',      icon:'▤', gruppe:'Datenbank', cmd:['board','kanban'] },
    { id:'db-list',     name:'Liste',      icon:'☰', gruppe:'Datenbank', cmd:['listenansicht','list'] },
    { id:'db-gallery',  name:'Galerie',    icon:'▩', gruppe:'Datenbank', cmd:['galerie','gallery'] },
    { id:'db-calendar', name:'Kalender',   icon:'📅', gruppe:'Datenbank', cmd:['kalender','calendar'] },

    /* --- Medien ---------------------------------------------------------- */
    { id:'image',    name:'Bild',       icon:'🖼', gruppe:'Medien', cmd:['bild','image','foto'] },
    { id:'video',    name:'Video',      icon:'🎬', gruppe:'Medien', cmd:['video'] },
    { id:'audio',    name:'Audio',      icon:'🔊', gruppe:'Medien', cmd:['audio','ton'] },
    { id:'file',     name:'Datei',      icon:'📎', gruppe:'Medien', cmd:['datei','file','anhang'] },
    { id:'bookmark', name:'Lesezeichen',icon:'🔖', gruppe:'Medien', cmd:['bookmark','lesezeichen','link'] },
    { id:'embed',    name:'Einbetten',  icon:'⧉',  gruppe:'Medien', cmd:['embed','einbetten','iframe'] },

    /* --- Erweitert -------------------------------------------------------- */
    { id:'code',       name:'Code',              icon:'⌨',  gruppe:'Erweitert', cmd:['code'], kurz:'Ctrl+Alt+8', md:'```', ph:'Code' },
    { id:'equation',   name:'Formel',            icon:'∑',  gruppe:'Erweitert', cmd:['formel','equation','math','latex'], md:'$$', ph:'E = mc^2' },
    { id:'table',      name:'Einfache Tabelle',  icon:'⊞',  gruppe:'Erweitert', cmd:['tabelle einfach','simple table','raster'] },
    { id:'toc',        name:'Inhaltsverzeichnis',icon:'≡',  gruppe:'Erweitert', cmd:['inhaltsverzeichnis','toc'] },
    { id:'breadcrumb', name:'Pfad',              icon:'⌂',  gruppe:'Erweitert', cmd:['pfad','breadcrumb'] },
    { id:'columns',    name:'Zwei Spalten',      icon:'⫿',  gruppe:'Erweitert', cmd:['spalten','columns'] },
    { id:'columns3',   name:'Drei Spalten',      icon:'⫼',  gruppe:'Erweitert', cmd:['dreispalten','columns3'] },
    { id:'page',       name:'Unterseite',        icon:'📄', gruppe:'Erweitert', cmd:['seite','page','unterseite'], kurz:'Ctrl+Alt+9' },
    { id:'pageref',    name:'Link zu Seite',     icon:'↗',  gruppe:'Erweitert', cmd:['link zu seite','verweis','klon','pageref'] },
    { id:'synced',     name:'Synchronisierter Block', icon:'⇄', gruppe:'Erweitert', cmd:['synced','synchron','spiegel'] },
    { id:'button',     name:'Knopf',             icon:'🔘', gruppe:'Erweitert', cmd:['button','knopf','vorlagenknopf'] },
    { id:'html',       name:'HTML',              icon:'</>',gruppe:'Erweitert', cmd:['html'] },

    /* --- Wissen ------------------------------------------------------------ */
    { id:'flashcard',  name:'Karteikarte',       icon:'🎴', gruppe:'Wissen', cmd:['karteikarte','flashcard','lernen'], ph:'Frage :: Antwort' },
    { id:'whiteboard', name:'Whiteboard',        icon:'🖍', gruppe:'Wissen', cmd:['whiteboard','zeichnen','canvas','skizze'] },
    { id:'chart',      name:'Diagramm',          icon:'📊', gruppe:'Wissen', cmd:['diagramm','chart','balken','torte'] },
    { id:'backlinks',  name:'Rückverweise',      icon:'🔙', gruppe:'Wissen', cmd:['rueckverweise','backlinks'] },

    /* --- KI --------------------------------------------------------------- */
    { id:'ai-write',   name:'KI: Text schreiben',    icon:'✨', gruppe:'KI', cmd:['ki','ai','schreiben'] },
    { id:'ai-summary', name:'KI: Zusammenfassen',    icon:'✨', gruppe:'KI', cmd:['zusammenfassen','summary'] },
    { id:'ai-todo',    name:'KI: Aufgaben ableiten', icon:'✨', gruppe:'KI', cmd:['aufgaben','actionitems'] },
    { id:'ai-translate',name:'KI: Übersetzen',       icon:'✨', gruppe:'KI', cmd:['uebersetzen','translate'] },
    { id:'ai-improve', name:'KI: Text verbessern',   icon:'✨', gruppe:'KI', cmd:['verbessern','umschreiben','improve'] }
  ];

  const typ = (id) => TYPEN.find(t => t.id === id) || TYPEN[0];

  /* Die Blocktypen, in die man einen bestehenden Block umwandeln kann. */
  const UMWANDELBAR = ['text','h1','h2','h3','todo','bullet','number','toggle','quote','callout',
                       'code','equation','flashcard','page'];

  /* ========================================================================
   * HILFEN
   * ======================================================================*/
  const esc = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /** Wandelt gespeicherten Text in Anzeige-HTML um (Fett, Kursiv, Code, Links). */
  const inline = (s) => {
    let h = esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/(^|\W)\*(.+?)\*(\W|$)/g, '$1<i>$2</i>$3')
      .replace(/__(.+?)__/g, '<u>$1</u>')
      .replace(/~~(.+?)~~/g, '<s>$1</s>')
      .replace(/`([^`]+?)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    /* Inline-Formel $a^2$ — der kleine Mathe-Satz aus canvas.js */
    if (window.Zusatz) h = h.replace(/\$([^$\n]{1,120})\$/g, (_, f) => Zusatz.mathe(f));

    /* Datumserwähnung @2026-08-02 */
    h = h.replace(/(^|[\s(])@(\d{4}-\d{2}-\d{2})/g, (_, vor, d) =>
      `${vor}<span class="datum" title="${d}">📅 ${new Date(d + 'T12:00:00').toLocaleDateString('de-DE')}</span>`);

    /* Seitenlinks [[…]], Schlagwörter #… und Blockverweise ((…)) */
    return window.Links ? Links.inline(h) : h;
  };

  /* Cursor ans Ende eines Elements setzen */
  const cursorAnsEnde = (el) => {
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
  };

  /* Steht der Cursor ganz am Anfang des Blocks? */
  const amAnfang = (el) => {
    const s = getSelection();
    if (!s.rangeCount) return false;
    const r = s.getRangeAt(0).cloneRange();
    r.selectNodeContents(el);
    r.setEnd(s.getRangeAt(0).startContainer, s.getRangeAt(0).startOffset);
    return r.toString().length === 0;
  };

  const amEnde = (el) => {
    const s = getSelection();
    if (!s.rangeCount) return false;
    const r = s.getRangeAt(0).cloneRange();
    r.selectNodeContents(el);
    r.setStart(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
    return r.toString().length === 0;
  };

  /* ========================================================================
   * RENDERN
   * ======================================================================*/

  /** Baut das DOM für einen Block samt Kindern. */
  const render = (block, tiefe = 0) => {
    const t = typ(block.type);
    const el = document.createElement('div');
    el.className = 'blk b-' + block.type;
    el.dataset.id = block.type;
    el.dataset.bid = block.id;

    /* Der Griff links: Plus und Sechs-Punkte */
    const griffe = document.createElement('div');
    griffe.className = 'handles';
    griffe.innerHTML =
      '<button data-act="add" title="Block darunter einfügen">+</button>' +
      '<button data-act="menu" title="Ziehen zum Verschieben, Klick für Optionen">⋮⋮</button>';
    el.appendChild(griffe);

    /* Der Inhalt — je nach Typ verschieden */
    const box = document.createElement('div');
    box.style.cssText = 'flex:1; min-width:0; display:flex; align-items:flex-start';
    el.appendChild(box);

    /* Ist die Seite gegen Bearbeiten gesperrt? Dann nur lesen. */
    const seite = App.aktuelleSeite ? Store.getBlock(App.aktuelleSeite()) : null;
    const nurLesen = !!(seite && seite.gesperrt);

    const machText = (ph) => {
      const ct = document.createElement('div');
      ct.className = 'ct';
      ct.contentEditable = nurLesen ? 'false' : 'true';
      ct.spellcheck = false;
      ct.dataset.ph = ph || t.ph || '';
      ct.innerHTML = inline(block.text || '');
      if (block.color) ct.classList.add(block.color.startsWith('bg-') ? block.color : 't-' + block.color);
      return ct;
    };

    switch (block.type) {

      case 'divider':
        box.innerHTML = '<hr style="width:100%">';
        break;

      case 'todo': {
        const mk = document.createElement('div');
        mk.className = 'mk';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!block.checked;
        cb.addEventListener('change', () => {
          Store.updateBlock(block.id, { checked: cb.checked });
          el.classList.toggle('done', cb.checked);
        });
        mk.appendChild(cb);
        box.appendChild(mk);
        box.appendChild(machText());
        if (block.checked) el.classList.add('done');
        break;
      }

      case 'bullet': {
        const mk = document.createElement('div');
        mk.className = 'mk';
        mk.textContent = tiefe % 3 === 0 ? '•' : tiefe % 3 === 1 ? '◦' : '▪';
        box.appendChild(mk);
        box.appendChild(machText());
        break;
      }

      case 'number': {
        const mk = document.createElement('div');
        mk.className = 'mk';
        mk.textContent = (block.nr || 1) + '.';
        box.appendChild(mk);
        box.appendChild(machText());
        break;
      }

      case 'toggle': {
        const mk = document.createElement('div');
        mk.className = 'mk';
        mk.textContent = '▸';
        mk.addEventListener('click', () => {
          const auf = !el.classList.contains('open');
          el.classList.toggle('open', auf);
          Store.updateBlock(block.id, { open: auf });
          const kids = el.nextElementSibling;
          if (kids && kids.classList.contains('toggle-kids')) kids.style.display = auf ? '' : 'none';
        });
        box.appendChild(mk);
        box.appendChild(machText());
        if (block.open) el.classList.add('open');
        break;
      }

      case 'callout': {
        const kasten = document.createElement('div');
        kasten.className = 'box';
        if (block.color) kasten.classList.add('bg-' + block.color.replace('bg-',''));
        const emo = document.createElement('div');
        emo.className = 'emo';
        emo.textContent = block.icon || '💡';
        emo.title = 'Klicken für ein anderes Symbol';
        emo.addEventListener('click', () => {
          UI.emojiWaehlen(emo, (e) => { emo.textContent = e; Store.updateBlock(block.id, { icon: e }); });
        });
        kasten.appendChild(emo);
        kasten.appendChild(machText('Hinweis schreiben …'));
        box.appendChild(kasten);
        break;
      }

      case 'code': {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'width:100%; position:relative';
        const sprache = document.createElement('select');
        sprache.style.cssText =
          'position:absolute; top:8px; right:10px; background:var(--bg-input); ' +
          'border:1px solid var(--line); border-radius:4px; font-size:11.5px; ' +
          'padding:2px 4px; color:var(--text-dim); outline:none; z-index:2';
        ['Plain Text','JavaScript','TypeScript','Python','HTML','CSS','JSON','SQL','Bash','Java','C++','C#','Go','Rust','PHP','Ruby','Swift','Kotlin','YAML','Markdown']
          .forEach(s => {
            const o = document.createElement('option');
            o.textContent = s;
            if ((block.lang || 'Plain Text') === s) o.selected = true;
            sprache.appendChild(o);
          });
        sprache.addEventListener('change', () => Store.updateBlock(block.id, { lang: sprache.value }));
        const ct = machText('Code …');
        ct.textContent = block.text || '';   /* im Codeblock kein Inline-HTML */
        wrap.appendChild(sprache);
        wrap.appendChild(ct);
        box.appendChild(wrap);
        break;
      }

      case 'equation':
        /* Zeigt die gesetzte Formel; ein Klick öffnet die Quelle. */
        box.appendChild(Zusatz.formelBlock(block));
        break;

      case 'image': case 'video': case 'audio': case 'file': case 'bookmark': case 'embed':
        box.appendChild(medienBlock(block));
        break;

      case 'toc':
        box.appendChild(inhaltsverzeichnis(block));
        break;

      case 'breadcrumb': {
        const d = document.createElement('div');
        d.className = 'ct';
        d.style.color = 'var(--text-dim)';
        d.style.fontSize = '14px';
        d.textContent = Store.pathOf(App.aktuelleSeite()).map(p => p.text || 'Ohne Titel').join(' / ');
        box.appendChild(d);
        break;
      }

      case 'page': {
        const a = document.createElement('div');
        a.className = 'ct';
        a.style.cssText = 'padding:4px 2px; cursor:pointer; font-weight:500; ' +
                          'display:flex; align-items:center; gap:8px';
        a.innerHTML = `<span style="font-size:18px">${block.icon || '📄'}</span>` +
                      `<span style="border-bottom:1px solid var(--line)">${esc(block.text || 'Ohne Titel')}</span>`;
        a.addEventListener('click', () => App.oeffne(block.id));
        box.appendChild(a);
        break;
      }

      case 'database':
        box.appendChild(Datenbank.render(block));
        break;

      case 'columns': case 'columns3': {
        const w = document.createElement('div');
        const n = block.type === 'columns3' ? 3 : (block.spalten || 2);
        w.style.cssText = `display:grid; grid-template-columns:repeat(${n},1fr); gap:24px; width:100%`;
        Store.childrenOf(block.id).forEach(k => w.appendChild(render(k, tiefe)));
        box.appendChild(w);
        break;
      }

      /* --- Verweis auf eine andere Seite (Notion „Link to page", Trilium-Klon) */
      case 'pageref': {
        const ziel = block.ziel ? Store.getBlock(block.ziel) : null;
        const a = document.createElement('div');
        a.className = 'ct pageref';
        if (ziel) {
          a.innerHTML = `<span style="font-size:17px">${ziel.icon || '📄'}</span>` +
                        `<span class="pr-t">${esc(ziel.text || 'Ohne Titel')}</span>` +
                        `<span class="pr-i" title="Verweis — die Seite liegt woanders">↗</span>`;
          a.addEventListener('click', () => App.oeffne(ziel.id));
        } else {
          a.innerHTML = '<span class="pr-i">↗</span><span style="color:var(--text-faint)">Seite auswählen …</span>';
          a.addEventListener('click', () => seiteWaehlen(block));
        }
        box.appendChild(a);
        break;
      }

      /* --- Synchronisierter Block: zeigt den Inhalt einer anderen Stelle --- */
      case 'synced': {
        const quelle = block.quelle ? Store.getBlock(block.quelle) : null;
        const w = document.createElement('div');
        w.className = 'synced';
        if (!quelle) {
          w.innerHTML = '<div class="sy-kopf">⇄ Synchronisierter Block</div>';
          const b = document.createElement('button');
          b.className = 'sy-waehl';
          b.textContent = 'Quelle wählen …';
          b.addEventListener('click', () => quelleWaehlen(block));
          w.appendChild(b);
        } else {
          w.innerHTML = `<div class="sy-kopf">⇄ synchron mit „${esc(quelle.text || 'Seite')}"</div>`;
          Store.childrenOf(quelle.id).forEach(k => w.appendChild(render(k, tiefe + 1)));
        }
        box.appendChild(w);
        break;
      }

      /* --- Knopf: legt Blöcke oder Datenbankzeilen an (Notions Button) ----- */
      case 'button': {
        const w = document.createElement('div');
        w.className = 'knopf-blk';
        const b = document.createElement('button');
        b.className = 'knopf';
        b.textContent = block.text || 'Neuer Knopf';
        b.addEventListener('click', () => knopfAusfuehren(block));
        const s = document.createElement('button');
        s.className = 'knopf-set';
        s.textContent = '⚙';
        s.title = 'Was soll der Knopf tun?';
        s.addEventListener('click', () => knopfEinstellen(block));
        w.append(b, s);
        box.appendChild(w);
        break;
      }

      case 'html': {
        const w = document.createElement('div');
        w.style.width = '100%';
        const ct = machText('<b>HTML</b> hier einfügen');
        ct.textContent = block.text || '';
        ct.style.cssText = 'font:13px var(--mono); background:var(--bg-card); padding:10px 12px; border-radius:6px';
        const vorschau = document.createElement('div');
        vorschau.className = 'html-vorschau';
        vorschau.innerHTML = block.text || '';
        w.append(ct, vorschau);
        box.appendChild(w);
        break;
      }

      case 'table':
        box.appendChild(Zusatz.tabelle(block));
        break;

      case 'whiteboard':
        box.appendChild(Zusatz.whiteboard(block));
        break;

      case 'chart':
        box.appendChild(Zusatz.diagramm(block));
        break;

      case 'flashcard': {
        const w = document.createElement('div');
        w.className = 'fkarte';
        const [vorn, hinten] = Werkzeuge.teileKarte(block);
        const faellig = !block.sr || !block.sr.faellig || new Date(block.sr.faellig) <= new Date();
        w.innerHTML = `<div class="fk-kopf">🎴 Karteikarte` +
          `<span class="fk-status">${faellig ? 'fällig' : 'nächste Wiederholung ' +
            new Date(block.sr.faellig).toLocaleDateString('de-DE')}</span></div>`;
        const ct = machText('Frage :: Antwort');
        w.appendChild(ct);
        const vor = document.createElement('div');
        vor.className = 'fk-vor';
        vor.innerHTML = `<b>${inline(vorn)}</b><span>${inline(hinten)}</span>`;
        w.appendChild(vor);
        box.appendChild(w);
        break;
      }

      case 'backlinks': {
        const d = document.createElement('div');
        d.style.width = '100%';
        const seite2 = Store.getBlock(App.aktuelleSeite());
        if (seite2) Links.fusszeile(seite2, d);
        if (!d.children.length) {
          d.innerHTML = '<div style="color:var(--text-faint); font-size:14px">' +
                        'Noch zeigt keine Seite hierher. Schreibe auf einer anderen Seite ' +
                        '<code>[[' + esc(seite2 ? (seite2.text || 'Titel') : 'Titel') + ']]</code>.</div>';
        }
        box.appendChild(d);
        break;
      }

      case 'h1': case 'h2': case 'h3': {
        if (block.toggleKopf) {
          const mk = document.createElement('div');
          mk.className = 'mk kopf-mk';
          mk.textContent = '▸';
          mk.addEventListener('click', () => {
            Store.updateBlock(block.id, { open: !block.open });
            App.zeichneSeite();
          });
          box.appendChild(mk);
          if (block.open) el.classList.add('open');
        }
        box.appendChild(machText());
        break;
      }

      default:
        box.appendChild(machText());
    }

    /* Kommentarmarke */
    if ((block.kommentare || []).length) {
      const k = document.createElement('button');
      k.className = 'komm-marke';
      const offen = block.kommentare.filter(x => !x.erledigt).length;
      k.textContent = '💬' + (offen || '');
      k.title = block.kommentare.map(x => x.text).join('\n');
      k.addEventListener('click', () => Kommentare.panel(App.aktuelleSeite()));
      el.appendChild(k);
    }

    /* Kindblöcke einer Toggle-Überschrift */
    if (block.toggleKopf && ['h1','h2','h3'].includes(block.type)) {
      const kids = document.createElement('div');
      kids.className = 'toggle-kids';
      kids.style.marginLeft = '24px';
      if (!block.open) kids.style.display = 'none';
      Store.childrenOf(block.id).forEach(k => kids.appendChild(render(k, tiefe + 1)));
      const huelle = document.createElement('div');
      huelle.appendChild(el);
      huelle.appendChild(kids);
      return huelle;
    }

    /* Kindblöcke — bei Toggle in einen eigenen Container */
    if (['bullet','number','todo','quote','callout'].includes(block.type) && (block.content || []).length) {
      const kids = document.createElement('div');
      kids.style.marginLeft = '24px';
      Store.childrenOf(block.id).forEach(k => kids.appendChild(render(k, tiefe + 1)));
      const huelle = document.createElement('div');
      huelle.appendChild(el);
      huelle.appendChild(kids);
      return huelle;
    }

    if (block.type === 'toggle') {
      const kids = document.createElement('div');
      kids.className = 'toggle-kids';
      kids.style.marginLeft = '24px';
      if (!block.open) kids.style.display = 'none';
      Store.childrenOf(block.id).forEach(k => kids.appendChild(render(k, tiefe + 1)));
      const huelle = document.createElement('div');
      huelle.appendChild(el);
      huelle.appendChild(kids);
      return huelle;
    }

    return el;
  };

  /* --- Medienblöcke ------------------------------------------------------- */
  const medienBlock = (block) => {
    const w = document.createElement('div');
    w.style.width = '100%';

    if (!block.src) {
      /* Noch keine Quelle: Eingabefeld anzeigen */
      const feld = document.createElement('div');
      feld.style.cssText = 'display:flex; gap:8px; padding:12px 14px; background:var(--bg-card); ' +
                           'border-radius:6px; align-items:center';
