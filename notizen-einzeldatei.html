<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Notizen — lokale Notion-Alternative. Alle Daten im Browser, KI lokal und kostenlos.">
<meta name="color-scheme" content="dark light">
<title>Notizen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<style>
/* ============================================================================
 * app.css — Das Design-System
 * ----------------------------------------------------------------------------
 * Die zehn Notion-Farben, die Typografie und das Layout.
 * Alle Werte liegen als CSS-Variablen vor, damit Hell- und Dunkelmodus
 * denselben Code teilen.
 * ==========================================================================*/

/* --- Dunkelmodus (Standard) ---------------------------------------------- */
:root{
  --bg:            #191919;
  --bg-side:       #202020;
  --bg-card:       #252525;
  --bg-hover:      #2f2f2f;
  --bg-active:     #37352f26;
  --bg-input:      #2b2b2b;
  --line:          #373737;
  --line-soft:     #2a2a2a;
  --text:          #e9e9e7;
  --text-dim:      #9b9a97;
  --text-faint:    #6b6b6b;
  --accent:        #2eaadc;
  --shadow:        0 8px 28px rgba(0,0,0,.45);

  /* Die zehn Notion-Textfarben */
  --c-default: #e9e9e7;
  --c-gray:    #9b9a97;
  --c-brown:   #937264;
  --c-orange:  #ffa344;
  --c-yellow:  #ffdc49;
  --c-green:   #4dab9a;
  --c-blue:    #529cca;
  --c-purple:  #9a6dd7;
  --c-pink:    #e255a1;
  --c-red:     #ff7369;

  /* Die zehn Notion-Hintergrundfarben */
  --b-gray:    #454b4e;
  --b-brown:   #434040;
  --b-orange:  #594a3a;
  --b-yellow:  #59563b;
  --b-green:   #354c4b;
  --b-blue:    #364954;
  --b-purple:  #443f57;
  --b-pink:    #533b4c;
  --b-red:     #594141;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --serif: Lyon-Text, Georgia, ui-serif, serif;
}

/* --- Hellmodus ------------------------------------------------------------ */
html[data-theme="light"]{
  --bg:        #ffffff;
  --bg-side:   #fbfbfa;
  --bg-card:   #f7f7f5;
  --bg-hover:  #efefee;
  --bg-input:  #f1f1ef;
  --line:      #e9e9e7;
  --line-soft: #f1f1ef;
  --text:      #37352f;
  --text-dim:  #787774;
  --text-faint:#9b9a97;
  --shadow:    0 8px 28px rgba(15,15,15,.12);

  --c-default:#37352f; --c-gray:#787774; --c-brown:#9f6b53; --c-orange:#d9730d;
  --c-yellow:#cb912f;  --c-green:#448361; --c-blue:#337ea9;  --c-purple:#9065b0;
  --c-pink:#c14c8a;    --c-red:#d44c47;

  --b-gray:#f1f1ef; --b-brown:#f4eeee; --b-orange:#faebdd; --b-yellow:#fbf3db;
  --b-green:#edf3ec; --b-blue:#e7f3f8; --b-purple:#f6f3f9; --b-pink:#faf1f5;
  --b-red:#fdebec;
}

/* --- Farbklassen ---------------------------------------------------------- */
.t-default{color:var(--c-default)} .t-gray{color:var(--c-gray)}
.t-brown{color:var(--c-brown)}     .t-orange{color:var(--c-orange)}
.t-yellow{color:var(--c-yellow)}   .t-green{color:var(--c-green)}
.t-blue{color:var(--c-blue)}       .t-purple{color:var(--c-purple)}
.t-pink{color:var(--c-pink)}       .t-red{color:var(--c-red)}

/* Hintergrundfarben heissen bg-*, damit sie nicht mit den Blockklassen
   b-text, b-h1, b-callout … kollidieren. */
.bg-gray{background:var(--b-gray)}     .bg-brown{background:var(--b-brown)}
.bg-orange{background:var(--b-orange)} .bg-yellow{background:var(--b-yellow)}
.bg-green{background:var(--b-green)}   .bg-blue{background:var(--b-blue)}
.bg-purple{background:var(--b-purple)} .bg-pink{background:var(--b-pink)}
.bg-red{background:var(--b-red)}
[class*="bg-"]{border-radius:3px; padding:0 2px}

/* --- Grundlayout ---------------------------------------------------------- */
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 var(--font);
  display:flex; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
::selection{background:#2eaadc55}

/* Scrollbars dezent wie in Notion */
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px; border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}
::-webkit-scrollbar-track{background:transparent}

/* ==========================================================================
   SEITENLEISTE
   ========================================================================== */
#sidebar{
  width:260px; flex:0 0 260px; background:var(--bg-side);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  transition:margin-left .18s ease;
}
#sidebar.collapsed{margin-left:-260px}

.side-top{padding:10px 8px 4px; display:flex; align-items:center; gap:6px}
.ws-btn{
  flex:1; display:flex; align-items:center; gap:8px; padding:6px 8px;
  border-radius:6px; font-size:14px; font-weight:600; min-width:0;
}
.ws-btn:hover{background:var(--bg-hover)}
.ws-btn .ws-icon{
  width:22px; height:22px; border-radius:5px; background:var(--accent);
  color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; flex:0 0 22px;
}
.ws-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.icon-btn{
  width:28px; height:28px; border-radius:6px; display:grid; place-items:center;
  color:var(--text-dim); flex:0 0 28px;
}
.icon-btn:hover{background:var(--bg-hover); color:var(--text)}

.side-nav{padding:4px 8px 8px}
.side-item{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:5px 8px; border-radius:6px; font-size:14px; color:var(--text-dim);
  text-align:left;
}
.side-item:hover{background:var(--bg-hover); color:var(--text)}
.side-item.on{background:var(--bg-hover); color:var(--text)}
.side-item .k{margin-left:auto; font-size:11px; color:var(--text-faint); font-family:var(--mono)}

.side-section{
  display:flex; align-items:center; gap:4px;
  padding:14px 14px 4px; font-size:11.5px; font-weight:600;
  color:var(--text-faint); text-transform:none; letter-spacing:.3px;
}
.side-section button{margin-left:auto; opacity:0; color:var(--text-faint); padding:2px 5px; border-radius:4px}
.side-section:hover button{opacity:1}
.side-section button:hover{background:var(--bg-hover); color:var(--text)}

#tree{flex:1; overflow-y:auto; padding:0 8px 24px}

.row{
  display:flex; align-items:center; gap:2px; border-radius:6px;
  font-size:14px; color:var(--text-dim); cursor:pointer; user-select:none;
  padding-right:4px;
}
.row:hover{background:var(--bg-hover); color:var(--text)}
.row.on{background:var(--bg-hover); color:var(--text); font-weight:500}
.row .tw{
  width:18px; height:20px; display:grid; place-items:center; flex:0 0 18px;
  color:var(--text-faint); font-size:9px; border-radius:3px;
}
.row .tw:hover{background:var(--line)}
.row .ico{width:18px; text-align:center; flex:0 0 18px; font-size:14px}
.row .nm{flex:1; padding:5px 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .act{opacity:0; display:flex; gap:1px}
.row:hover .act{opacity:1}
.row .act button{width:20px; height:20px; border-radius:4px; color:var(--text-faint); display:grid; place-items:center; font-size:13px}
.row .act button:hover{background:var(--line); color:var(--text)}
.kids{margin-left:14px; border-left:1px solid var(--line-soft)}

/* ==========================================================================
   HAUPTBEREICH
   ========================================================================== */
#main{flex:1; display:flex; flex-direction:column; min-width:0}

#topbar{
  height:45px; flex:0 0 45px; display:flex; align-items:center; gap:4px;
  padding:0 12px; border-bottom:1px solid var(--line-soft);
}
.crumb{font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:4px; min-width:0}
.crumb a{color:inherit; text-decoration:none; padding:3px 6px; border-radius:4px; cursor:pointer;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crumb a:hover{background:var(--bg-hover); color:var(--text)}
.crumb .sep{color:var(--text-faint)}
.spacer{flex:1}

.top-btn{
  padding:5px 9px; border-radius:6px; font-size:13.5px; color:var(--text-dim);
  display:flex; align-items:center; gap:5px;
}
.top-btn:hover{background:var(--bg-hover); color:var(--text)}
.top-btn.on{color:var(--accent)}

#scroll{flex:1; overflow-y:auto}
#page{max-width:900px; margin:0 auto; padding:0 96px 40vh}
#page.wide{max-width:100%; padding:0 60px 40vh}

.cover{height:200px; margin:0 -96px 0; background-size:cover; background-position:center; position:relative}
#page.wide .cover{margin:0 -60px}

.pg-icon{font-size:70px; line-height:1; margin:34px 0 0; cursor:pointer; display:inline-block}
.pg-icon:hover{background:var(--bg-hover); border-radius:8px}

#title{
  font-size:40px; font-weight:700; letter-spacing:-.5px; line-height:1.2;
  margin:6px 0 10px; outline:none; caret-color:var(--text);
}
#title:empty::before{content:"Ohne Titel"; color:var(--text-faint)}

.pg-tools{display:flex; gap:8px; margin:0 0 14px; opacity:0; transition:opacity .15s}
#page:hover .pg-tools{opacity:1}
.pg-tools button{font-size:13px; color:var(--text-dim); padding:4px 8px; border-radius:5px}
.pg-tools button:hover{background:var(--bg-hover); color:var(--text)}

/* --- Blöcke --------------------------------------------------------------- */
.blk{position:relative; display:flex; align-items:flex-start}
.blk > .handles{
  position:absolute; left:-46px; top:2px; display:flex; gap:1px; opacity:0;
  transition:opacity .12s;
}
.blk:hover > .handles{opacity:1}
.handles button{
  width:20px; height:24px; display:grid; place-items:center; border-radius:4px;
  color:var(--text-faint); font-size:14px;
}
.handles button:hover{background:var(--bg-hover); color:var(--text-dim)}

.ct{flex:1; min-width:0; outline:none; caret-color:var(--text); word-break:break-word}
.ct:empty::before{content:attr(data-ph); color:var(--text-faint); pointer-events:none}

.b-text .ct{padding:3px 2px; font-size:16px; line-height:1.55}
.b-h1 .ct{padding:24px 2px 2px; font-size:30px; font-weight:700; letter-spacing:-.3px}
.b-h2 .ct{padding:19px 2px 1px; font-size:24px; font-weight:600; letter-spacing:-.2px}
.b-h3 .ct{padding:15px 2px 1px; font-size:20px; font-weight:600}
.b-quote{margin:6px 0}
.b-quote .ct{padding:3px 14px; border-left:3px solid var(--text); font-size:16px}
.b-code{margin:6px 0}
.b-code .ct{
  padding:16px 18px; background:var(--bg-card); border-radius:6px;
  font:13.5px/1.5 var(--mono); white-space:pre-wrap; tab-size:2;
}
.b-divider{padding:10px 0}
.b-divider hr{border:none; border-top:1px solid var(--line)}
.b-callout{margin:6px 0}
.b-callout .box{
  display:flex; gap:10px; padding:16px; border-radius:6px; background:var(--bg-card); width:100%;
}
.b-callout .emo{font-size:18px; line-height:1.4; cursor:pointer; flex:0 0 auto}

.b-bullet, .b-number, .b-todo, .b-toggle{display:flex; align-items:flex-start}
.b-bullet .mk, .b-number .mk{
  flex:0 0 24px; padding:3px 0; text-align:center; color:var(--text); user-select:none;
}
.b-todo .mk{flex:0 0 24px; padding:5px 0; display:flex; justify-content:center}
.b-todo input{
  width:16px; height:16px; accent-color:var(--accent); cursor:pointer; margin:0;
}
.b-todo.done .ct{color:var(--text-dim); text-decoration:line-through}
.b-toggle .mk{
  flex:0 0 24px; padding:3px 0; text-align:center; cursor:pointer;
  color:var(--text-dim); user-select:none; transition:transform .12s;
}
.b-toggle.open .mk{transform:rotate(90deg)}
.b-toggle .kids{margin-left:24px; border:none; padding-left:0}
.b-toggle:not(.open) + .toggle-kids{display:none}

.b-image img, .b-video video{max-width:100%; border-radius:4px; display:block}
.b-embed iframe{width:100%; height:420px; border:none; border-radius:4px; background:#000}

.b-toc .ct a{display:block; padding:3px 0; color:var(--text-dim); text-decoration:none; font-size:14px}
.b-toc .ct a:hover{color:var(--text); text-decoration:underline}
.b-toc .lvl2{padding-left:20px}
.b-toc .lvl3{padding-left:40px}

.blk.sel{background:#2eaadc22; border-radius:3px}

/* --- Menüs ---------------------------------------------------------------- */
.menu{
  position:fixed; z-index:600; background:var(--bg-side);
  border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  padding:6px; min-width:230px; max-height:60vh; overflow-y:auto;
}
.menu .grp{
  padding:8px 10px 4px; font-size:11px; font-weight:600; color:var(--text-faint);
}
.menu button{
  display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px;
  border-radius:6px; font-size:14px; text-align:left; color:var(--text);
}
.menu button:hover, .menu button.on{background:var(--bg-hover)}
.menu button .mi{width:22px; text-align:center; flex:0 0 22px; font-size:15px}
.menu button .ms{color:var(--text-faint); font-size:11.5px; margin-left:auto; font-family:var(--mono)}
.menu button .sub{font-size:12px; color:var(--text-faint); display:block}
.menu hr{border:none; border-top:1px solid var(--line); margin:5px 0}
.swatches{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:6px}
.swatches button{
  width:100%; aspect-ratio:1; border-radius:5px; border:1px solid var(--line);
  padding:0; display:block;
}

/* --- Suche (Quick Find) --------------------------------------------------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:700;
  display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;
}
.finder{
  width:min(640px,92vw); background:var(--bg-side); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); overflow:hidden;
}
.finder input{
  width:100%; padding:16px 18px; background:none; border:none; outline:none; font-size:16px;
}
.finder .res{max-height:52vh; overflow-y:auto; border-top:1px solid var(--line); padding:6px}
.finder .res button{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px;
  border-radius:6px; text-align:left; font-size:14px;
}
.finder .res button:hover, .finder .res button.on{background:var(--bg-hover)}
.finder .res .pth{margin-left:auto; font-size:11.5px; color:var(--text-faint)}
.finder .res .snip{display:block; font-size:12px; color:var(--text-dim); margin-top:2px}
.finder .hint{padding:8px 14px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--line)}

/* ==========================================================================
   DATENBANKEN
   ========================================================================== */
.db{margin:10px 0 20px; border-radius:4px; max-width:100%; min-width:0}
.db-head{display:flex; align-items:center; gap:2px; margin-bottom:6px; flex-wrap:wrap}
.db-tabs{display:flex; gap:2px; align-items:center}
.db-tab{
  padding:5px 9px; border-radius:5px; font-size:14px; color:var(--text-dim);
  display:flex; align-items:center; gap:5px;
}
.db-tab:hover{background:var(--bg-hover)}
.db-tab.on{color:var(--text); font-weight:500; background:var(--bg-hover)}
.db-tools{margin-left:auto; display:flex; gap:2px; align-items:center}
.db-tools button{
  padding:5px 8px; border-radius:5px; font-size:13px; color:var(--text-dim);
  display:flex; align-items:center; gap:4px;
}
.db-tools button:hover{background:var(--bg-hover); color:var(--text)}
.db-tools .new{
  background:var(--accent); color:#fff; font-weight:500; padding:5px 12px;
}
.db-tools .new:hover{filter:brightness(1.1); color:#fff}
.chip{
  font-size:12px; padding:3px 8px; border-radius:4px; background:var(--bg-card);
  color:var(--text-dim); display:inline-flex; align-items:center; gap:5px;
}
.chip b{color:var(--text); font-weight:500}
.chip .x{cursor:pointer; opacity:.6}
.chip .x:hover{opacity:1}

table.grid{width:100%; border-collapse:collapse; font-size:14px}
table.grid th{
  text-align:left; font-weight:400; color:var(--text-dim); font-size:13px;
  padding:7px 8px; border:1px solid var(--line); border-left:none; cursor:pointer;
  white-space:nowrap; position:relative;
}
table.grid th:first-child{border-left:1px solid var(--line)}
table.grid th:hover{background:var(--bg-hover)}
table.grid td{
  padding:6px 8px; border:1px solid var(--line); border-left:none; vertical-align:top;
  min-width:90px;
}
table.grid td:first-child{border-left:1px solid var(--line)}
table.grid tr:hover td{background:var(--bg-hover)}
table.grid td.tt{font-weight:500; cursor:pointer}
table.grid td.tt:hover{text-decoration:underline}
table.grid tfoot td{color:var(--text-faint); font-size:12.5px; border:none; padding-top:8px}
.cell{min-height:20px; outline:none; width:100%}
.tag{
  display:inline-block; padding:1px 7px; border-radius:3px; font-size:12.5px;
  margin:1px 3px 1px 0;
}
.tag:not([class*="bg-"]){background:var(--b-gray)}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--accent)}

/* Board */
.board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; max-width:100%}
.col{flex:0 0 260px; background:var(--bg-card); border-radius:8px; padding:8px}
.col h4{font-size:13px; font-weight:500; color:var(--text-dim); padding:4px 6px 8px; display:flex; gap:6px}
.col h4 em{font-style:normal; color:var(--text-faint)}
.card{
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:9px 11px; margin-bottom:7px; cursor:pointer; font-size:14px;
}
.card:hover{border-color:var(--text-faint)}
.card .meta{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.card .meta .mv{font-size:12.5px; color:var(--text-dim)}

/* Galerie */
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.gallery .card{margin:0}

/* Liste */
.list-row{
  display:flex; align-items:center; gap:10px; padding:8px 6px;
  border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:14.5px;
}
.list-row:hover{background:var(--bg-hover)}

/* Kalender */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line)}
.cal .dow{background:var(--bg); padding:6px; font-size:12px; color:var(--text-dim); text-align:center}
.cal .day{background:var(--bg); min-height:96px; padding:5px; font-size:12px}
.cal .day.out{opacity:.35}
.cal .day.today .n{background:var(--accent); color:#fff; border-radius:50%; width:20px; height:20px;
                   display:grid; place-items:center}
.cal .day .n{color:var(--text-dim); margin-bottom:4px}
.cal .ev{
  background:var(--bg-card); border-radius:4px; padding:2px 5px; margin-bottom:3px;
  cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal .ev:hover{background:var(--bg-hover)}

/* ==========================================================================
   KI-PANEL
   ========================================================================== */
#ai{
  width:380px; flex:0 0 380px; background:var(--bg-side);
  border-left:1px solid var(--line); display:none; flex-direction:column;
}
#ai.open{display:flex}
.ai-head{
  padding:10px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.ai-head b{font-size:14px; flex:1}
.model-btn{
  font-size:12px; color:var(--text-dim); padding:4px 8px; border-radius:5px;
  background:var(--bg-card); display:flex; align-items:center; gap:5px; max-width:190px;
}
.model-btn:hover{background:var(--bg-hover); color:var(--text)}
.model-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex:0 0 7px}
.dot.ok{background:#4dab9a} .dot.load{background:var(--c-orange)} .dot.err{background:var(--c-red)}

#chat{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px}
.msg{font-size:14px; line-height:1.6}
.msg.u{background:var(--bg-card); padding:10px 12px; border-radius:8px; align-self:flex-end; max-width:88%}
.msg.a{white-space:pre-wrap}
.msg.a code{background:var(--bg-card); padding:1px 5px; border-radius:3px; font-family:var(--mono); font-size:13px}
.msg.sys{font-size:12.5px; color:var(--text-faint); text-align:center}
.ai-foot{padding:10px 12px; border-top:1px solid var(--line)}
.ai-foot textarea{
  width:100%; background:var(--bg-input); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; resize:none; outline:none; font-size:14px; min-height:44px; max-height:160px;
}
.ai-foot textarea:focus{border-color:var(--accent)}
.ai-quick{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px}
.ai-quick button{
  font-size:12px; padding:4px 9px; border-radius:20px; border:1px solid var(--line);
  color:var(--text-dim);
}
.ai-quick button:hover{background:var(--bg-hover); color:var(--text)}
.prog{height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:8px}
.prog i{display:block; height:100%; background:var(--accent); transition:width .3s}

/* --- Toast ---------------------------------------------------------------- */
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--bg-side); border:1px solid var(--line); border-radius:8px;
  padding:10px 18px; font-size:14px; box-shadow:var(--shadow); z-index:900;
  transition:transform .22s ease; pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* --- Schriftvarianten ----------------------------------------------------- */
body[data-font="serif"] #page{font-family:var(--serif)}
body[data-font="mono"]  #page{font-family:var(--mono)}
body[data-small="1"] #page{font-size:14px}
body[data-small="1"] .b-text .ct{font-size:14px}

@media(max-width:820px){
  #sidebar{position:fixed; z-index:500; height:100%; box-shadow:var(--shadow)}
  #page{padding:0 22px 40vh}
  .cover{margin:0 -22px}
  #ai{position:fixed; right:0; top:0; height:100%; z-index:500}
  .blk > .handles{left:-40px}
}

/* ==========================================================================
   ERWEITERUNGEN — Werkzeuge, Verknüpfungen, Notion-Bedienelemente
   ========================================================================== */

/* --- Seitenleiste: Werkzeuge und Fuss -------------------------------------- */
.wz-block{padding:0 8px}
.wz-block .side-item{width:100%}
.side-fuss{border-top:1px solid var(--line); padding:6px 8px 10px}
.side-fuss .side-item{width:100%}
.side-item.neu{color:var(--accent)}
.side-hinweis{padding:8px 8px 2px; font-size:11.5px; color:var(--text-faint)}
.row.drop{box-shadow:inset 0 -2px 0 var(--accent)}

.top-btn.schmal{padding:5px 8px; min-width:30px; justify-content:center}
.top-btn.on{color:var(--c-yellow)}

/* --- Dialogköpfe und Knopfleisten ------------------------------------------ */
.finder .fh{
  padding:14px 18px; font-weight:600; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; font-size:14.5px;
}
.finder .fh em{font-style:normal; color:var(--text-faint); font-weight:400; font-size:13px}
.finder .fh .icon-btn{margin-left:auto}
.finder .grp{padding:9px 14px 3px; font-size:11px; font-weight:600; color:var(--text-faint)}
.fbtns{
  display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line);
  justify-content:flex-end; flex-wrap:wrap;
}
.fbtns button{padding:7px 14px; border:1px solid var(--line); border-radius:7px; font-size:14px}
.fbtns button:hover{background:var(--bg-hover)}
.fbtns .prim{background:var(--accent); color:#fff; border-color:transparent; font-weight:500}
.fbtns .prim:hover{filter:brightness(1.1)}
#mdq{
  width:100%; height:52vh; padding:16px 18px; background:var(--bg); border:none;
  border-bottom:1px solid var(--line); outline:none; resize:none;
  font:13.5px/1.65 var(--mono); color:var(--text);
}

/* --- Seitenlinks, Schlagwörter, Blockverweise ------------------------------ */
a.wl{
  color:var(--text); text-decoration:none; border-bottom:1px solid var(--text-faint);
  cursor:pointer; padding:0 1px;
}
a.wl:hover{background:var(--bg-hover)}
a.wl.neu{color:var(--text-dim); border-bottom-style:dashed}
a.wl.tot{color:var(--c-red); border:none}
a.tg{
  color:var(--accent); text-decoration:none; cursor:pointer; font-size:.94em;
  background:var(--bg-card); padding:1px 6px; border-radius:10px;
}
a.tg:hover{background:var(--bg-hover)}
a.bl{
  color:var(--text-dim); text-decoration:none; cursor:pointer;
  border-bottom:1px dotted var(--text-faint);
}
a.bl:hover{color:var(--text)}
.datum{
  background:var(--bg-card); border-radius:4px; padding:0 5px; font-size:.92em; color:var(--text-dim);
}
.blk.blitz{animation:blitz 1.4s ease}
@keyframes blitz{0%,100%{background:transparent}20%{background:#2eaadc35}}

/* --- Rückverweise unter der Seite ------------------------------------------ */
.backlinks{margin-top:52px; border-top:1px solid var(--line); padding-top:18px}
.bl-head{font-size:12px; font-weight:600; color:var(--text-faint); margin:14px 0 8px; letter-spacing:.2px}
.bl-head em{font-style:normal; background:var(--bg-card); padding:1px 6px; border-radius:9px; margin-left:4px}
.bl-item{
  padding:9px 12px; border-radius:7px; cursor:pointer; margin-bottom:5px; border:1px solid var(--line-soft);
}
.bl-item:hover{background:var(--bg-hover)}
.bl-t{font-size:14px; font-weight:500; margin-bottom:3px}
.bl-s{font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* --- Graph ------------------------------------------------------------------ */
.graph-overlay{align-items:center; padding-top:0}
.graph-box{
  width:min(1000px,94vw); height:min(720px,88vh); background:var(--bg-side);
  border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; overflow:hidden;
}
.graph-head{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.graph-head b{font-size:14.5px}
.graph-info{font-size:12.5px; color:var(--text-faint); flex:1}
.graph-box canvas{flex:1; cursor:grab; display:block}
.graph-box canvas:active{cursor:grabbing}
.graph-box .hint{padding:8px 14px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--line)}

/* --- Schlagwortregister ----------------------------------------------------- */
.tagwolke{display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px; border-bottom:1px solid var(--line)}
.tagpill{
  font-size:13px; padding:4px 11px; border-radius:14px; background:var(--bg-card);
  color:var(--text-dim); border:1px solid transparent;
}
.tagpill:hover{background:var(--bg-hover); color:var(--text)}
.tagpill.on{border-color:var(--accent); color:var(--text)}
.tagpill em{font-style:normal; color:var(--text-faint); font-size:11.5px; margin-left:3px}

/* --- Schnellnotizen --------------------------------------------------------- */
.memo-neu{padding:12px 16px; display:flex; gap:8px; align-items:flex-end; border-bottom:1px solid var(--line)}
.memo-neu textarea{
  flex:1; background:var(--bg-input); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px; outline:none; resize:vertical; font:14px/1.5 var(--font); color:var(--text);
}
.memo-neu textarea:focus{border-color:var(--accent)}
.memo-neu .prim{background:var(--accent); color:#fff; padding:9px 14px; border-radius:8px; font-weight:500}
.heatmap{
  display:grid; grid-template-rows:repeat(7,10px); grid-auto-flow:column; gap:3px;
  padding:12px 16px; border-bottom:1px solid var(--line); overflow-x:auto;
}
.heatmap i{width:10px; height:10px; border-radius:2px; background:var(--bg-card); display:block}
.heatmap .hm1{background:#2eaadc44}.heatmap .hm2{background:#2eaadc77}
.heatmap .hm3{background:#2eaadcbb}.heatmap .hm4{background:#2eaadc}
.memo{padding:11px 14px; border-bottom:1px solid var(--line-soft)}
.memo:hover{background:var(--bg-hover)}
.memo-kopf{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px; margin-bottom:4px}
.memo-kopf button{margin-left:auto; opacity:0; font-size:12px; padding:1px 5px; border-radius:4px}
.memo-kopf button + button{margin-left:0}
.memo:hover .memo-kopf button{opacity:.75}
.memo-kopf button:hover{opacity:1; background:var(--line)}
.memo-txt{font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word}

/* --- Karteikarten ----------------------------------------------------------- */
.karte{padding:34px 26px; text-align:center; min-height:190px}
.k-vorn{font-size:21px; line-height:1.5}
.karte hr{border:none; border-top:1px solid var(--line); margin:18px 0}
.k-hinten{font-size:16.5px; color:var(--text-dim); line-height:1.6}
.k-quelle{margin-top:18px; font-size:12px; color:var(--text-faint); cursor:pointer}
.k-quelle:hover{color:var(--accent)}
.lern-btns{justify-content:center}
.fkarte{width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:6px 0}
.fk-kopf{font-size:11.5px; color:var(--text-faint); display:flex; gap:8px; margin-bottom:5px}
.fk-status{margin-left:auto}
.fk-vor{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:14px}
.fk-vor b{display:block; margin-bottom:3px}
.fk-vor span{color:var(--text-dim)}

/* --- Sperre ------------------------------------------------------------------ */
.gesperrt{text-align:center; padding:12vh 0}
.gesperrt input{
  display:block; margin:0 auto 10px; padding:10px 14px; width:min(280px,80%);
  background:var(--bg-input); border:1px solid var(--line); border-radius:8px; outline:none;
  color:var(--text); text-align:center;
}
.gesperrt .prim{background:var(--accent); color:#fff; padding:9px 20px; border-radius:8px; font-weight:500}
.sperrhinweis{
  background:var(--b-yellow); border-radius:7px; padding:9px 14px; font-size:13.5px;
  margin:6px 0 12px; display:flex; align-items:center; gap:10px;
}
.sperrhinweis button{margin-left:auto; text-decoration:underline; font-size:13px}

/* --- Präsentation -------------------------------------------------------------- */
.praesi{
  position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex;
  flex-direction:column; align-items:center; justify-content:center; padding:6vh 8vw;
}
.praesi .folie{width:100%; max-width:1100px; font-size:22px; line-height:1.6}
.praesi h1{font-size:52px; margin-bottom:26px; letter-spacing:-1px}
.praesi h2{font-size:34px; margin:16px 0 10px}
.praesi h3{font-size:26px; margin:12px 0 6px}
.praesi li{margin:8px 0 8px 28px}
.praesi p{margin:10px 0}
.praesi pre{background:var(--bg-card); padding:16px; border-radius:8px; font-size:17px; overflow-x:auto}
.praesi blockquote{border-left:4px solid var(--accent); padding-left:18px; color:var(--text-dim)}
.praesi .cal{background:var(--bg-card); border-radius:8px; padding:18px}
.praesi img{max-width:100%; max-height:52vh; border-radius:8px}
.praesi-leiste{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; align-items:center; background:var(--bg-side);
  border:1px solid var(--line); border-radius:22px; padding:6px 14px; font-size:13px;
}
.praesi-leiste button{padding:4px 10px; border-radius:14px; color:var(--text-dim)}
.praesi-leiste button:hover{background:var(--bg-hover); color:var(--text)}

/* --- Statistik ------------------------------------------------------------------ */
.stat-gitter{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line)}
.stat-k{background:var(--bg-side); padding:18px 14px; text-align:center}
.stat-k b{display:block; font-size:24px; font-weight:600}
.stat-k span{font-size:12px; color:var(--text-faint)}
.stat-woerter{padding:12px 16px; display:flex; flex-wrap:wrap; gap:6px}

/* --- Tastenkürzel ---------------------------------------------------------------- */
.kuerzel{padding:8px 16px 16px; max-height:66vh; overflow-y:auto;
         display:grid; grid-template-columns:1fr 1fr; gap:0 26px}
.kz{display:flex; align-items:center; gap:10px; padding:3px 0; font-size:13.5px}
.kz code{
  font-family:var(--mono); font-size:11.5px; background:var(--bg-card); padding:2px 7px;
  border-radius:4px; min-width:96px; text-align:center; color:var(--text-dim);
}
.kz span{color:var(--text-dim)}

/* --- Startseite und Posteingang ---------------------------------------------------- */
.home{padding:44px 0 20vh}
.home h1{font-size:32px; margin-bottom:22px; letter-spacing:-.5px}
.home h2{font-size:14px; color:var(--text-faint); margin:26px 0 8px; font-weight:600}
.home-karten{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px}
.hk{
  text-align:left; padding:14px 16px; border:1px solid var(--line); border-radius:9px;
  display:flex; flex-direction:column; gap:4px;
}
.hk:hover{background:var(--bg-hover); border-color:var(--text-faint)}
.hk b{font-size:14.5px}
.hk span{font-size:12.5px; color:var(--text-dim)}
.home-liste button{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px;
  border-radius:7px; text-align:left; font-size:14px;
}
.home-liste button:hover{background:var(--bg-hover)}
.home-liste .pth{margin-left:auto; font-size:11.5px; color:var(--text-faint)}
.home-liste .snip{display:block; font-size:12px; color:var(--text-dim)}
.home-liste .leer{padding:8px 10px; font-size:13.5px; color:var(--text-faint)}
.home-zahlen{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px}
.hz{border:1px solid var(--line); border-radius:9px; padding:14px; text-align:center}
.hz b{display:block; font-size:22px}
.hz span{font-size:12px; color:var(--text-faint)}

/* --- Schwebende Auswahlleiste -------------------------------------------------------- */
.auswahlleiste{
  position:fixed; z-index:800; background:var(--bg-side); border:1px solid var(--line);
  border-radius:8px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:1px; padding:4px; font-size:14px;
}
.auswahlleiste button{padding:5px 8px; border-radius:5px; color:var(--text-dim); min-width:28px}
.auswahlleiste button:hover{background:var(--bg-hover); color:var(--text)}
.auswahlleiste .ki{color:var(--accent); font-weight:500}
.auswahlleiste .tr{width:1px; height:18px; background:var(--line); margin:0 3px}

/* --- Kommentare ------------------------------------------------------------------------ */
.komm{padding:12px 16px; border-bottom:1px solid var(--line-soft)}
.komm.fertig{opacity:.55}
.komm-zitat{font-size:12.5px; color:var(--text-faint); border-left:2px solid var(--line); padding-left:8px; margin-bottom:5px}
.komm-txt{font-size:14px; line-height:1.55}
.komm-fuss{font-size:11.5px; color:var(--text-faint); margin-top:6px; display:flex; gap:10px; align-items:center}
.komm-fuss button{font-size:11.5px; color:var(--accent); padding:1px 4px; border-radius:4px}
.komm-fuss button:first-of-type{margin-left:auto}
.komm-marke{
  position:absolute; right:-30px; top:2px; font-size:11.5px; opacity:.75;
  background:var(--bg-card); border-radius:10px; padding:1px 6px;
}
.komm-marke:hover{opacity:1; background:var(--bg-hover)}

/* --- Emoji-Auswahl ----------------------------------------------------------------------- */
.swatches.emojis{grid-template-columns:repeat(9,1fr); max-height:230px; overflow-y:auto}
.swatches.emojis button{
  aspect-ratio:1; border:none; font-size:19px; background:none; display:grid; place-items:center;
}
.swatches.emojis button:hover{background:var(--bg-hover)}
.emoji-suche{
  width:calc(100% - 12px); margin:6px; padding:7px 10px; background:var(--bg-input);
  border:1px solid var(--line); border-radius:6px; outline:none; color:var(--text); font-size:13.5px;
}

/* --- Whiteboard ---------------------------------------------------------------------------- */
.wb{width:100%; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:8px 0}
.wb-tools{
  display:flex; align-items:center; gap:2px; padding:6px 8px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); background:var(--bg-card);
}
.wb-tools button{
  width:28px; height:26px; border-radius:5px; font-size:14px; color:var(--text-dim);
  display:grid; place-items:center;
}
.wb-tools button:hover{background:var(--bg-hover); color:var(--text)}
.wb-tools button.on{background:var(--accent); color:#fff}
.wb-tools .wb-farbe{width:17px; height:17px; border-radius:50%; border:2px solid transparent}
.wb-tools .wb-farbe.on{border-color:var(--text)}
.wb-sep{width:1px; height:18px; background:var(--line); margin:0 5px}
.wb-flaeche{display:block; width:100%; touch-action:none; color:var(--text-faint); cursor:crosshair}
.wb-griff{height:9px; cursor:ns-resize; background:var(--bg-card); border-top:1px solid var(--line)}
.wb-griff:hover{background:var(--bg-hover)}

/* --- Diagramm ------------------------------------------------------------------------------- */
.chart{width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0}
.chart-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.chart-titel{
  flex:1; min-width:120px; background:none; border:none; outline:none; font-size:15px;
  font-weight:500; color:var(--text);
}
.chart-typen{display:flex; gap:2px}
.chart-typen button{font-size:12px; padding:3px 9px; border-radius:12px; color:var(--text-dim)}
.chart-typen button:hover{background:var(--bg-hover)}
.chart-typen button.on{background:var(--accent); color:#fff}
.chart-daten{font-size:12.5px; color:var(--text-dim); padding:3px 8px; border-radius:5px}
.chart-daten:hover{background:var(--bg-hover); color:var(--text)}
.chart-svg{width:100%; height:auto; color:var(--text)}
.chart-legende{display:flex; flex-wrap:wrap; gap:12px; font-size:12.5px; color:var(--text-dim); margin-top:6px}
.chart-legende i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px}
.chart-legende b{color:var(--text); font-weight:500}
.chart-leer{padding:26px 10px; text-align:center; color:var(--text-faint); font-size:14px}

/* --- Einfache Tabelle -------------------------------------------------------------------------- */
.stab-wrap{width:100%; overflow-x:auto; margin:8px 0}
table.stab{border-collapse:collapse; font-size:14px; min-width:min(100%,420px)}
table.stab td, table.stab th{
  border:1px solid var(--line); padding:7px 10px; min-width:110px; outline:none; vertical-align:top;
}
table.stab th{background:var(--bg-card); font-weight:600; text-align:left}
table.stab.kopfspalte td:first-child{background:var(--bg-card); font-weight:500}
table.stab td:focus, table.stab th:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.stab-tools{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; opacity:0; transition:opacity .15s}
.stab-wrap:hover .stab-tools{opacity:1}
.stab-tools button{font-size:12px; padding:3px 9px; border-radius:5px; color:var(--text-dim); border:1px solid var(--line)}
.stab-tools button:hover{background:var(--bg-hover); color:var(--text)}
.stab-tools button.on{border-color:var(--accent); color:var(--text)}

/* --- Formeln --------------------------------------------------------------------------------- */
.eq{width:100%; margin:6px 0}
.eq-out{
  padding:14px; background:var(--bg-card); border-radius:6px; text-align:center;
  cursor:text; font-size:18px; min-height:48px;
}
.eq-out:hover{background:var(--bg-hover)}
.eq-src{
  width:100%; background:var(--bg-input); border:1px solid var(--accent); border-radius:6px;
  padding:10px 12px; outline:none; font:13.5px var(--mono); color:var(--text); resize:vertical;
}
.mathe{font-family:"Cambria Math", Georgia, serif; font-size:1.05em}
.mfrac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 3px}
.mfrac .mz{border-bottom:1px solid currentColor; padding:0 5px}
.mfrac .mn{padding:0 5px}
.munter{border-top:1px solid currentColor; padding:0 3px}
.mtext{font-family:var(--font); font-size:.92em}
.mop{font-style:italic; margin:0 1px}

/* --- Verweis, Sync, Knopf, HTML ------------------------------------------------------------------ */
.pageref{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer;
}
.pageref:hover{background:var(--bg-hover)}
.pageref .pr-t{border-bottom:1px solid var(--line); font-weight:500}
.pageref .pr-i{color:var(--text-faint); font-size:12px}
.synced{width:100%; border-left:3px solid var(--c-purple); padding:4px 0 4px 12px; margin:6px 0}
.sy-kopf{font-size:11.5px; color:var(--c-purple); margin-bottom:4px}
.sy-waehl{font-size:13px; color:var(--accent); padding:4px 8px; border-radius:5px}
.knopf-blk{display:flex; align-items:center; gap:6px; margin:6px 0}
.knopf{
  background:var(--bg-card); border:1px solid var(--line); border-radius:7px;
  padding:7px 15px; font-size:14px; font-weight:500;
}
.knopf:hover{background:var(--bg-hover); border-color:var(--text-faint)}
.knopf-set{opacity:0; color:var(--text-faint); padding:4px 6px; border-radius:5px}
.knopf-blk:hover .knopf-set{opacity:1}
.html-vorschau{margin-top:8px; padding:10px 12px; border:1px dashed var(--line); border-radius:6px}

/* --- Einstellungen ------------------------------------------------------------------------------- */
.einst{padding:16px 18px; display:flex; flex-direction:column; gap:18px; max-height:64vh; overflow-y:auto}
.eb b{font-size:14px}

<!-- Reihenfolge zählt: store und formula zuerst, app zuletzt.
     Bewusst ohne type="module", damit die Seite auch per Doppelklick
     direkt von der Festplatte läuft. -->
<script>
/* ===== js/store.js ===== */
/* ============================================================================
 * store.js — Die lokale Datenbank
 * ----------------------------------------------------------------------------
 * Alles liegt in IndexedDB im Browser. Kein Server, kein Konto, keine Cloud.
 * Wer die Seite offline öffnet, hat alle Daten.
 *
 * DATENMODELL
 * Bewusst nach Notions Vorbild aufgebaut — vier Speicher, mehr braucht es nicht:
 *
 *   blocks       jeder Inhalt: Absätze, Überschriften, Seiten, Datenbankzeilen
 *   collections  das Schema einer Datenbank (welche Spalten gibt es)
 *   views        eine Ansicht: Layout, Filter, Sortierung, sichtbare Spalten
 *   meta         Einstellungen, zuletzt geöffnete Seite, Theme
 *   versions     ältere Fassungen einer Seite (Versionsverlauf)
 *
 * Eine Seite ist ein Block vom Typ 'page'.
 * Eine Datenbank ist ein Block vom Typ 'database' + eine collection + n views.
 * Eine Datenbankzeile ist wieder ein Block vom Typ 'page' — nur mit
 * parentTable 'collection' statt 'block'. Genau wie bei Notion.
 * ==========================================================================*/

const Store = (() => {

  const NAME = 'notizen';
  const VERSION = 2;
  let db = null;

  /* Alle Änderungen laufen durch save(), das merkt sich Beobachter. */
  const listeners = new Set();
  const notify = (was) => listeners.forEach(fn => fn(was));

  /* --- Öffnen ------------------------------------------------------------ */
  const open = () => new Promise((ok, fail) => {
    const req = indexedDB.open(NAME, VERSION);

    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('blocks')) {
        const s = d.createObjectStore('blocks', { keyPath: 'id' });
        s.createIndex('parent', 'parentId');
        s.createIndex('type', 'type');
      }
      if (!d.objectStoreNames.contains('collections')) d.createObjectStore('collections', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('views'))       d.createObjectStore('views',       { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta'))        d.createObjectStore('meta',        { keyPath: 'k' });
      /* Version 2: der Versionsverlauf. Liegt bewusst nicht im Cache —
         alte Fassungen holt sich der Verlauf erst, wenn er geöffnet wird. */
      if (!d.objectStoreNames.contains('versions')) {
        const v = d.createObjectStore('versions', { keyPath: 'id' });
        v.createIndex('page', 'pageId');
      }
    };

    req.onsuccess = () => { db = req.result; ok(db); };
    req.onerror   = () => fail(req.error);
  });

  /* --- Kleine Helfer ----------------------------------------------------- */
  const tx = (stores, mode) => db.transaction(stores, mode);

  const put = (store, val) => new Promise((ok, fail) => {
    const r = tx([store], 'readwrite').objectStore(store).put(val);
    r.onsuccess = () => ok(val);
    r.onerror   = () => fail(r.error);
  });

  const get = (store, key) => new Promise((ok, fail) => {
    const r = tx([store], 'readonly').objectStore(store).get(key);
    r.onsuccess = () => ok(r.result || null);
    r.onerror   = () => fail(r.error);
  });

  const all = (store) => new Promise((ok, fail) => {
    const r = tx([store], 'readonly').objectStore(store).getAll();
    r.onsuccess = () => ok(r.result || []);
    r.onerror   = () => fail(r.error);
  });

  const del = (store, key) => new Promise((ok, fail) => {
    const r = tx([store], 'readwrite').objectStore(store).delete(key);
    r.onsuccess = () => ok();
    r.onerror   = () => fail(r.error);
  });

  /* --------------------------------------------------------------------------
   * DER CACHE
   * --------------------------------------------------------------------------
   * IndexedDB ist asynchron, das Rendern soll aber sofort passieren. Deshalb
   * liegt alles zusätzlich im Speicher und wird im Hintergrund geschrieben.
   * ------------------------------------------------------------------------*/
  const cache = { blocks:{}, collections:{}, views:{}, meta:{} };

  const load = async () => {
    await open();
    (await all('blocks')).forEach(b      => cache.blocks[b.id] = b);
    (await all('collections')).forEach(c => cache.collections[c.id] = c);
    (await all('views')).forEach(v       => cache.views[v.id] = v);
    (await all('meta')).forEach(m        => cache.meta[m.k] = m.v);
  };

  /* --- IDs --------------------------------------------------------------- */
  const uid = () => (crypto.randomUUID
    ? crypto.randomUUID()
    : 'x'.replace(/x/g, () => Math.random().toString(36).slice(2) + Date.now().toString(36)));

  const now = () => new Date().toISOString();

  /* ========================================================================
   * BLÖCKE
   * ======================================================================*/

  /**
   * Legt einen Block an und hängt ihn beim Elternteil ein.
   * Wie bei Notion sind das zwei Schritte: Block anlegen UND in die
   * content-Liste des Elternteils eintragen. Wer den zweiten vergisst,
   * erzeugt einen unsichtbaren Waisenblock.
   */
  const addBlock = (parentId, type = 'text', patch = {}, index = -1) => {
    const b = Object.assign({
      id: uid(),
      type,
      text: '',
      content: [],          // IDs der Kindblöcke
      parentId,
      parentTable: 'block',
      color: '',
      created: now(),
      edited: now(),
      alive: true
    }, patch);

    cache.blocks[b.id] = b;

    const p = cache.blocks[parentId];
    if (p) {
      if (index < 0 || index >= p.content.length) p.content.push(b.id);
      else p.content.splice(index, 0, b.id);
      save('blocks', p);
    }
    save('blocks', b);
    return b;
  };

  const getBlock = (id) => cache.blocks[id] || null;

  const updateBlock = (id, patch) => {
    const b = cache.blocks[id];
    if (!b) return null;
    Object.assign(b, patch, { edited: now() });
    save('blocks', b);
    return b;
  };

  /** Verschiebt einen Block in den Papierkorb — wie in Notion erst 'alive: false'. */
  const trashBlock = (id) => {
    const b = cache.blocks[id];
    if (!b) return;
    b.alive = false;
    b.trashedAt = now();
    const p = cache.blocks[b.parentId];
    if (p) {
      p.content = p.content.filter(x => x !== id);
      save('blocks', p);
    }
    save('blocks', b);
  };

  const restoreBlock = (id) => {
    const b = cache.blocks[id];
    if (!b) return;
    b.alive = true;
    delete b.trashedAt;
    const p = cache.blocks[b.parentId];
    if (p && !p.content.includes(id)) { p.content.push(id); save('blocks', p); }
    save('blocks', b);
  };

  /** Löscht endgültig — samt aller Kinder. Danach ist nichts mehr zu retten. */
  const purgeBlock = (id) => {
    const b = cache.blocks[id];
    if (!b) return;
    (b.content || []).forEach(purgeBlock);
    if (b.collectionId) {
      const c = cache.collections[b.collectionId];
      if (c) {
        rowsOf(b.collectionId).forEach(r => { delete cache.blocks[r.id]; del('blocks', r.id); });
        (c.viewIds || []).forEach(v => { delete cache.views[v]; del('views', v); });
        delete cache.collections[b.collectionId];
        del('collections', b.collectionId);
      }
    }
    const p = cache.blocks[b.parentId];
    if (p) { p.content = p.content.filter(x => x !== id); save('blocks', p); }
    delete cache.blocks[id];
    del('blocks', id);
    notify('purge');
  };

  /** Die lebenden Kindblöcke in der richtigen Reihenfolge. */
  const childrenOf = (id) => {
    const b = cache.blocks[id];
    if (!b) return [];
    return (b.content || []).map(x => cache.blocks[x]).filter(x => x && x.alive);
  };

  /* ========================================================================
   * SEITEN
   * ======================================================================*/
  const addPage = (parentId = null, patch = {}) => {
    const p = addBlock(parentId, 'page', Object.assign({
      text: '', icon: '📄', cover: '', wide: false, font: 'default', small: false
    }, patch));
    notify('pages');
    return p;
  };

  /** Alle Seiten auf oberster Ebene (ohne Elternteil). */
  const rootPages = () => Object.values(cache.blocks)
    .filter(b => b.type === 'page' && b.alive && !b.parentId && b.parentTable !== 'collection')
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.created.localeCompare(b.created));

  const trashed = () => Object.values(cache.blocks)
    .filter(b => !b.alive && b.type === 'page')
    .sort((a, b) => (b.trashedAt || '').localeCompare(a.trashedAt || ''));

  const favorites = () => Object.values(cache.blocks)
    .filter(b => b.type === 'page' && b.alive && b.favorite);

  /** Der Pfad von der obersten Seite bis hierher — für die Breadcrumbs. */
  const pathOf = (id) => {
    const out = [];
    let cur = cache.blocks[id];
    let guard = 0;
    while (cur && guard++ < 50) {
      out.unshift(cur);
      cur = cur.parentId ? cache.blocks[cur.parentId] : null;
    }
    return out;
  };

  /* ========================================================================
   * DATENBANKEN
   * ------------------------------------------------------------------------
   * Aufbau exakt wie bei Notion:
   *   block (type 'database') --collectionId--> collection --viewIds--> views
   * ======================================================================*/

  const addDatabase = (parentId, name = 'Neue Datenbank', schema = null, layout = 'table') => {
    const colId  = uid();
    const viewId = uid();

    const s = schema || {
      title: { name: 'Name',   type: 'title'  },
      [uid().slice(0,4)]: { name: 'Status', type: 'select', options: [
        { name: 'Offen',    color: 'gray'   },
        { name: 'In Arbeit',color: 'blue'   },
        { name: 'Erledigt', color: 'green'  }
      ]},
      [uid().slice(0,4)]: { name: 'Datum',  type: 'date' }
    };

    cache.collections[colId] = {
      id: colId, name, icon: '🗂️', schema: s, viewIds: [viewId], created: now()
    };

    cache.views[viewId] = {
      id: viewId, collectionId: colId, name: 'Tabelle', layout,
      filters: { operator: 'and', rules: [] },
      sorts: [], groupBy: '', hidden: [], calc: {}, created: now()
    };

    const blk = addBlock(parentId, 'database', { collectionId: colId, text: name });

    save('collections', cache.collections[colId]);
    save('views', cache.views[viewId]);
    notify('db');
    return { block: blk, collectionId: colId, viewId };
  };

  const getCollection = (id) => cache.collections[id] || null;
  const getView       = (id) => cache.views[id] || null;

  const updateCollection = (id, patch) => {
    const c = cache.collections[id];
    if (!c) return null;
    Object.assign(c, patch);
    save('collections', c);
    return c;
  };

  const updateView = (id, patch) => {
    const v = cache.views[id];
    if (!v) return null;
    Object.assign(v, patch);
    save('views', v);
    return v;
  };

  const addView = (collectionId, layout = 'table', name = '') => {
    const c = cache.collections[collectionId];
    if (!c) return null;
    const namen = { table:'Tabelle', board:'Board', list:'Liste', gallery:'Galerie',
                    calendar:'Kalender', timeline:'Zeitstrahl', chart:'Diagramm', form:'Formular' };
    const v = {
      id: uid(), collectionId, layout,
      name: name || namen[layout] || 'Ansicht',
      filters: { operator: 'and', rules: [] },
      sorts: [], groupBy: '', hidden: [], calc: {}, created: now()
    };
    cache.views[v.id] = v;
    c.viewIds.push(v.id);
    save('views', v);
    save('collections', c);
    return v;
  };

  const removeView = (viewId) => {
    const v = cache.views[viewId];
    if (!v) return;
    const c = cache.collections[v.collectionId];
    if (c && c.viewIds.length > 1) {
      c.viewIds = c.viewIds.filter(x => x !== viewId);
      save('collections', c);
      delete cache.views[viewId];
      del('views', viewId);
    }
  };

  /** Eine Zeile ist ein Block vom Typ 'page' mit parentTable 'collection'. */
  const addRow = (collectionId, props = {}) => {
    const r = {
      id: uid(), type: 'page', text: props.title || '', icon: '',
      props, content: [], parentId: collectionId, parentTable: 'collection',
      created: now(), edited: now(), alive: true
    };
    cache.blocks[r.id] = r;
    save('blocks', r);
    notify('rows');
    return r;
  };

  const rowsOf = (collectionId) => Object.values(cache.blocks)
    .filter(b => b.parentTable === 'collection' && b.parentId === collectionId && b.alive)
    .sort((a, b) => a.created.localeCompare(b.created));

  const setProp = (rowId, key, value) => {
    const r = cache.blocks[rowId];
    if (!r) return;
    r.props = r.props || {};
    r.props[key] = value;
    r.edited = now();
    save('blocks', r);
  };

  /* ========================================================================
   * EINSTELLUNGEN
   * ======================================================================*/
  const setMeta = (k, v) => { cache.meta[k] = v; put('meta', { k, v }); };
  const getMeta = (k, fallback = null) => (k in cache.meta ? cache.meta[k] : fallback);

  /* --- Schreiben mit Verzögerung ----------------------------------------- */
  /* Beim Tippen soll nicht jeder Tastendruck eine Transaktion auslösen.     */
  const pending = new Map();
  let timer = null;

  const save = (store, val) => {
    pending.set(store + ':' + val.id, { store, val });
    clearTimeout(timer);
    timer = setTimeout(flush, 400);
  };

  const flush = () => {
    if (!db) return;
    pending.forEach(({ store, val }) => put(store, val));
    pending.clear();
  };

  /* Vor dem Schließen des Tabs alles rausschreiben. */
  window.addEventListener('beforeunload', flush);
  window.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  /* ========================================================================
   * SUCHE
   * ------------------------------------------------------------------------
   * Durchsucht Seitentitel UND Inhalt — wie Notions Quick Find.
   * ======================================================================*/
  const search = (q) => {
    const needle = q.trim().toLowerCase();
    if (!needle) return [];
    const out = [];

    Object.values(cache.blocks).forEach(b => {
      if (!b.alive) return;
      if (b.type === 'page' && b.parentTable !== 'collection') {
        const t = (b.text || '').toLowerCase();
        if (t.includes(needle)) { out.push({ page: b, treffer: 'Titel', snippet: b.text }); return; }
        /* Inhalt der Seite durchsuchen */
        const hit = findInside(b.id, needle, 0);
        if (hit) out.push({ page: b, treffer: 'Inhalt', snippet: hit });
      }
    });

    return out.slice(0, 40);
  };

  const findInside = (pageId, needle, tiefe) => {
    if (tiefe > 4) return null;
    for (const kid of childrenOf(pageId)) {
      const t = (kid.text || '').toLowerCase();
      if (t.includes(needle)) {
        const i = t.indexOf(needle);
        return '…' + kid.text.slice(Math.max(0, i - 30), i + 60) + '…';
      }
      const tiefer = findInside(kid.id, needle, tiefe + 1);
      if (tiefer) return tiefer;
    }
    return null;
  };

  /* ========================================================================
   * SICHERN UND ZURÜCKHOLEN
   * ------------------------------------------------------------------------
   * Weil alles lokal liegt, gehört ein Export dazu. Sonst hängen die Daten
   * an genau einem Browserprofil.
   * ======================================================================*/
  const exportAll = () => JSON.stringify({
    version: VERSION,
    exportiert: now(),
    blocks: cache.blocks,
    collections: cache.collections,
    views: cache.views,
    meta: cache.meta
  }, null, 2);

  const importAll = async (json) => {
    const d = JSON.parse(json);
    if (!d.blocks) throw new Error('Das sieht nicht nach einer Sicherung dieser App aus.');
    cache.blocks      = d.blocks      || {};
    cache.collections = d.collections || {};
    cache.views       = d.views       || {};
    cache.meta        = d.meta        || {};
    /* Alles neu schreiben */
    await Promise.all([
      ...Object.values(cache.blocks).map(b      => put('blocks', b)),
      ...Object.values(cache.collections).map(c => put('collections', c)),
      ...Object.values(cache.views).map(v       => put('views', v)),
      ...Object.entries(cache.meta).map(([k,v]) => put('meta', { k, v }))
    ]);
    notify('import');
  };

  /* ========================================================================
   * SEITENBAUM ALS DATENPAKET
   * ------------------------------------------------------------------------
   * Eine Seite mit allem, was daran hängt — Kindblöcke, Datenbanken,
   * Ansichten und Zeilen. Grundlage für Vorlagen, Versionen, das Sperren
   * und jeden Export.
   * ======================================================================*/
  const baum = (id) => {
    const raus = (bid, tiefe) => {
      const x = cache.blocks[bid];
      if (!x || tiefe > 40) return null;
      const k = JSON.parse(JSON.stringify(x));
      delete k.content;
      k.kinder = (x.content || []).map(c => raus(c, tiefe + 1)).filter(Boolean);
      if (x.collectionId && cache.collections[x.collectionId]) {
        const c = cache.collections[x.collectionId];
        k.collection = JSON.parse(JSON.stringify(c));
        k.views = (c.viewIds || []).map(v => cache.views[v]).filter(Boolean)
          .map(v => JSON.parse(JSON.stringify(v)));
        k.rows = rowsOf(c.id).map(r => JSON.parse(JSON.stringify(r)));
      }
      return k;
    };
    return raus(id, 0);
  };

  /** Setzt so ein Datenpaket wieder ein — immer mit frischen IDs. */
  const baumEinfuegen = (knoten, parentId, index = -1) => {
    if (!knoten) return null;

    const rein = (k, eltern, idx) => {
      const patch = Object.assign({}, k);
      delete patch.id; delete patch.kinder; delete patch.collection;
      delete patch.views; delete patch.rows; delete patch.content;
      patch.content = [];

      /* Datenbank: Sammlung, Ansichten und Zeilen mitkopieren */
      if (k.collection) {
        const neueColl = uid();
        const idKarte = {};
        const views = (k.views || []).map(v => {
          const nv = JSON.parse(JSON.stringify(v));
          idKarte[v.id] = nv.id = uid();
          nv.collectionId = neueColl;
          cache.views[nv.id] = nv;
          save('views', nv);
          return nv;
        });
        const nc = JSON.parse(JSON.stringify(k.collection));
        nc.id = neueColl;
        nc.viewIds = views.map(v => v.id);
        cache.collections[neueColl] = nc;
        save('collections', nc);
        patch.collectionId = neueColl;

        (k.rows || []).forEach(r => {
          const nr = JSON.parse(JSON.stringify(r));
          nr.id = uid();
          nr.parentId = neueColl;
          nr.parentTable = 'collection';
          cache.blocks[nr.id] = nr;
          save('blocks', nr);
        });
      }

      const neu = addBlock(eltern, k.type || 'text', patch, idx);
      (k.kinder || []).forEach(kind => rein(kind, neu.id, -1));
      return neu;
    };

    const wurzel = rein(knoten, parentId, index);
    notify('pages');
    return wurzel;
  };

  /** Entfernt alle Kindblöcke einer Seite (für Wiederherstellen und Sperren). */
  const kinderLeeren = (pageId) => {
    const p = cache.blocks[pageId];
    if (!p) return;
    [...(p.content || [])].forEach(id => purgeBlock(id));
    p.content = [];
    save('blocks', p);
  };

  /* ========================================================================
   * VERSIONSVERLAUF
   * ------------------------------------------------------------------------
   * Liegt bewusst nicht im Cache: alte Fassungen holt sich der Verlauf
   * erst, wenn ihn jemand öffnet.
   * ======================================================================*/
  const versionSpeichern = async (pageId, anlass = 'automatisch') => {
    const p = cache.blocks[pageId];
    if (!p) return null;
    const v = {
      id: uid(), pageId, zeit: now(), anlass,
      titel: p.text || 'Ohne Titel',
      icon: p.icon || '📄',
      daten: baum(pageId)
    };
    await put('versions', v);
    /* Nur die letzten 30 Fassungen je Seite behalten */
    const alle = await versionen(pageId);
    for (const alt of alle.slice(30)) await del('versions', alt.id);
    return v;
  };

  const versionen = (pageId) => new Promise((ok) => {
    if (!db || !db.objectStoreNames.contains('versions')) return ok([]);
    const r = tx(['versions'], 'readonly').objectStore('versions').index('page').getAll(pageId);
    r.onsuccess = () => ok((r.result || []).sort((a, b) => b.zeit.localeCompare(a.zeit)));
    r.onerror = () => ok([]);
  });

  const versionLoeschen = (id) => del('versions', id);

  /** Nur für den Notfall: alles weg. */
  const wipe = async () => {
    await Promise.all(['blocks','collections','views','meta','versions'].map(s => new Promise(ok => {
      const r = tx([s], 'readwrite').objectStore(s).clear();
      r.onsuccess = ok; r.onerror = ok;
    })));
    cache.blocks = {}; cache.collections = {}; cache.views = {}; cache.meta = {};
  };

  /* Wie viel Platz belegt die App? */
  const usage = async () => {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    const e = await navigator.storage.estimate();
    return { benutzt: e.usage, verfuegbar: e.quota };
  };

  return {
    load, uid, now, cache,
    addBlock, getBlock, updateBlock, trashBlock, restoreBlock, purgeBlock, childrenOf,
    addPage, rootPages, trashed, favorites, pathOf,
    addDatabase, getCollection, getView, updateCollection, updateView, addView, removeView,
    addRow, rowsOf, setProp,
    setMeta, getMeta, flush,
    baum, baumEinfuegen, kinderLeeren,
    versionSpeichern, versionen, versionLoeschen,
    search, exportAll, importAll, wipe, usage,
    on: (fn) => listeners.add(fn)
  };
})();

</script>
<script>
/* ===== js/formula.js ===== */
/* ============================================================================
 * formula.js — Die Formelsprache
 * ----------------------------------------------------------------------------
 * Eine Umsetzung von Notions Formelsprache 2.0: eigener Tokenizer, eigener
 * Parser, eigener Auswerter. Kein eval(), damit eine Formel niemals fremden
 * Code ausführen kann.
 *
 * Unterstützt:
 *   Zahlen, Texte, true/false
 *   prop("Name")
 *   + - * / % ^   == != > >= < <=   and or not   ? :
 *   if, ifs, empty, let, lets
 *   round floor ceil abs sqrt min max sum mean pow toNumber format length
 *   substring contains replace replaceAll lower upper trim split repeat join
 *   now today dateBetween dateAdd formatDate year month day date week hour minute
 *   style link
 *
 * WICHTIG — die Falle, an der fast jeder scheitert:
 *   Text wird mit + verkettet, NICHT mit concat().
 *   concat() ist ausschliesslich fuer Listen.
 * ==========================================================================*/

const Formula = (() => {

  /* ========================================================================
   * 1. TOKENIZER — Zeichen zu Wortmarken
   * ======================================================================*/
  const tokenize = (src) => {
    const out = [];
    let i = 0;

    const istZiffer = c => c >= '0' && c <= '9';
    const istBuchstabe = c => /[A-Za-zÄÖÜäöüß_]/.test(c);

    while (i < src.length) {
      const c = src[i];

      if (/\s/.test(c)) { i++; continue; }

      /* Text in Anführungszeichen */
      if (c === '"' || c === "'") {
        const ende = c;
        let s = '';
        i++;
        while (i < src.length && src[i] !== ende) {
          if (src[i] === '\\') { i++; s += src[i] === 'n' ? '\n' : src[i]; }
          else s += src[i];
          i++;
        }
        i++;
        out.push({ t: 'str', v: s });
        continue;
      }

      /* Zahl */
      if (istZiffer(c) || (c === '.' && istZiffer(src[i+1]))) {
        let s = '';
        while (i < src.length && (istZiffer(src[i]) || src[i] === '.')) s += src[i++];
        out.push({ t: 'num', v: parseFloat(s) });
        continue;
      }

      /* Name oder Schlüsselwort */
      if (istBuchstabe(c)) {
        let s = '';
        while (i < src.length && (istBuchstabe(src[i]) || istZiffer(src[i]))) s += src[i++];
        out.push({ t: 'name', v: s });
        continue;
      }

      /* Zwei-Zeichen-Operatoren zuerst */
      const zwei = src.slice(i, i + 2);
      if (['==','!=','>=','<=','&&','||'].includes(zwei)) {
        out.push({ t: 'op', v: zwei }); i += 2; continue;
      }

      /* Der Punkt gehört dazu, sonst funktioniert liste.map(...) nicht.
       * Zahlen wie 3.14 sind oben schon abgefangen. */
      if ('+-*/%^><(),?:[]!.'.includes(c)) { out.push({ t: 'op', v: c }); i++; continue; }

      /* Unbekanntes Zeichen einfach überspringen, statt alles abzubrechen */
      i++;
    }

    out.push({ t: 'end' });
    return out;
  };

  /* ========================================================================
   * 2. PARSER — Wortmarken zu Baum
   * ------------------------------------------------------------------------
   * Rekursiver Abstieg mit den üblichen Vorrangstufen:
   *   ?:  <  or  <  and  <  Vergleich  <  + -  <  * / %  <  ^  <  unär  <  Atom
   * ======================================================================*/
  const parse = (tok) => {
    let p = 0;
    const schau = () => tok[p];
    const nimm = () => tok[p++];
    const istOp = (v) => tok[p].t === 'op' && tok[p].v === v;
    const istName = (v) => tok[p].t === 'name' && tok[p].v.toLowerCase() === v;

    const erwarte = (v) => {
      if (!istOp(v)) throw new Error(`"${v}" erwartet`);
      p++;
    };

    /* Unterste Ebene: Zahl, Text, Klammer, Funktionsaufruf, Liste */
    const atom = () => {
      const t = schau();

      if (t.t === 'num') { nimm(); return { k: 'num', v: t.v }; }
      if (t.t === 'str') { nimm(); return { k: 'str', v: t.v }; }

      if (istOp('(')) { nimm(); const e = ternaer(); erwarte(')'); return e; }

      /* Liste: [1, 2, 3] */
      if (istOp('[')) {
        nimm();
        const items = [];
        if (!istOp(']')) {
          items.push(ternaer());
          while (istOp(',')) { nimm(); items.push(ternaer()); }
        }
        erwarte(']');
        return { k: 'list', items };
      }

      if (t.t === 'name') {
        const name = nimm().v;
        const klein = name.toLowerCase();

        if (klein === 'true')  return { k: 'bool', v: true  };
        if (klein === 'false') return { k: 'bool', v: false };
        if (klein === 'null' || klein === 'empty' && !istOp('(')) return { k: 'null' };

        /* Funktionsaufruf */
        if (istOp('(')) {
          nimm();
          const args = [];
          if (!istOp(')')) {
            args.push(ternaer());
            while (istOp(',')) { nimm(); args.push(ternaer()); }
          }
          erwarte(')');
          return { k: 'call', name: klein, args };
        }

        /* Blosser Name = Variable (aus let/lets) */
        return { k: 'var', name };
      }

      throw new Error('Unerwartetes Zeichen in der Formel');
    };

    /* Methodenaufruf: text.upper()  oder  liste.length() */
    const punkt = () => {
      let links = atom();
      while (schau().t === 'op' && schau().v === '.') {
        nimm();
        const m = nimm().v.toLowerCase();
        const args = [links];
        if (istOp('(')) {
          nimm();
          if (!istOp(')')) {
            args.push(ternaer());
            while (istOp(',')) { nimm(); args.push(ternaer()); }
          }
          erwarte(')');
        }
        links = { k: 'call', name: m, args };
      }
      return links;
    };

    const unaer = () => {
      if (istOp('-')) { nimm(); return { k: 'neg', a: unaer() }; }
      if (istOp('!'))  { nimm(); return { k: 'not', a: unaer() }; }
      if (istName('not')) { nimm(); return { k: 'not', a: unaer() }; }
      return punkt();
    };

    const potenz = () => {
      let l = unaer();
      while (istOp('^')) { nimm(); l = { k: 'bin', op: '^', l, r: unaer() }; }
      return l;
    };

    const punktrechnung = () => {
      let l = potenz();
      while (istOp('*') || istOp('/') || istOp('%')) {
        const op = nimm().v;
        l = { k: 'bin', op, l, r: potenz() };
      }
      return l;
    };

    const strichrechnung = () => {
      let l = punktrechnung();
      while (istOp('+') || istOp('-')) {
        const op = nimm().v;
        l = { k: 'bin', op, l, r: punktrechnung() };
      }
      return l;
    };

    const vergleich = () => {
      let l = strichrechnung();
      while (istOp('==') || istOp('!=') || istOp('>') || istOp('>=') || istOp('<') || istOp('<=')) {
        const op = nimm().v;
        l = { k: 'bin', op, l, r: strichrechnung() };
      }
      return l;
    };

    const und = () => {
      let l = vergleich();
      while (istOp('&&') || istName('and')) { nimm(); l = { k: 'bin', op: 'and', l, r: vergleich() }; }
      return l;
    };

    const oder = () => {
      let l = und();
      while (istOp('||') || istName('or')) { nimm(); l = { k: 'bin', op: 'or', l, r: und() }; }
      return l;
    };

    const ternaer = () => {
      const bedingung = oder();
      if (istOp('?')) {
        nimm();
        const dann = ternaer();
        erwarte(':');
        const sonst = ternaer();
        return { k: 'call', name: 'if', args: [bedingung, dann, sonst] };
      }
      return bedingung;
    };

    const baum = ternaer();
    return baum;
  };

  /* ========================================================================
   * 3. AUSWERTER
   * ======================================================================*/

  const istLeer = (v) => v === null || v === undefined || v === '' ||
                         (Array.isArray(v) && v.length === 0);

  const zahl = (v) => {
    if (typeof v === 'number') return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v instanceof Date) return v.getTime();
    if (istLeer(v)) return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? 0 : n;
  };

  const text = (v) => {
    if (v === null || v === undefined) return '';
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    if (Array.isArray(v)) return v.join(', ');
    if (typeof v === 'number') return String(Math.round(v * 1e10) / 1e10);
    return String(v);
  };

  const wahr = (v) => {
    if (typeof v === 'boolean') return v;
    if (typeof v === 'number') return v !== 0;
    return !istLeer(v);
  };

  const alsDatum = (v) => {
    if (v instanceof Date) return v;
    if (!v) return null;
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  };

  const TAG_MS = 86400000;

  /* Die Funktionsbibliothek */
  const F = {
    /* --- Bedingungen ---------------------------------------------------- */
    if:  (a) => wahr(a[0]) ? a[1] : a[2],
    ifs: (a) => {
      for (let i = 0; i + 1 < a.length; i += 2) if (wahr(a[i])) return a[i + 1];
      return a.length % 2 ? a[a.length - 1] : '';
    },
    empty:   (a) => a.length ? istLeer(a[0]) : '',
    equal:   (a) => a[0] === a[1],
    unequal: (a) => a[0] !== a[1],

    /* --- Mathematik ----------------------------------------------------- */
    add: a => zahl(a[0]) + zahl(a[1]),
    subtract: a => zahl(a[0]) - zahl(a[1]),
    multiply: a => zahl(a[0]) * zahl(a[1]),
    divide: a => zahl(a[1]) === 0 ? 0 : zahl(a[0]) / zahl(a[1]),
    mod: a => zahl(a[1]) === 0 ? 0 : zahl(a[0]) % zahl(a[1]),
    pow: a => Math.pow(zahl(a[0]), zahl(a[1])),
    abs: a => Math.abs(zahl(a[0])),
    round: a => a.length > 1
      ? Math.round(zahl(a[0]) * Math.pow(10, zahl(a[1]))) / Math.pow(10, zahl(a[1]))
      : Math.round(zahl(a[0])),
    floor: a => Math.floor(zahl(a[0])),
    ceil:  a => Math.ceil(zahl(a[0])),
    sqrt:  a => Math.sqrt(Math.max(0, zahl(a[0]))),
    cbrt:  a => Math.cbrt(zahl(a[0])),
    exp:   a => Math.exp(zahl(a[0])),
    ln:    a => zahl(a[0]) > 0 ? Math.log(zahl(a[0])) : 0,
    log10: a => zahl(a[0]) > 0 ? Math.log10(zahl(a[0])) : 0,
    log2:  a => zahl(a[0]) > 0 ? Math.log2(zahl(a[0])) : 0,
    sign:  a => Math.sign(zahl(a[0])),
    min: a => Math.min(...a.flat().map(zahl)),
    max: a => Math.max(...a.flat().map(zahl)),
    sum: a => a.flat().reduce((s, x) => s + zahl(x), 0),
    mean: a => { const f = a.flat(); return f.length ? f.reduce((s,x)=>s+zahl(x),0) / f.length : 0; },
    median: a => {
      const f = a.flat().map(zahl).sort((x, y) => x - y);
      if (!f.length) return 0;
      const m = Math.floor(f.length / 2);
      return f.length % 2 ? f[m] : (f[m-1] + f[m]) / 2;
    },
    pi: () => Math.PI,
    e:  () => Math.E,
    tonumber: a => zahl(a[0]),

    /* --- Text ------------------------------------------------------------ */
    format: a => text(a[0]),
    length: a => Array.isArray(a[0]) ? a[0].length : text(a[0]).length,
    substring: a => text(a[0]).substring(zahl(a[1]), a.length > 2 ? zahl(a[2]) : undefined),
    contains: a => Array.isArray(a[0]) ? a[0].includes(a[1]) : text(a[0]).includes(text(a[1])),
    includes: a => Array.isArray(a[0]) ? a[0].includes(a[1]) : text(a[0]).includes(text(a[1])),
    test: a => { try { return new RegExp(text(a[1])).test(text(a[0])); } catch { return false; } },
    match: a => { try { return (text(a[0]).match(new RegExp(text(a[1]), 'g')) || []); } catch { return []; } },
    replace: a => { try { return text(a[0]).replace(new RegExp(text(a[1])), text(a[2])); }
                    catch { return text(a[0]).replace(text(a[1]), text(a[2])); } },
    replaceall: a => { try { return text(a[0]).replace(new RegExp(text(a[1]), 'g'), text(a[2])); }
                       catch { return text(a[0]).split(text(a[1])).join(text(a[2])); } },
    lower: a => text(a[0]).toLowerCase(),
    upper: a => text(a[0]).toUpperCase(),
    trim:  a => text(a[0]).trim(),
    split: a => text(a[0]).split(text(a[1])),
    repeat: a => text(a[0]).repeat(Math.max(0, Math.min(500, Math.floor(zahl(a[1]))))),
    join: a => (Array.isArray(a[0]) ? a[0] : [a[0]]).map(text).join(text(a[1] ?? ', ')),

    /* --- Listen ---------------------------------------------------------- */
    at:    a => (a[0] || [])[zahl(a[1])],
    first: a => Array.isArray(a[0]) ? a[0][0] : text(a[0])[0],
    last:  a => Array.isArray(a[0]) ? a[0][a[0].length-1] : text(a[0]).slice(-1),
    slice: a => (a[0] || []).slice(zahl(a[1]), a.length > 2 ? zahl(a[2]) : undefined),
    concat: a => [].concat(...a.map(x => Array.isArray(x) ? x : [x])),
    reverse: a => (a[0] || []).slice().reverse(),
    unique: a => [...new Set(a[0] || [])],
    sort: a => (a[0] || []).slice().sort(),
    flat: a => (a[0] || []).flat(),

    /* --- Datum ----------------------------------------------------------- */
    now:   () => new Date(),
    today: () => { const d = new Date(); d.setHours(0,0,0,0); return d; },
    dateadd: a => {
      const d = alsDatum(a[0]); if (!d) return null;
      const n = zahl(a[1]); const e = text(a[2]).toLowerCase();
      const r = new Date(d);
      if (e.startsWith('day'))   r.setDate(r.getDate() + n);
      if (e.startsWith('week'))  r.setDate(r.getDate() + n * 7);
      if (e.startsWith('month')) r.setMonth(r.getMonth() + n);
      if (e.startsWith('year'))  r.setFullYear(r.getFullYear() + n);
      if (e.startsWith('hour'))  r.setHours(r.getHours() + n);
      if (e.startsWith('minute'))r.setMinutes(r.getMinutes() + n);
      return r;
    },
    datesubtract: a => F.dateadd([a[0], -zahl(a[1]), a[2]]),
    datebetween: a => {
      const d1 = alsDatum(a[0]), d2 = alsDatum(a[1]);
      if (!d1 || !d2) return 0;
      const e = text(a[2] || 'days').toLowerCase();
      const ms = d1 - d2;
      if (e.startsWith('minute')) return Math.round(ms / 60000);
      if (e.startsWith('hour'))   return Math.round(ms / 3600000);
      if (e.startsWith('day'))    return Math.round(ms / TAG_MS);
      if (e.startsWith('week'))   return Math.round(ms / (TAG_MS * 7));
      if (e.startsWith('month'))  return (d1.getFullYear()-d2.getFullYear())*12 + (d1.getMonth()-d2.getMonth());
      if (e.startsWith('year'))   return d1.getFullYear() - d2.getFullYear();
      return Math.round(ms / TAG_MS);
    },
    timestamp: a => { const d = alsDatum(a[0]); return d ? d.getTime() : 0; },
    fromtimestamp: a => new Date(zahl(a[0])),
    parsedate: a => alsDatum(a[0]),
    year:   a => { const d = alsDatum(a[0]); return d ? d.getFullYear() : 0; },
    month:  a => { const d = alsDatum(a[0]); return d ? d.getMonth() + 1 : 0; },
    date:   a => { const d = alsDatum(a[0]); return d ? d.getDate() : 0; },
    /* Notion zählt den Wochentag ab Montag = 1 */
    day:    a => { const d = alsDatum(a[0]); return d ? (d.getDay() === 0 ? 7 : d.getDay()) : 0; },
    hour:   a => { const d = alsDatum(a[0]); return d ? d.getHours() : 0; },
    minute: a => { const d = alsDatum(a[0]); return d ? d.getMinutes() : 0; },
    week:   a => {
      const d = alsDatum(a[0]); if (!d) return 0;
      const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const wt = t.getUTCDay() || 7;
      t.setUTCDate(t.getUTCDate() + 4 - wt);
      const jahresanfang = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
      return Math.ceil((((t - jahresanfang) / TAG_MS) + 1) / 7);
    },
    formatdate: a => {
      const d = alsDatum(a[0]); if (!d) return '';
      const f = text(a[1] || 'YYYY-MM-DD');
      const zwei = n => String(n).padStart(2, '0');
      const tage  = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
      const kurz  = ['So','Mo','Di','Mi','Do','Fr','Sa'];
      const monate= ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
      /* Text in eckigen Klammern bleibt wörtlich stehen: "YYYY-[W]WW" -> "2026-W31".
       * Deshalb erst herausnehmen, am Ende wieder einsetzen. */
      const woertlich = [];
      let vorlage = f.replace(/\[([^\]]*)\]/g, (_, inhalt) => {
        woertlich.push(inhalt);
        return '\u0001' + (woertlich.length - 1) + '\u0001';
      });

      return vorlage
        .replace(/YYYY/g, d.getFullYear())
        .replace(/YY/g,   String(d.getFullYear()).slice(-2))
        .replace(/MMMM/g, monate[d.getMonth()])
        .replace(/MMM/g,  monate[d.getMonth()].slice(0,3))
        .replace(/MM/g,   zwei(d.getMonth() + 1))
