<!-- =========================================================================
     ANMELDE-FENSTER
     Wenn Google die Anmeldung zurückschickt, landet der Schlüssel hier im
     Adresszeilen-Anhang. Dieses Fenster ist dann nur der Bote: es reicht den
     Schlüssel an das Hauptfenster weiter und schliesst sich. Die App selbst
     wird gar nicht erst geladen.
     ====================================================================== -->
<script>
(function () {
  var h = location.hash || '';
  if (!window.opener || !/[#&](access_token|error)=/.test(h)) return;
  var p = new URLSearchParams(h.replace(/^#/, ''));
  var d = { art: 'oauth-antwort' };
  p.forEach(function (v, k) { d[k] = v; });
  if (p.get('error')) d.fehler = p.get('error_description') || p.get('error');
  try { window.opener.postMessage(d, location.origin); } catch (e) {}
  window.__nurBote = true;
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML =
      '<div style="font:15px system-ui;padding:40px;text-align:center">' +
      (d.fehler ? 'Google meldet: ' + d.fehler : 'Fertig. Dieses Fenster kann zu.') + '</div>';
  });
  setTimeout(function () { window.close(); }, d.fehler ? 3000 : 250);
})();
</script>

<!-- =========================================================================
     DIE BEREICHSLEISTE OBEN — nur auf dem Telefon
     -------------------------------------------------------------------------
     Eine Reihe von Pillen: das Konto ganz links, dann die vier Bereiche.
     NUR DIE AKTIVE PILLE TRÄGT IHREN NAMEN; die übrigen sind Kreise mit
     ihrem Zeichen. Das ist der Trick, mit dem fünf Ziele in 428 Pixel
     passen, ohne dass man raten muss, wo man ist — der Name steht immer
     genau dort, wo man gerade ist.

     Die Kennungen `hl-*` bleiben, wie sie waren: daran hängen die
     Bedienhandler in `schale.ts` und die Markierung in `seitenleiste.ts`.
     Eine Umbenennung hätte nichts verbessert und alles gelöst, was daran
     hängt.
     ====================================================================== -->
<div id="handy-oben" role="tablist" aria-label="Hauptbereiche">
  <!-- Die gleitende Pille. Sie liegt HINTER den Knöpfen und wandert beim
       Reiterwechsel dorthin, wo die neue Auswahl steht; die Knöpfe selbst
       bleiben durchsichtig. Ein Hintergrund, der springt, sagt „ein
       anderer Knopf" — einer, der wandert, sagt „derselbe Ort, weiter
       vorn". Sie steht als erstes Kind, damit sie auch ohne Stilblatt
       nicht über den Knöpfen liegt. Sie ist leer und aus dem Baum
       genommen: Vorleseprogramme sollen die vier Reiter finden, nicht
       fünf Dinge. -->
  <i id="ho-pille" class="stumm" aria-hidden="true"></i>
  <button id="hl-konto" class="ho-konto" title="Arbeitsbereich"><span>R</span></button>
  <button id="hl-start" role="tab" title="Start"><span class="ho-z"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></span><b>Start</b></button>
  <button id="hl-seiten" role="tab" title="Seiten"><span class="ho-z"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7L18.5 8v12.5h-12z"/><path d="M13.5 3.5V8h5"/><path d="M9.5 12.5h6M9.5 16h4"/></svg></span><b>Seiten</b></button>
  <button id="hl-bespr" role="tab" title="Besprechungen"><span class="ho-z"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01"/></svg></span><b>Termine</b></button>
  <button id="hl-mehr" role="tab" title="Mehr"><span class="ho-z"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span><b>Mehr</b><i class="hl-punkt" hidden></i></button>
</div>

<!-- =========================================================================
     DIE DREI SCHWEBENDEN KNÖPFE UNTEN — nur auf dem Telefon
     -------------------------------------------------------------------------
     Suchen · KI fragen · Neue Seite. Sie stehen NICHT in einer geschlossenen
     Leiste, sondern schweben über dem Inhalt: der Daumen erreicht sie, und
     der Bildschirm bleibt trotzdem ganz. Die Mitte ist die breiteste und
     die einzige mit Text — nach ihr greift man am häufigsten.
     ====================================================================== -->
<div id="handy-unten" aria-label="Schnellzugriff">
  <button id="hu-suche" title="Suchen"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
  <button id="hu-ki" title="KI fragen">
    <span class="hu-av">✨</span><b>KI fragen</b><i class="hu-mik"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9.25" y="3" width="5.5" height="10" rx="2.75"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></i>
  </button>
  <button id="hu-neu" title="Neue Seite"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12v6.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6.5"/><path d="M17.5 3.5 21 7l-8.5 8.5H9v-3.5z"/></svg></button>

<!-- Die kurze Meldung unten. `role="status"` mit `aria-live="polite"` ist
     der Unterschied zwischen „steht da" und „wird gesagt": ohne beides
     erscheint „Gespeichert" oder „3 Zeilen gelöscht" nur auf dem Bildschirm,
     und wer nicht hinsieht, erfährt es nie. `polite` unterbricht dabei nicht
     mitten im Satz — ein Toast ist nie so dringend, dass er das dürfte.
     `aria-atomic` sorgt dafür, dass der ganze neue Text vorgelesen wird und
     nicht nur die geänderten Wörter. -->

     wurde, ohne den Ordner js), sagt die Seite das laut, statt still
     nichts zu tun. -->
<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    if (typeof App === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="banner fehler"><span>Die Programmdateien im Ordner ' +
        '<b>js</b> wurden nicht gefunden. Bitte den ganzen Ordner zusammen halten ' +
        '&mdash; oder einfach <b>redion-einzeldatei.html</b> &ouml;ffnen, ' +
        'da ist alles drin.</span></div>');
    }
  }, 1200);
});
</script>
