<!-- =========================================================================
     ANMELDE-FENSTER
     Wenn Google die Anmeldung zurückschickt, landet der Schlüssel hier im
     Adresszeilen-Anhang. Dieses Fenster ist dann nur der Bote: es reicht den
     Schlüssel an das Hauptfenster weiter und schliesst sich. Die App selbst
     wird gar nicht erst geladen.
     ====================================================================== -->
<script>
(function () {
  var h = location.hash || '';
  if (!window.opener || !/[#&](access_token|error)=/.test(h)) return;
  var p = new URLSearchParams(h.replace(/^#/, ''));
  var d = { art: 'oauth-antwort' };
  p.forEach(function (v, k) { d[k] = v; });
  if (p.get('error')) d.fehler = p.get('error_description') || p.get('error');
  try { window.opener.postMessage(d, location.origin); } catch (e) {}
  window.__nurBote = true;
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML =
      '<div style="font:15px system-ui;padding:40px;text-align:center">' +
      (d.fehler ? 'Google meldet: ' + d.fehler : 'Fertig. Dieses Fenster kann zu.') + '</div>';
  });
  setTimeout(function () { window.close(); }, d.fehler ? 3000 : 250);
})();
</script>
</head>
<!-- `data-schale` STEHT HIER UND WIRD NICHT GESETZT (E272).
     Ein Skript, das es nach dem Laden anhängt, hiesse: die alte Schale wird
     erst gezeichnet und dann ersetzt — sichtbar als Zucken. Fest im Markup
     gilt es ab dem ersten Bild.
     Es ist seit Phase J kein Schalter mehr: `einfach.css` — die Datei, die
     auf sein Fehlen wartete — ist gelöscht. Das Attribut steht weiter da,
     weil `premium.css` daran hängt und weil ein Selektor, der eine Fassung
     benennt, besser liest als einer, der sie voraussetzt. -->
<body data-schale="premium">

<!-- =========================================================================
     DIE BEREICHSLEISTE OBEN — nur auf dem Telefon
     -------------------------------------------------------------------------
     Eine Reihe von Pillen: das Konto ganz links, dann die vier Bereiche.
     NUR DIE AKTIVE PILLE TRÄGT IHREN NAMEN; die übrigen sind Kreise mit
     ihrem Zeichen. Das ist der Trick, mit dem fünf Ziele in 428 Pixel
     passen, ohne dass man raten muss, wo man ist — der Name steht immer
     genau dort, wo man gerade ist.

     Die Kennungen `hl-*` bleiben, wie sie waren: daran hängen die
     Bedienhandler in `schale.ts` und die Markierung in `seitenleiste.ts`.
     Eine Umbenennung hätte nichts verbessert und alles gelöst, was daran
     hängt.
     ====================================================================== -->
<!-- ═══════════════════════════════════════════════════════════════════════
     DIE NAVIGATION — UNTEN, WO DER DAUMEN IST (E236)
     ───────────────────────────────────────────────────────────────────────
     Sie stand als Kreisleiste GANZ OBEN, und darüber lagen dann noch die
     Menüleiste und die Krume: drei Bänke, 169 px von 844, bevor der erste
     Deckel kommt.

     Redur: „dann unten sollte max 4-5 Sachen sein." Es sind fünf.

     WAS AUS DEN SECHS KREISEN WURDE, damit niemand einen Weg sucht:
       R (Arbeitsbereich)  → rechts in die Menüleiste
       Lernen              → bleibt
       Heute (Start)       → bleibt
       Seiten (Workspace)  → ins Mehr-Blatt
       Termine             → bleibt
       Mehr                → bleibt
     Und NEU dazu: Dokumente — das Regal, wo Redion jetzt öffnet.

     Die alte schwebende Leiste (Suche · KI fragen · Neu) gibt es nicht
     mehr: Suche und KI stehen rechts in der Menüleiste, „Neu" ist der
     grosse „+ Neu"-Knopf im Regal.
     ═══════════════════════════════════════════════════════════════════ -->
<nav id="handy-oben" role="tablist" aria-label="Hauptbereiche">
  <!-- Die gleitende Pille. Sie liegt HINTER den Knöpfen und wandert beim
       Reiterwechsel dorthin, wo die neue Auswahl steht; die Knöpfe selbst
       bleiben durchsichtig. Ein Hintergrund, der springt, sagt „ein
       anderer Knopf" — einer, der wandert, sagt „derselbe Ort, weiter
       vorn". Sie steht als erstes Kind, damit sie auch ohne Stilblatt
       nicht über den Knöpfen liegt. Sie ist leer und aus dem Baum
       genommen: Vorleseprogramme sollen die fünf Reiter finden, nicht
       sechs Dinge. -->
  <i id="ho-pille" class="stumm" aria-hidden="true"></i>
  <button id="hl-dok" role="tab" title="Dokumente"><span class="ho-z" data-sym="library" data-sym-groesse="19"></span><b>Dokumente</b></button>
  <button id="hl-start" role="tab" title="Heute"><span class="ho-z" data-sym="home" data-sym-groesse="19"></span><b>Heute</b></button>
  <button id="hl-lernen" role="tab" title="Lernen"><span class="ho-z" data-sym="learn" data-sym-groesse="19"></span><b>Lernen</b></button>
  <button id="hl-bespr" role="tab" title="Termine"><span class="ho-z" data-sym="calendarDays" data-sym-groesse="19"></span><b>Termine</b></button>
  <button id="hl-mehr" role="tab" title="Mehr"><span class="ho-z" data-sym="dots" data-sym-groesse="19"></span><b>Mehr</b><i class="hl-punkt" hidden></i></button>
</nav>

<!-- =========================================================================
     HIER STANDEN DIE DREI SCHWEBENDEN KNÖPFE — bis E236
     -------------------------------------------------------------------------
     Suchen · KI fragen · Neue Seite, schwebend über dem Inhalt: der Daumen
     erreichte sie, und der Bildschirm blieb trotzdem ganz. Das war richtig,
     SOLANGE unten sonst nichts stand.

     Seit E236 steht dort die Wegeleiste, und zwei Leisten am unteren Rand
     sind eine zu viel. Die drei Wege sind nicht weg, sie stehen dort, wo
     sie an einem Rechner auch stünden:

       Suchen     → `mb-suche` rechts in der Menüleiste (und Strg + P)
       KI fragen  → `mb-ki`    rechts in der Menüleiste (und Strg + J)
       Neue Seite → der grosse „+ Neu"-Knopf im Regal, und das Mehr-Blatt

     Der Absatz bleibt stehen, weil `hu-suche`, `hu-ki` und `hu-neu` in
     älterer Doku und in Prüfläufen vorkommen — wer danach sucht, soll hier
     lesen, wohin sie gegangen sind, statt gar nichts zu finden.
     ====================================================================== -->
